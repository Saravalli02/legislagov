<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0e">
<script>try{if(localStorage.getItem("lgw_tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Atendimento WhatsApp · LegislaGov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* LegislaGov · Atendimento WhatsApp — mesmo padrão do painel administrativo:
   menu lateral preto, fonte Inter, cantos arredondados, botão principal claro.
   Fundo escuro por padrão; "Aparência" troca para fundo branco. */
:root{
  --side:#0b0c0e; --side-ink:#dfe5ee; --side-muted:#8792a3; --side-hover:rgba(255,255,255,.06); --side-active:rgba(57,189,246,.14); --side-line:rgba(255,255,255,.08);
  --accent:#39bdf6; --accent-ink:#06121c; --amber:#e5a823; --red:#f0646f; --green:#3fcf8e;
  --paper:#0a0a0b; --paper-raised:#111214; --paper-2:#16171a; --ink:#f3f4f6; --ink-soft:#9a9fa6;
  --line:#1f2125; --line-strong:#2c2f34; --primary:#f2f3f5; --on-primary:#0b0c0e;
  --brass:var(--amber); --brick:var(--red); --sage:var(--green);
  --tint:rgba(255,255,255,.05); --tint-2:rgba(255,255,255,.09);
  --wa-bg:#0d0e10; --wa-dot:rgba(255,255,255,.035); --wa-in:#1b1c20; --wa-out:#103149; --wa-bot:#2a2312; --wa-sys:#17181b; --wa-file:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 18px 50px rgba(0,0,0,.45);
  --radius:14px; --radius-sm:10px; --pill:999px;
  --font-display:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-body:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --paper:#f4f5f7; --paper-raised:#ffffff; --paper-2:#f7f8fa; --ink:#0e1116; --ink-soft:#5b6270;
  --line:#e7e9ed; --line-strong:#d6d9df; --primary:#0b0c0e; --on-primary:#ffffff;
  --accent:#0a9bd8; --amber:#b9800c; --red:#d43d4b; --green:#14915a;
  --tint:rgba(11,12,14,.04); --tint-2:rgba(11,12,14,.07);
  --wa-bg:#efeae2; --wa-dot:rgba(11,12,14,.045); --wa-in:#ffffff; --wa-out:#dcf1fc; --wa-bot:#fbf1d9; --wa-sys:#ffffff; --wa-file:rgba(11,12,14,.05);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06); --shadow-md:0 18px 50px rgba(16,24,40,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#root{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- botões e campos ---------- */
.btn-primary,.btn-secondary,.btn-brass,.mini-btn{border-radius:var(--radius-sm);font-weight:600;transition:background .15s,border-color .15s,opacity .15s}
.btn-primary{background:var(--primary);color:var(--on-primary);border:0;padding:10px 16px}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled,.btn-secondary:disabled,.btn-brass:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong);padding:9px 14px}
.btn-secondary:hover{background:var(--tint)}
.btn-brass{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px}
.btn-brass:hover{opacity:.9}
.mini-btn{font-size:12.5px;color:var(--ink);background:transparent;border:1px solid var(--line-strong);padding:6px 11px;white-space:nowrap}
.mini-btn:hover{background:var(--tint)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.field input,.field select,.field textarea{background:var(--paper-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 13px;width:100%;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field textarea{min-height:92px;resize:vertical;line-height:1.45}
.field .dica{font-size:12px;color:var(--ink-soft)}

/* ---------- login (sempre escuro, igual ao painel) ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:radial-gradient(1100px 520px at 50% -8%,#1b1c1f 0%,#0a0a0b 55%,#000 100%);color:#f3f4f6}
.login-card{width:100%;max-width:400px;background:#0d0e10;border:1px solid #24262a;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.65);padding:30px 30px 24px;display:flex;flex-direction:column;gap:16px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:18px;border-bottom:1px solid #24262a}
.login-logo img{width:260px;height:auto}
.login-logo span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#39bdf6;font-weight:600}
.login-card .field label{color:#9a9fa6}
.login-card .field input{background:#141517;border-color:#2c2f34;color:#f3f4f6}
.login-card .btn-primary{background:#f2f3f5;color:#0b0c0e;height:46px}
.login-card .erro{color:#f0646f;font-size:13px;margin:0}
.demo-note{font-size:12.5px;color:#d6c38c;background:#141209;border:1px solid #3a3220;border-radius:10px;padding:10px 12px;line-height:1.5}
.login-foot{text-align:center;font-size:12px;color:#7d828a}
.login-foot b{color:#e6e7e9}.login-foot b i{font-style:normal;color:#39bdf6}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.sidebar{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 6px 18px;border-bottom:1px solid var(--side-line);margin-bottom:14px}
.brand img{width:150px;height:auto}
.brand-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-left:2px}
.demo-chip{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:#d6c38c;background:#141209;border:1px solid #3a3220;border-radius:var(--pill);padding:2px 8px}
.status-switch{display:flex;gap:4px;padding:4px;background:#141517;border:1px solid #26282c;border-radius:10px;margin:0 2px 14px}
.status-switch button{flex:1;padding:7px 0;font-size:12px;border-radius:7px;color:#8f949b;background:none;border:0;font-weight:500}
.status-switch button.current{background:#2a2c31;color:#fff}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:10px 12px 6px;font-weight:600}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:9px 12px;border:0;border-radius:9px;background:transparent;color:var(--side-ink);font-size:14px;text-align:left;position:relative}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.9}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-active);color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--amber);color:#1a1300;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 6px}
.avatar{width:34px;height:34px;border-radius:50%;background:#1d1f23;border:1px solid #30333a;color:#e6e7e9;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.user-chip strong{display:block;color:var(--side-ink);font-size:13px;font-weight:600;line-height:1.25}
.user-chip span{display:block;color:var(--side-muted);font-size:12px}
.foot-btns{display:flex;gap:6px}
.logout-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:1px solid #2a2d33;color:#c9ccd1;font-size:12.5px;padding:8px 10px;border-radius:9px}
.logout-btn svg{width:14px;height:14px}
.logout-btn:hover{background:var(--side-hover);color:#fff}
.sidebar-org{font-size:11.5px;color:var(--side-muted);text-align:center}
.sidebar-org b{color:#e6e7e9;font-weight:600}.sidebar-org b i{font-style:normal;color:var(--accent)}

.main{min-width:0;overflow-y:auto;padding-block:28px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
.main.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
h1.page-title{font-size:26px;margin:4px 0 0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.card h2{font-size:17px;margin:0 0 4px;font-weight:600}
.card .sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--tint);border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink-soft);font-size:13px;margin-bottom:18px}
.banner strong{color:var(--ink)}
.banner.ok{border-color:color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 9%,transparent)}
.banner.alerta{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-wait{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.chip-me{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.chip-topic{background:var(--tint);color:var(--ink-soft);border:1px solid var(--line)}
.empty{padding:28px 18px;color:var(--ink-soft);font-size:13px}
.sec-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:18px 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.debt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.debt>span:first-child{min-width:0}
.debt .amt{font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;font-weight:600}
.debt.late .amt,.debt.late>span:first-child{color:var(--red)}
.api-note{font-size:12px;color:var(--ink-soft);margin-top:10px;display:flex;gap:6px;align-items:center}
.api-note .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.side-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.side-btns button{width:100%}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--tint);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;font-size:12.5px;color:var(--ink-soft)}
.quick button:hover{color:var(--ink);border-color:var(--line-strong)}
.copy-row{display:flex;gap:8px}
.copy-row input{flex:1;min-width:0}

/* ---------- tabelas ---------- */
.table-wrap{overflow-x:auto}
table.docket{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
table.docket th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line-strong)}
table.docket td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.docket tr:hover td{background:var(--tint)}

/* ---------- ITBI ---------- */
.itbi-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.doc-preview{border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper-2);padding:18px;font-family:Georgia,serif;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.doc-preview mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink);padding:0 3px;border-radius:4px}
.extracted{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.calc{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.calc .v{text-align:right;font-variant-numeric:tabular-nums}
.calc .total{font-weight:700;font-size:15.5px;border-top:1px solid var(--line);padding-top:8px}
.ai-flag{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);background:color-mix(in srgb,var(--amber) 9%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px}

/* ---------- menus do bot ---------- */
.tree{font-size:13.5px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line-strong)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:5px 0}
.opt{display:inline-flex;gap:8px;align-items:baseline}
.opt .k{color:var(--accent);font-weight:700;min-width:16px}
.opt .act{font-size:12px;color:var(--ink-soft)}
.off{opacity:.5}

/* ---------- relatórios ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat-row>div{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat-row strong{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat-row span{font-size:12.5px;color:var(--ink-soft)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:10px;background:var(--tint-2);border-radius:var(--pill);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:var(--pill)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- janela, aviso e instalação ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{width:100%;max-width:440px;background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-md);padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 40px);overflow-y:auto}
.modal-card h2{font-size:18px;margin:0;font-weight:700}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.toast{position:fixed;z-index:60;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));padding:14px 16px;background:#16171a;color:#f3f4f6;border:1px solid #2c2f34;border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.4);font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast strong{display:block;color:#39bdf6;font-size:12.5px;margin-bottom:2px}
.inst{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));width:min(560px,calc(100vw - 32px));display:flex;align-items:center;gap:14px;padding:12px 14px;background:#0d0e10;color:#e9eaec;border:1px solid #2c2f34;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:13.5px}
.inst img{width:42px;height:42px;flex:none;border-radius:10px}
.inst div{flex:1;min-width:0}
.inst strong{display:block;color:#fff;font-weight:600}
.inst span{color:#9a9fa6;font-size:12.5px}
.inst .btn-brass{flex:none}
.inst .x{background:none;border:0;color:#9a9fa6;font-size:20px;line-height:1;padding:4px 6px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- conversas com aparência de WhatsApp ---------- */
.wa{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);position:relative}
.wa.with-info{grid-template-columns:minmax(300px,380px) minmax(0,1fr) 320px}
.wa-list{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--paper-raised)}
.wa-list-head{display:flex;justify-content:space-between;align-items:center;padding:18px 14px 10px 18px}
.wa-list-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.015em}
.conexao{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.conexao .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.conexao.on{color:var(--green)}.conexao.on .dot{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.conexao.off{color:var(--amber)}.conexao.off .dot{background:var(--amber)}
.wa-icon{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.wa-icon:hover{background:var(--tint-2);color:var(--ink)}
.wa-icon svg{width:20px;height:20px}
.wa-search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--pill);padding:0 14px;color:var(--ink-soft)}
.wa-search svg{width:16px;height:16px;flex:none}
.wa-search input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none;color:var(--ink)}
.wa-search:focus-within{border-color:var(--accent)}
.wa-filters{display:flex;gap:6px;padding:0 12px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.wa-filters button{border:1px solid var(--line);background:var(--tint);color:var(--ink-soft);border-radius:var(--pill);padding:5px 12px;font-size:13px;white-space:nowrap;font-weight:500}
.wa-filters button:hover{color:var(--ink)}
.wa-filters button.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.wa-filters button span{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}
.wa-items{overflow-y:auto;flex:1;min-height:0}
.wa-item{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 14px;border:0;background:none;text-align:left;color:var(--ink)}
.wa-item:hover{background:var(--tint)}
.wa-item.sel{background:var(--tint-2)}
.wa-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line)}
.wa-row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.wa-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

function isoLocal(ts){const d=new Date(ts*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hhmm(ts){return new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function quandoLista(ts){return isoLocal(ts)===isoLocal(Date.now()/1000)?hhmm(ts):isoLocal(ts)===isoLocal(Date.now()/1000-86400)?'Ontem':new Date(ts*1000).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtTel(t){t=String(t||'');if(t.startsWith('55')&&t.length>=12){const d=t.slice(2);return `(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}`;}return t?'+'+t:'—';}
function deServidor(c,eu){
  const st=c.status==='encerrada'?'enc':c.status==='atendimento'?(c.atendente===eu?'meu':'outro'):c.status;
  return {id:c.id,real:true,nome:c.nome||fmtTel(c.tel),tel:fmtTel(c.tel),telRaw:c.tel,doc:'—',insc:'—',end:'—',assunto:c.assunto||'Sem assunto',
    status:st,atendente:c.atendente_nome||'',hora:quandoLista(c.atualizada),unread:c.nao_lidas,janela:c.janela_24h,debitos:[],aberta:c.aberta,encerrada:c.encerrada,
    msgs:c.msgs.map(m=>({f:m.origem==='in'?'in':m.origem==='bot'?'bot':m.origem==='sys'?'sys':'out',t:hhmm(m.quando),d:isoLocal(m.quando),x:m.texto,by:m.autor,erro:m.erro}))};
}
function histDeConversas(){
  HIST.length=0;
  CONVS.filter(c=>c.status==='enc').forEach(c=>{const pri=c.msgs.find(m=>m.f==='in');const at=[...c.msgs].reverse().find(m=>m.f==='out');
    HIST.push({id:c.id,data:isoLocal(c.encerrada||c.aberta),nome:c.nome,tel:c.tel,insc:'—',assunto:c.assunto,atendente:at?(at.by||'Atendente'):'Robô',resumo:pri?(pri.x||'').slice(0,60):'',msgs:c.msgs});});
}
async function carregarConversas(forcar){
  if(!API.real||!S.user) return;
  try{
    const d=await api('/api/whatsapp/conversas');
    const mudouCon=API.conectado!==d.conectado; API.conectado=d.conectado; API.ultimo=d.ultimo_aviso;
    if(!forcar&&d.ver===API.ver&&!mudouCon) return;
    API.ver=d.ver; CONVS=d.conversas.map(c=>deServidor(c,d.eu.id)); histDeConversas();
    if(S.sel&&!CONVS.find(c=>c.id===S.sel)) S.sel=null;
    redesenhar();
  }catch(e){ if(e.status===401){ pararSincronia(); S.user=null; render(); toast('Sessão encerrada','Entre de novo para continuar.'); } }
}
function iniciarSincronia(){ pararSincronia(); carregarConversas(true); API.timer=setInterval(()=>carregarConversas(false),4000); }
function pararSincronia(){ if(API.timer) clearInterval(API.timer); API.timer=null; }
/* redesenha sem perder o que está sendo digitado nem a rolagem da conversa */
function redesenhar(){
  if(!['atendimento','historico','relatorios'].includes(S.view)){ const n=document.querySelector('[data-view="atendimento"] .count'); return; }
  const ae=document.activeElement, id=ae&&ae.id, val=ae&&'value' in ae?ae.value:null, sel=ae&&ae.selectionStart;
  const comp=document.getElementById('compose-input'), rasc=comp?comp.value:null;
  const m=document.getElementById('msgs'), noFim=!m||m.scrollHeight-m.scrollTop-m.clientHeight<90, topo=m?m.scrollTop:0;
  render();
  const c2=document.getElementById('compose-input'); if(c2&&rasc) c2.value=rasc;
  if(id){ const el=document.getElementById(id); if(el){ if(val!==null&&'value' in el) el.value=val; el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel); }catch(e){} } }
  const m2=document.getElementById('msgs'); if(m2&&!noFim) m2.scrollTop=topo;
}
function aplicarTema(t){ if(t==='claro') document.documentElement.dataset.tema='claro'; else delete document.documentElement.dataset.tema; try{ localStorage.setItem('lgw_tema',t); }catch(e){} }
function toast(t,m){const el=document.getElementById('toast');document.getElementById('toast-t').textContent=t;document.getElementById('toast-m').textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),3200);}

function bindAtendimento(c){
  root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render();});
  const q=document.getElementById('wa-q'); if(q) q.oninput=()=>{S.q=q.value;renderItems();};

  scrollMsgs();
  if(!c) return;
  const back=document.getElementById('back'); if(back) back.onclick=()=>{S.mobileOpen=false;render();};
  const openInfo=()=>{S.profileOpen=!S.profileOpen;render();};
  document.getElementById('open-info').onclick=openInfo;
  document.getElementById('toggle-info').onclick=openInfo;
  const ci=document.getElementById('close-info'); if(ci) ci.onclick=()=>{S.profileOpen=false;render();};
  root.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.view=b.dataset.goto;render();});

<script>
/* App instalável: registra o service worker (abre rápido e atualiza sozinho) */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/atendimento/sw.js', {scope:'/atendimento/'}).catch(()=>{});
</script>

<script>
/* Instalação: aparece quando o navegador permite instalar ou quando veio da Área do cliente */
(function(){
  const pediu = new URLSearchParams(location.search).has('instalar');
  const inst = document.getElementById('inst'), ok = document.getElementById('inst-ok');
  const instalado = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
  let evento = null;
  if (instalado()) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evento = e; ok.hidden = false; inst.hidden = false; });
  window.addEventListener('appinstalled', () => {
    document.getElementById('inst-t').textContent = 'Programa instalado';
    document.getElementById('inst-m').textContent = 'Procure “Atendimento” na área de trabalho ou no menu Iniciar.';
    ok.hidden = true; inst.hidden = false; setTimeout(() => inst.hidden = true, 6000);
  });
  ok.onclick = async () => { if (!evento) return; evento.prompt(); const r = await evento.userChoice; if (r.outcome === 'accepted') { evento = null; } };
  document.getElementById('inst-x').onclick = () => inst.hidden = true;
  if (pediu) setTimeout(() => { if (!evento && !instalado()) {
    document.getElementById('inst-t').textContent = 'Instale pelo menu do navegador';
    document.getElementById('inst-m').textContent = 'No Chrome ou Edge: clique no ícone de instalar na barra de endereço, ou em ⋮ › Instalar Atendimento. Se não aparecer, o programa já está instalado neste computador.';
    ok.hidden = true; inst.hidden = false;
  } }, 1500);
})();
</script>
</body>
</html>
