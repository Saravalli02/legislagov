<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161615">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Atendimento WhatsApp · LegislaGov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: sidebar escura LegislaGov + área de trabalho em papel; atendimento em três colunas (fila · conversa · ficha) */
:root{
  --paper:#ece5d3; --paper-raised:#f4efe2; --ink:#1c1b19; --ink-soft:#55524b;
  --primary:#1c1b19; --primary-deep:#0e0e0d; --primary-tint:rgba(28,27,25,.1); --brass:#a3742f; --brass-soft:#c99a4f;
  --brick:#8c3b2e; --sage:#6d7f63; --line:rgba(28,27,25,.16); --line-strong:rgba(28,27,25,.3);
  --bubble-in:#f4efe2; --bubble-out:#e2ddd2; --bubble-bot:#efe3c9;
  --wa-bg:#e7e0d0; --wa-dot:rgba(28,27,25,.07); --wa-in:#fffdf8; --wa-out:#e3ddd0; --wa-bot:#f2e5c6; --wa-sys:#f6edd8; --wa-file:rgba(28,27,25,.06);
  --sidebar-bg-top:#161615; --sidebar-bg-bottom:#0b0b0a; --sidebar-text:#e9e6d9; --sidebar-dim:rgba(233,230,217,.72);
  --shadow-sm:0 1px 2px rgba(28,49,35,.06),0 1px 1px rgba(28,49,35,.04);
  --shadow-md:0 2px 6px rgba(28,49,35,.08),0 8px 24px rgba(28,49,35,.06);
  --radius:7px; --radius-sm:4px;
  --font-display:"Source Serif 4",Georgia,serif;
  --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a1a18; --paper-raised:#232320; --ink:#ece8dc; --ink-soft:#aeaa9f; --primary:#ece8dc; --primary-deep:#ffffff; --primary-tint:rgba(236,232,220,.12);
  --brass:#d9ac5c; --brass-soft:#e6c485; --brick:#d18a78; --sage:#93a487; --line:rgba(236,232,220,.14); --line-strong:rgba(236,232,220,.26);
  --bubble-in:#2a2a26; --bubble-out:#33322e; --bubble-bot:#3a3324; --wa-bg:#121211; --wa-dot:rgba(236,232,220,.05); --wa-in:#262624; --wa-out:#35332e; --wa-bot:#3b3324; --wa-sys:#2a2620; --wa-file:rgba(255,255,255,.06); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1a1a18; --paper-raised:#232320; --ink:#ece8dc; --ink-soft:#aeaa9f; --primary:#ece8dc; --primary-deep:#ffffff; --primary-tint:rgba(236,232,220,.12);
  --brass:#d9ac5c; --brass-soft:#e6c485; --brick:#d18a78; --sage:#93a487; --line:rgba(236,232,220,.14); --line-strong:rgba(236,232,220,.26);
  --bubble-in:#2a2a26; --bubble-out:#33322e; --bubble-bot:#3a3324; --wa-bg:#121211; --wa-dot:rgba(236,232,220,.05); --wa-in:#262624; --wa-out:#35332e; --wa-bot:#3b3324; --wa-sys:#2a2620; --wa-file:rgba(255,255,255,.06); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
#root{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr;padding:0}
.login-art{background:linear-gradient(180deg,var(--sidebar-bg-top),var(--sidebar-bg-bottom));color:var(--sidebar-text);padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art h1{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);line-height:1.1;margin:0;text-wrap:balance;font-weight:600}
.login-art p{color:var(--sidebar-dim);max-width:44ch;margin:14px 0 0}
.phone-tag{font-family:var(--font-mono);color:var(--brass-soft);font-size:13px;letter-spacing:.04em}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.login-form h2{font-family:var(--font-display);font-size:24px;margin:0}
.login-form .sub{color:var(--ink-soft);font-size:13px;margin:-6px 0 6px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.field input,.field select,.field textarea{background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.demo-note{font-size:12px;color:var(--ink-soft);background:var(--paper-raised);border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px}
.btn-primary{background:var(--primary);color:#f4efe2;border:0;border-radius:var(--radius-sm);padding:10px 16px;font-weight:500}
.btn-primary:hover{background:var(--primary-deep)}
:root[data-theme="dark"] .btn-primary{color:#171d16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#171d16}}
.btn-secondary{background:none;color:var(--primary);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:9px 14px;font-weight:500}
.btn-secondary:hover{background:var(--paper-raised)}
.btn-brass{background:var(--brass);color:#fff8ed;border:0;border-radius:var(--radius-sm);padding:9px 14px;font-weight:500}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.sidebar{background:linear-gradient(180deg,var(--sidebar-bg-top),var(--sidebar-bg-bottom));color:var(--sidebar-text);padding:28px 22px;padding-left:max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow-y:auto;box-shadow:2px 0 14px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:26px;border-bottom:1px solid rgba(233,230,217,.16);margin-bottom:20px}
.brand-mark{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--brass-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--brass-soft)}
.brand-mark svg{width:18px;height:18px}
.brand-name{font-family:var(--font-display);font-size:17px;font-weight:600}
.brand-sub{font-size:11.5px;color:rgba(233,230,217,.6);margin-top:2px}
.status-switch{display:flex;gap:4px;padding:4px;background:rgba(233,230,217,.08);border-radius:3px;margin-bottom:24px}
.status-switch button{flex:1;padding:8px 0;font-size:11.5px;border-radius:2px;color:rgba(233,230,217,.5);background:none;border:0}
.status-switch button.current{background:rgba(233,230,217,.14);color:#f4efe2;font-weight:500}
.status-switch button:not(.current):hover{color:#f4efe2}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:3px;font-size:14px;color:var(--sidebar-dim);background:none;border:0;border-left:2px solid transparent;text-align:left;width:100%}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-item .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--brass-soft)}
.nav-item.active{color:#f4efe2;background:rgba(233,230,217,.07);border-left-color:var(--brass-soft);font-weight:500}
.nav-item:not(.active):hover{color:#f4efe2}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(233,230,217,.16);font-size:12px;color:rgba(233,230,217,.55)}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:34px;height:34px;background:rgba(233,230,217,.1);border-radius:50%;border:1.5px solid var(--brass-soft);color:var(--brass-soft);font-family:var(--font-display);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.user-chip strong{display:block;color:rgba(233,230,217,.9);font-size:13px;font-weight:500}
.logout-btn{display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:1px solid rgba(233,230,217,.18);color:rgba(233,230,217,.75);font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);width:100%}
.logout-btn:hover{background:rgba(233,230,217,.08);color:#f4efe2}

.main{min-width:0;overflow-y:auto;padding-block:28px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
.main.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--brass);letter-spacing:.04em}
h1.page-title{font-family:var(--font-display);font-size:28px;margin:2px 0 0;font-weight:600;text-wrap:balance}
.page-sub{color:var(--ink-soft);font-size:13px;margin:4px 0 0}
.card{background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.card h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px}
.card .sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px}

/* ---------- Tabelas ---------- */
.table-wrap{overflow-x:auto}
table.docket{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
table.docket th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line-strong)}
table.docket td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.docket tr:hover td{background:rgba(163,116,47,.05)}
.mini-btn{font-size:11.5px;color:var(--primary);background:none;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:5px 10px;white-space:nowrap}
.mini-btn:hover{background:var(--paper)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* ITBI */
.itbi-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.doc-preview{border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);padding:18px;font-family:var(--font-display);font-size:13px;line-height:1.6;color:var(--ink-soft)}
.doc-preview mark{background:rgba(163,116,47,.22);color:var(--ink);padding:0 2px;border-radius:2px}
.extracted{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.calc{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.calc .v{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.calc .total{font-weight:600;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.ai-flag{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-soft);background:rgba(163,116,47,.08);border:1px solid rgba(163,116,47,.28);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px}

/* Menus */
.tree{font-size:13.5px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line-strong)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:5px 0}
.opt{display:inline-flex;gap:8px;align-items:baseline}
.opt .k{font-family:var(--font-mono);color:var(--brass);font-weight:500;min-width:16px}
.opt .act{font-size:11.5px;color:var(--ink-soft)}
.off{opacity:.55}
.bot-preview{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px}

/* Relatórios */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin-bottom:22px}
.stat-row>div{padding:14px 16px;border-left:1px solid var(--line)}
.stat-row>div:first-child{border-left:0;padding-left:0}
.stat-row strong{display:block;font-family:var(--font-display);font-size:26px;color:var(--primary);font-weight:600}
.stat-row span{font-size:11.5px;color:var(--ink-soft)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:10px;background:var(--paper);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--primary)}
.bar-row .n{font-family:var(--font-mono);text-align:right}

/* Modal + toast */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,14,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{width:100%;max-width:420px;background:var(--paper-raised);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:24px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 40px);overflow-y:auto}
.modal-card h2{font-family:var(--font-display);font-size:19px;margin:0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toast{position:fixed;z-index:60;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));padding:14px 16px;background:var(--primary-deep);color:var(--paper-raised);border-left:3px solid var(--brass-soft);border-radius:var(--radius-sm);box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast strong{display:block;color:var(--brass-soft);font-size:12px;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--primary-tint);border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink-soft);font-size:12.5px;margin-bottom:18px}
.banner strong{color:var(--primary)}


/* ---------- Ficha do contribuinte e peças comuns ---------- */
.empty{padding:28px 18px;color:var(--ink-soft);font-size:13px}
.sec-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:18px 0 8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.debt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.debt>span:first-child{min-width:0}
.debt .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.debt.late .amt,.debt.late>span:first-child{color:var(--brick)}
.api-note{font-size:11.5px;color:var(--ink-soft);margin-top:10px;display:flex;gap:6px;align-items:center}
.api-note .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.side-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.side-btns button{width:100%;padding:10px 14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--ink-soft)}
.quick button:hover{color:var(--ink);border-color:var(--line-strong)}
.wa-info-body .empty{padding:4px 0}
.wa-list-head h1,.wa-blank h2{letter-spacing:-.01em}
/* ---------- Atendimento com aparência de WhatsApp ---------- */
.wa{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);position:relative}
.wa.with-info{grid-template-columns:minmax(300px,380px) minmax(0,1fr) 320px}
.wa-list{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line-strong);background:var(--paper-raised)}
.wa-list-head{display:flex;justify-content:space-between;align-items:center;padding:18px 14px 10px 16px}
.wa-list-head h1{font-family:var(--font-display);font-size:22px;margin:0;font-weight:600}
.wa-icon{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.wa-icon:hover{background:var(--primary-tint);color:var(--ink)}
.wa-icon svg{width:20px;height:20px}
.wa-search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:8px;padding:0 12px;color:var(--ink-soft)}
.wa-search svg{width:16px;height:16px;flex:none}
.wa-search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.wa-search:focus-within{box-shadow:0 0 0 2px var(--brass)}
.wa-filters{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.wa-filters button{border:0;background:var(--paper);color:var(--ink-soft);border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap}
.wa-filters button:hover{color:var(--ink)}
.wa-filters button.on{background:var(--primary);color:var(--paper-raised)}
.wa-filters button span{font-family:var(--font-mono);font-size:11px;opacity:.85}
.wa-items{overflow-y:auto;flex:1;min-height:0}
.wa-item{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 14px;border:0;background:none;text-align:left;color:var(--ink)}
.wa-item:hover{background:var(--paper)}
.wa-item.sel{background:var(--primary-tint)}
.wa-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.wa-row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.wa-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wa-time{font-size:11.5px;color:var(--ink-soft);flex:none;font-variant-numeric:tabular-nums}
.wa-time.new{color:var(--brass);font-weight:600}
.wa-prev{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:3px;min-width:0}
.wa-prev b{font-weight:500;color:var(--brass);flex:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wa-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brass);color:#fff8ed;font:600 11px var(--font-mono);display:inline-flex;align-items:center;justify-content:center;flex:none}
.wa-tags{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-st{font-weight:500}
.wa-st.fila{color:var(--brick)}.wa-st.bot{color:var(--brass)}.wa-st.meu{color:var(--ink)}.wa-st.enc{color:var(--sage)}
.wa-av{width:46px;height:46px;border-radius:50%;background:var(--paper);border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-soft);flex:none;position:relative}
.wa-av.fila::after{content:"";position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--brick);border:2px solid var(--paper-raised)}
.tick{width:16px;height:11px;flex:none;color:var(--brass)}
.wa-chat{display:flex;flex-direction:column;min-height:0;min-width:0;background-color:var(--wa-bg);background-image:radial-gradient(var(--wa-dot) 1px,transparent 1.3px);background-size:18px 18px}
.wa-chat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--paper-raised);border-bottom:1px solid var(--line-strong);min-height:62px}

.wa-msg{position:relative;max-width:min(72%,560px);padding:6px 9px;border-radius:8px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:14.2px;line-height:1.4;margin-top:6px;overflow-wrap:anywhere;color:var(--ink)}
.wa-msg.in{align-self:flex-start;background:var(--wa-in);border-top-left-radius:0}
.wa-msg.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:0}
.wa-msg.out.bot{background:var(--wa-bot)}
.wa-msg::before{content:"";position:absolute;top:0;width:8px;height:13px}
.wa-msg.in::before{left:-8px;background:var(--wa-in);clip-path:polygon(100% 0,0 0,100% 100%)}
.wa-msg.out::before{right:-8px;background:var(--wa-out);clip-path:polygon(0 0,100% 0,0 100%)}

    items+=`<button class="wa-item ${x.id===S.hsel?'sel':''}" data-h="${x.id}"><span class="wa-av" aria-hidden="true">${initials(x.nome)}</span><span class="wa-item-body"><span class="wa-row"><span class="wa-name">${esc(x.nome)}</span><span class="wa-time">${x.msgs[0].t}</span></span><span class="wa-row"><span class="wa-prev"><span class="ellip">${x.assunto} · ${esc(x.resumo)}</span></span></span><span class="wa-tags">Atendido por ${esc(x.atendente)}</span></span></button>`;});
  renderShell(`<div class="wa ${S.mobileOpen?'open':''}">
    <section class="wa-list" aria-label="Histórico de conversas">
      <header class="wa-list-head"><h1>Histórico</h1></header>
      <label class="wa-search">${ICON.search}<input id="h-q" placeholder="Pesquisar nome, telefone ou inscrição" value="${esc(S.hq||'')}" autocomplete="off"></label>
      <div class="wa-hfilters">
        <select id="h-ano" aria-label="Ano">${anos.map(a=>`<option ${a===(S.hano||'2026')?'selected':''}>${a}</option>`).join('')}</select>
        <select id="h-assunto" aria-label="Assunto"><option value="">Todos os assuntos</option>${assuntos.map(a=>`<option ${a===S.hassunto?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div class="wa-items">${items||'<div class="empty">Nenhuma conversa arquivada com esses filtros.</div>'}</div>
    </section>

      <header class="wa-chat-head">
        <button class="wa-icon wa-back" id="back" aria-label="Voltar para a lista">${ICON.back}</button>

      </header>
      <div class="wa-msgs" id="msgs">${waMsgs(h.msgs,fmtData(h.data))}</div>
      <div class="wa-readonly"><span>Conversa arquivada · atendida por ${esc(h.atendente)} · somente leitura</span><button class="mini-btn" id="h-copy">Copiar conversa</button></div>
    </section>`:`<section class="wa-chat wa-blank"><div><div class="brand-mark big">${ICON.clock}</div><h2>Histórico</h2><p>Escolha uma conversa arquivada.</p></div></section>`}
  </div>`,true);
  const hq=document.getElementById('h-q'); hq.oninput=()=>{S.hq=hq.value;const pos=hq.selectionStart;renderHistorico();const n=document.getElementById('h-q');n.focus();n.setSelectionRange(pos,pos);};

  document.getElementById('h-assunto').onchange=e=>{S.hassunto=e.target.value;S.hsel=null;renderHistorico();};

  const back=document.getElementById('back'); if(back) back.onclick=()=>{S.mobileOpen=false;renderHistorico();};
  const cp=document.getElementById('h-copy'); if(cp) cp.onclick=()=>{
    const txt=`${h.nome} · ${h.tel} · ${fmtData(h.data)}\n`+h.msgs.map(m=>`[${m.t}] ${m.f==='in'?h.nome.split(' ')[0]:m.f==='bot'?'Bot':m.f==='sys'?'Sistema':m.by}: ${m.x||''}${m.file?' ('+m.file+')':''}`).join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast('Conversa copiada','Cole em um ofício, e-mail ou processo.')).catch(()=>toast('Não foi possível copiar','Seu navegador bloqueou a área de transferência.'));
  };

}

  <span class="chip ${S.itbiDone?'chip-done':'chip-wait'}"><span class="dot"></span>${S.itbiDone?'Guia enviada':'Aguardando conferência'}</span></div>
  <div class="itbi-layout">
    <div class="card"><h2>Documento enviado</h2><p class="sub mono">${ITBI.docName}</p>
      <div class="doc-preview">ESCRITURA PÚBLICA DE VENDA E COMPRA que fazem, como outorgante vendedora, <mark>${ITBI.vendedor}</mark>, e como outorgado comprador, <mark>${ITBI.comprador}</mark>, do imóvel constituído pelo <mark>${ITBI.imovel}</mark>, cadastrado na Prefeitura sob a inscrição <mark>${ITBI.insc}</mark>, pelo preço certo e ajustado de <mark>${brl(ITBI.valorDeclarado)}</mark>, pago neste ato…</div>

      <div class="ai-flag">⚑ <span>Valor venal do cadastro (${brl(ITBI.valorVenal)}) é maior que o valor declarado. Pela regra municipal a base de cálculo é o maior dos dois.</span></div>
      <div class="extracted">
        <div class="field"><label for="it-c">Comprador</label><input id="it-c" value="${esc(ITBI.comprador)}"></div>
        <div class="field"><label for="it-v">Vendedor</label><input id="it-v" value="${esc(ITBI.vendedor)}"></div>

function renderUsuarios(){

  <div class="card"><div class="table-wrap"><table class="docket">
    <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th>Atendendo</th><th></th></tr></thead>
    <tbody>${USERS.map(u=>`<tr>
      <td><strong>${esc(u.nome)}</strong></td><td class="mono">${u.login}</td><td>${u.perfil}</td>
      <td>${!u.ativo?'<span class="chip chip-wait"><span class="dot"></span>Desativado</span>':u.online?'<span class="chip chip-me"><span class="dot"></span>Online</span>':'<span class="chip chip-topic">Offline</span>'}</td>
      <td class="mono">${u.atend}</td>
      <td style="white-space:nowrap"><button class="mini-btn" data-reset="${u.id}">Redefinir senha</button> <button class="mini-btn" data-tog="${u.id}">${u.ativo?'Desativar':'Reativar'}</button></td>
    </tr>`).join('')}</tbody></table></div></div>`);
  document.getElementById('novo').onclick=openNovoUser;
  root.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const u=USERS.find(x=>x.id==b.dataset.reset);toast('Senha redefinida',`${u.nome} recebe uma senha temporária e troca no próximo login.`);});
  root.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const u=USERS.find(x=>x.id==b.dataset.tog);if(u.id===S.user.id){toast('Ação bloqueada','Você não pode desativar o próprio login.');return;}u.ativo=!u.ativo;u.online=false;render();toast(u.ativo?'Login reativado':'Login desativado',u.nome);});
}
function openNovoUser(){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<form class="modal-card" role="dialog" aria-modal="true" aria-labelledby="nu-h" id="nu-form"><h2 id="nu-h">Novo atendente</h2>
  <div class="field"><label for="nu-nome">Nome completo</label><input id="nu-nome" required></div>
  <div class="field"><label for="nu-login">Login</label><input id="nu-login" placeholder="nome.sobrenome" required></div>
  <div class="field"><label for="nu-perfil">Perfil</label><select id="nu-perfil"><option>Atendente</option><option>Supervisor</option><option>Admin</option></select></div>
  <div class="field"><label for="nu-pass">Senha inicial</label><input id="nu-pass" type="password" minlength="8" placeholder="Mínimo 8 caracteres" required></div>
  <p id="nu-err" style="color:var(--brick);font-size:12.5px;margin:0" hidden></p>
  <div class="modal-actions"><button type="button" class="btn-secondary" id="nu-cancel">Cancelar</button><button class="btn-primary" type="submit">Criar login</button></div></form>`;
  document.body.appendChild(ov);
  ov.querySelector('#nu-cancel').onclick=()=>ov.remove();
  ov.querySelector('#nu-form').onsubmit=e=>{e.preventDefault();
    const nome=ov.querySelector('#nu-nome').value.trim(),login=ov.querySelector('#nu-login').value.trim().toLowerCase();
    if(USERS.some(u=>u.login===login)){const er=ov.querySelector('#nu-err');er.textContent='Este login já existe. Escolha outro.';er.hidden=false;return;}
    USERS.push({id:Date.now(),nome,login,perfil:ov.querySelector('#nu-perfil').value,ativo:true,online:false,atend:0});
    ov.remove();render();toast('Login criado',`${nome} já pode entrar como ${login}.`);};
}

<script>
/* Instalação: aparece quando o navegador permite instalar ou quando veio da Área do cliente */
(function(){
  const pediu = new URLSearchParams(location.search).has('instalar');
  const inst = document.getElementById('inst'), ok = document.getElementById('inst-ok');
  const instalado = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
  let evento = null;
  if (instalado()) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evento = e; ok.hidden = false; inst.hidden = false; });
  window.addEventListener('appinstalled', () => {
    document.getElementById('inst-t').textContent = 'Programa instalado';
    document.getElementById('inst-m').textContent = 'Procure “Atendimento” na área de trabalho ou no menu Iniciar.';
    ok.hidden = true; inst.hidden = false; setTimeout(() => inst.hidden = true, 6000);
  });
  ok.onclick = async () => { if (!evento) return; evento.prompt(); const r = await evento.userChoice; if (r.outcome === 'accepted') { evento = null; } };
  document.getElementById('inst-x').onclick = () => inst.hidden = true;
  if (pediu) setTimeout(() => { if (!evento && !instalado()) {
    document.getElementById('inst-t').textContent = 'Instale pelo menu do navegador';
    document.getElementById('inst-m').textContent = 'No Chrome ou Edge: clique no ícone de instalar na barra de endereço, ou em ⋮ › Instalar Atendimento. Se não aparecer, o programa já está instalado neste computador.';
    ok.hidden = true; inst.hidden = false;
  } }, 1500);
})();
</script>
