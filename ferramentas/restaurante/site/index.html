<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="lg-versao" content="lg-v17">

<link rel="icon" href="https://central.legislagov.com.br/restaurante/icon-192.png">
<link rel="apple-touch-icon" href="https://central.legislagov.com.br/restaurante/apple-touch-icon.png">
<title>GR Restaurante</title>
<style>
:root{--pri:#0f3d5e;--pri2:#16557f;--acc:#f28c28;--ok:#1f8a4c;--bad:#c0392b;--bg:#f4f1ea;--card:#fff;--txt:#1d2733;--mut:#6b7684;--line:#e3ddd1;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px;font-weight:600}
.hidden{display:none!important}
header{background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo{width:52px;height:52px;border-radius:12px;background:#d32f2f;box-shadow:0 0 0 3px #ffffff33;display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo.red{background:#d32f2f}
.brand b{color:#fff}.brand span{color:#ff8a80!important}
.mico{width:46px;height:32px;display:block}
.mesa .ic{color:#8a6a4a}.mesa.ocupada .ic{color:#d32f2f}
nav .mico{width:34px;height:26px}
.brand b{display:block;font-size:1.35rem;letter-spacing:.3px}
.brand span{font-size:.85rem;color:#ffd7ad;text-transform:uppercase;letter-spacing:2px}
.pill{padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;background:#ffffff22;display:flex;align-items:center;gap:8px}
.pill.on{background:#1f8a4c}.pill.off{background:#c0392b}
.save{font-size:.75rem;opacity:.85;margin-left:4px}
nav{background:var(--pri2);display:flex;gap:6px;padding:8px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;min-width:92px;font-size:.85rem;font-weight:600}
nav button i{font-style:normal;font-size:1.7rem;line-height:1}
nav button.act{background:#fff;color:var(--pri)}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:1.35rem}
h3{margin:0 0 10px;font-size:1.05rem}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px #0001}
.aviso{background:#fff4e5;border:1px solid #f5c58a;padding:12px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:11px 16px;font-weight:700;background:#e9e4da;color:var(--txt)}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.big{padding:16px 22px;font-size:1.1rem;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px #0001}
.stat small{color:var(--mut);font-weight:600;display:block}.stat b{font-size:1.3rem}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.mesa{background:#fff;border:2px solid var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:110px;justify-content:center;transition:transform .08s}
.mesa:active{transform:scale(.97)}
.mesa .ic{font-size:1.4rem}.mesa b{font-size:1.7rem;color:var(--pri)}
.mesa .mv{font-size:.85rem;color:var(--mut);font-weight:600}
.mesa.ocupada{background:#fff3e6;border-color:var(--acc)}
.mesa.ocupada .mv{color:#b35a00;font-size:.95rem}
.caixa{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.caixa>*{min-width:0}
@media(max-width:860px){.caixa{grid-template-columns:1fr}}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.thumb{width:44px;height:44px;border-radius:8px;background:#f0ece4;display:grid;place-items:center;font-size:1.4rem;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.it .nm{flex:1;min-width:0}.it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm small{color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;background:#eee8dd;font-weight:800;font-size:1.1rem}
.qty span{min-width:26px;text-align:center;font-weight:700}
.sub{min-width:84px;text-align:right;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:center;font-size:1.5rem;font-weight:800;padding:14px 0}
.vazio{color:var(--mut);text-align:center;padding:24px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.chip{background:#eee8dd;padding:7px 12px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap}
.chip.act{background:var(--pri);color:#fff}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:560px;overflow:auto;padding:2px}
.prod{background:#faf8f4;border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.prod .pi{width:100%;aspect-ratio:1;border-radius:8px;background:#f0ece4;display:grid;place-items:center;font-size:2.2rem;overflow:hidden}
.prod .pi img{width:100%;height:100%;object-fit:cover}
.prod b{font-size:.9rem;line-height:1.15}.prod small{color:var(--mut);font-size:.75rem}
.prod .pr{color:var(--ok);font-weight:800}
.prod.esg{opacity:.45}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:#fff;border-radius:12px;padding:12px;display:flex;gap:12px;box-shadow:0 1px 3px #0001}
.pcard .thumb{width:72px;height:72px;font-size:2rem}
.pcard .info{flex:1;min-width:0;font-size:.9rem}
.pcard .info b{font-size:1rem;display:block}
.lucro{color:var(--ok);font-weight:700}.prej{color:var(--bad);font-weight:700}
.tag{display:inline-block;background:#eee8dd;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:600;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:.8rem;text-transform:uppercase}
td.n,th.n{text-align:right}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px #0001}
.hrow .top{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.hrow .det{margin-top:10px}
.movbox{max-width:560px;margin:0 auto;text-align:center}
.movbox .ic{font-size:4rem}
#modalBg{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
#modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.pags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.pags button{background:#f0ece4;padding:18px 6px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent}
.pags button i{font-style:normal;font-size:2rem}
.pags button.act{border-color:var(--pri);background:#e3eef7}
.totalBig{font-size:2.3rem;font-weight:900;text-align:center;color:var(--pri);margin:6px 0}
.cupom{font-family:"Courier New",monospace;background:#fffef8;border:1px dashed #bbb;padding:14px;font-size:.85rem;white-space:normal}
.cupom h4{text-align:center;margin:0 0 4px}.cupom .c{text-align:center}
.cupom table td,.cupom table th{padding:3px 2px;border:0;font-size:.82rem}
.cupom hr{border:0;border-top:1px dashed #999}
.imgprev{width:110px;height:110px;border-radius:12px;background:#f0ece4;display:grid;place-items:center;font-size:2.6rem;overflow:hidden;border:2px dashed var(--line);cursor:pointer}
.imgprev img{width:100%;height:100%;object-fit:cover}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.calc{background:#eef7f1;border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:70;font-weight:600;color:var(--mut)}
#printArea{display:none}

.tabs{display:flex;background:#e9e4da;border-radius:12px;padding:4px;gap:4px}
.tabs button{background:transparent;padding:9px 14px;font-weight:700;display:flex;align-items:center;gap:6px}
.tabs button .mico{width:30px;height:22px}
.tabs button.act{background:#fff;box-shadow:0 1px 3px #0002}
.cnt{background:#e53935;color:#fff;border-radius:10px;padding:0 7px;font-size:.78rem}
.mesa{position:relative}
.mesa.conta{border-color:#e53935;animation:pisca 1.4s ease-in-out infinite}
@keyframes pisca{50%{box-shadow:0 0 0 4px #e5393555}}
.mesa .flag{position:absolute;top:4px;left:4px;right:4px;background:#e53935;color:#fff;font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 0}
.gnm{font-size:.72rem;color:var(--mut)}
.pedlog{background:#f7f4ee;border-radius:8px;padding:7px 10px;margin:6px 0;font-size:.88rem}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.chk{display:flex!important;gap:10px;align-items:flex-start;color:var(--txt)!important;font-weight:500!important;font-size:.95rem!important;cursor:pointer;margin:10px 0!important}
.chk input{width:22px;height:22px;flex:none;margin-top:1px}
/* app do garçom */
body.gmode header,body.gmode nav,body.gmode #atalhos{display:none!important}
body.gmode{padding-bottom:90px;background:#f4f1ea}
body.gmode main{padding:0;max-width:640px}
.gtop{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:0;z-index:6;padding-top:max(10px,env(safe-area-inset-top))}
.gtop small{color:#ffd7ad}
.gbtn{background:#ffffff22;color:inherit;padding:9px 12px;font-weight:700}
.gbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:5}
.gbar .gbtn{background:#eee8dd;color:var(--txt)}
.gbar span{text-align:right;line-height:1.1}.gbar small{color:var(--mut);font-size:.72rem}
.gtabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.gtabs button{flex:1;background:transparent;padding:14px 6px;font-weight:800;border-radius:0;border-bottom:4px solid transparent;color:var(--mut)}
.gtabs button.act{border-bottom-color:#d32f2f;color:var(--txt)}
.gpad{padding:12px}
.gmesas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gmesas button{background:#fff;border:2px solid var(--line);padding:10px 4px;display:flex;flex-direction:column;align-items:center;min-height:104px;justify-content:center;position:relative}
.gmesas button .ic{color:#8a6a4a}.gmesas button b{font-size:1.6rem;color:var(--pri);line-height:1}
.gmesas button small{color:var(--mut);font-weight:700}
.gmesas button.ocupada{background:#fff3e6;border-color:var(--acc)}.gmesas button.ocupada .ic{color:#d32f2f}
.gmesas button.conta{border-color:#e53935}
.gmesas em{font-style:normal;font-size:.72rem;font-weight:800;color:#c0392b}
.gcats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcats button{background:#fff;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:1.05rem;box-shadow:0 1px 3px #0001}
.gcats i{font-style:normal;font-size:2.6rem}.gcats small{color:var(--mut);font-weight:600;font-size:.78rem}
.gchips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#f4f1ea;position:sticky;top:116px;z-index:4}
.gchips button{background:#fff;padding:9px 13px;border-radius:999px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px #0001}
.gchips button.act{background:var(--pri);color:#fff}
.gchips button:first-child{background:#d32f2f;color:#fff}
.gprod{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.gprod.esg{opacity:.5}
.gprod .thumb{width:58px;height:58px;font-size:1.9rem}
.gprod .nm{flex:1;min-width:0;display:flex;flex-direction:column}.gprod .nm small{color:var(--mut)}.gprod .pr{color:var(--ok);font-weight:800}
.gqty{display:flex;align-items:center;gap:6px}
.gqty button{width:42px;height:42px;border-radius:50%;background:#eee8dd;font-size:1.4rem;font-weight:800}
.gqty button.mais{background:var(--ok);color:#fff}
.gqty span{min-width:22px;text-align:center;font-weight:800;font-size:1.15rem}
.gcart{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:620px;margin:auto;background:#d32f2f;color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px #0004;z-index:7;cursor:pointer}
.glogin{padding:28px 18px;max-width:420px;margin:auto}
.gnomes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gnomes button{background:#fff;padding:18px 8px;font-weight:800;font-size:1.05rem;box-shadow:0 1px 3px #0001}
.pindots{display:flex;justify-content:center;gap:14px;margin:8px 0 18px}
.pindots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--pri)}.pindots span.on{background:var(--pri)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{background:#fff;padding:18px 0;font-size:1.5rem;font-weight:800;box-shadow:0 1px 3px #0001}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sino{position:relative;background:#ffffff22;color:#fff;font-size:1.5rem;width:46px;height:46px;border-radius:50%}
.sino.tem{animation:bal 1.6s ease-in-out infinite}
@keyframes bal{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(14deg)}90%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}
.badge{position:absolute;top:-3px;right:-3px;background:#e53935;color:#fff;font-size:.72rem;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--pri)}
nav button small{font-size:.65rem;opacity:.7;font-weight:700}
#atalhos{position:fixed;bottom:0;left:0;right:0;background:#1d2733;color:#cfd6de;font-size:.8rem;padding:7px 12px;text-align:center;z-index:4}
#atalhos kbd{background:#3a4654;color:#fff;border-radius:5px;padding:1px 6px;font-family:inherit;font-weight:700}
body{padding-bottom:40px}
@media(max-width:760px),(pointer:coarse){#atalhos{display:none}body{padding-bottom:0}}
kbd.k{background:#00000022;border-radius:5px;padding:0 5px;font-family:inherit;font-size:.75em;margin-left:4px}
#alerta{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:65;background:#fff;border-left:8px solid #e53935;box-shadow:0 8px 30px #0004;border-radius:12px;padding:14px 18px;max-width:94vw;width:460px;cursor:pointer;animation:cai .25s ease-out}
@keyframes cai{from{transform:translate(-50%,-30px);opacity:0}}
#alerta h4{margin:0 0 6px;color:#c0392b;font-size:1.05rem}
#alerta div{padding:3px 0;font-weight:600}
.st-esg{color:#c0392b;font-weight:800}.st-baixo{color:#d35400;font-weight:800}.st-ok{color:var(--ok);font-weight:800}
.erow{background:#fff;border-radius:12px;padding:12px;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;box-shadow:0 1px 3px #0001;border-left:6px solid var(--ok)}
.erow.baixo{border-left-color:#e67e22}.erow.esg{border-left-color:#e53935;background:#fff6f5}
.erow .thumb{width:56px;height:56px;font-size:1.8rem}
.enum{text-align:center;min-width:86px}.enum b{font-size:1.8rem;display:block;line-height:1}.enum small{color:var(--mut);font-size:.75rem}
.eacts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.quick button{background:#eee8dd;padding:10px 14px;font-weight:800}
.prod .low{color:#d35400;font-weight:800}

/* ===== refino visual LegislaGov ===== */
:root{--pri:#2a1517;--pri2:#3a1d20;--acc:#d32f2f;--bg:#f6f3ef;--line:#e6dfd6;--vinho:#7a1c1f;--r:16px}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--pri);padding:12px 20px;border-bottom:1px solid #ffffff14}
.logo{background:transparent!important;box-shadow:0 0 0 1px #ffffff26,0 4px 14px #0005;border-radius:14px}
.logo img.lg-pilar{width:100%;height:100%;object-fit:cover;background:none!important}
#loading .logo,.glogin .logo,.imgprev .logo{box-shadow:0 10px 30px #3a141833}
.brand b{font-weight:700;letter-spacing:.2px}.brand span{color:#ff8f8a!important;font-weight:600;letter-spacing:3px;font-size:.78rem}
.sino{width:44px;height:44px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff2e;display:grid;place-items:center;padding:0}
.sino .nico{width:22px;height:22px}.sino:hover{background:#ffffff1f}
.badge{border-color:var(--pri)}
.pill{border:1px solid #ffffff2e;background:#ffffff10}
.pill.on{background:#1f8a4c33;border-color:#3ecf7a66}.pill.off{background:#d32f2f33;border-color:#ff6b6b66}
nav{background:var(--pri2);padding:10px 14px;gap:6px;border-bottom:1px solid #00000033;box-shadow:0 6px 18px #2a151722}
nav button{min-width:96px;padding:8px 10px 7px;border-radius:14px;gap:5px;color:#f3e9e9;font-weight:600;letter-spacing:.1px;transition:background .15s}
nav button i{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff38;background:#ffffff0d;display:grid;place-items:center;font-size:1.35rem}
nav button .nico{width:22px;height:22px}nav button .mico{width:28px;height:20px}
nav button:hover{background:#ffffff12}
nav button.act{background:#fff;color:var(--pri)}
nav button.act i{background:#fdecea;border-color:#f3b8b4;color:var(--acc)}
nav button small{opacity:.6}
main{padding:20px 18px}
h2{font-weight:700;letter-spacing:-.2px}
main>h2,.row>h2{display:flex;align-items:center;gap:10px}
.card,.stat,.hrow,.pcard,.gprod,.gcats button,.gnomes button,.pinpad button,.erow{box-shadow:none;border:1px solid var(--line)}
.card{border-radius:var(--r)}
.stats{gap:12px}
.stat{border-radius:14px;padding:14px 16px 14px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.stat:nth-child(2)::before{background:#e8913a}.stat:nth-child(3)::before{background:#1f8a4c}
.stat b{font-size:1.45rem;letter-spacing:-.3px}
.mesas{gap:12px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.mesa{border:1px solid var(--line);border-radius:16px;min-height:124px;gap:6px;background:#fff;transition:transform .08s,border-color .15s,box-shadow .15s}
.mesa:hover{border-color:#d9c9bb;box-shadow:0 6px 16px #2a151712}
.mesa .ic{width:46px;height:38px;border-radius:11px;border:1px solid var(--line);background:#faf7f3;display:grid;place-items:center}

<script>
/* LegislaGov — aviso de "Carregando…" e "Concluído" em todos os sistemas.
   1) Automático: quando a pessoa clica em algo e o servidor demora mais de meio segundo para responder,
      aparece "Carregando…"; quando termina, "Concluído" (ou "Não foi concluído") e some sozinho.
      Atualizações em segundo plano (sincronia, GPS, conferências periódicas) não mostram nada.
   2) Manual, para tarefas pesadas feitas no próprio aparelho (relatórios, planilhas, PDFs):
      lgCarregando('Gerando relatório…', () => trabalho(), 'Relatório pronto')                         */
(function () {
  if (window.lgCarregando) return;
  var FUNDO = /\/(mudancas|aovivo|posicoes|trajeto|gravar|sync|ping|eventos|inicio|dados|doc)\b|\/api\/central\/(rest|licenca)/;
  var ultimo = 0, pend = 0, timer = null, vis = false, manual = 0, el = null, saida = null;
  addEventListener('pointerdown', function () { ultimo = Date.now(); }, true);
  addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || /^F\d+$/.test(e.key)) ultimo = Date.now(); }, true);

  var css = document.createElement('style');
  css.textContent = '#lgCarr{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.18);backdrop-filter:blur(1.5px)}' +
    '#lgCarr.on{display:flex}#lgCarr.fim{background:transparent;backdrop-filter:none;pointer-events:none}' +
    '#lgCarr .lgc-cx{display:flex;align-items:center;gap:14px;min-width:220px;max-width:min(90vw,420px);background:#fff;color:#111827;border:1px solid #e3e7ed;border-radius:16px;padding:16px 22px;box-shadow:0 18px 50px rgba(16,24,40,.22);font:600 15.5px/1.35 Inter,"Segoe UI",system-ui,sans-serif;animation:lgcIn .16s ease-out}' +
    '#lgCarr .lgc-sp{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid #e5e7eb;border-top-color:#334155;animation:lgcGira .8s linear infinite}' +
    '#lgCarr.ok .lgc-sp,#lgCarr.erro .lgc-sp{animation:none;border:0;display:grid;place-items:center;color:#fff;background:#16a34a}' +
    '#lgCarr.erro .lgc-sp{background:#dc2626}' +
    '#lgCarr.ok .lgc-sp::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}' +
    '#lgCarr.erro .lgc-sp::after{content:"!";font:800 17px/1 system-ui}' +
    '#lgCarr .lgc-tx small{display:block;font-weight:500;font-size:13px;color:#6b7280;margin-top:2px}' +
    '@keyframes lgcGira{to{transform:rotate(360deg)}}@keyframes lgcIn{from{opacity:0;transform:translateY(6px) scale(.98)}}' +
    '@media (prefers-reduced-motion:reduce){#lgCarr .lgc-sp{animation-duration:2s}#lgCarr .lgc-cx{animation:none}}' +
    '@media (prefers-color-scheme:dark){#lgCarr .lgc-cx{background:#161b22;color:#e6edf3;border-color:#2d333b}#lgCarr .lgc-sp{border-color:#30363d;border-top-color:#e6edf3}}' +
    '@media print{#lgCarr{display:none!important}}' +
    '[data-theme=dark] #lgCarr .lgc-cx,[data-tema=escuro] #lgCarr .lgc-cx{background:#161b22;color:#e6edf3;border-color:#2d333b}';
  (document.head || document.documentElement).appendChild(css);

  function caixa() {
    if (el) return el;
    el = document.createElement('div'); el.id = 'lgCarr'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    el.innerHTML = '<div class="lgc-cx"><span class="lgc-sp" aria-hidden="true"></span><span class="lgc-tx"></span></div>';
    document.body.appendChild(el); return el;
  }
  function texto(t, sub) { var x = caixa().querySelector('.lgc-tx'); x.textContent = t; if (sub) { var s = document.createElement('small'); s.textContent = sub; x.appendChild(s); } }
  function mostrar(t, sub) { clearTimeout(saida); caixa().className = 'on'; texto(t || 'Carregando…', sub || 'Aguarde um instante'); vis = true; }
  function concluir(t, erro) {
    if (!vis) return; clearTimeout(saida);
    el.className = 'on fim ' + (erro ? 'erro' : 'ok'); texto(t || (erro ? 'Não foi concluído' : 'Concluído'));
    saida = setTimeout(function () { el.className = ''; vis = false; }, erro ? 2200 : 1200);
  }

  var f0 = window.fetch;
  if (f0) window.fetch = function (u, o) {
    var url = String((u && u.url) || u || '');
    if (Date.now() - ultimo > 1500 || FUNDO.test(url)) return f0.apply(this, arguments);
    pend++;
    if (!timer && !vis) timer = setTimeout(function () { timer = null; if (pend > 0 && !manual) mostrar(); }, 500);
    function fim(ok) {
      pend = Math.max(0, pend - 1);
      if (pend === 0) { clearTimeout(timer); timer = null; if (vis && !manual) concluir(ok ? null : 'Não foi concluído', !ok); }
    }
    return f0.apply(this, arguments).then(function (r) { fim(r.status < 500); return r; }, function (e) { fim(false); throw e; });
  };

  window.lgCarregando = function (t, fn, pronto) {
    manual++; mostrar(t);
    return new Promise(function (ok) { requestAnimationFrame(function () { setTimeout(ok, 40); }); })
      .then(function () { return fn(); })
      .then(function (r) { manual--; concluir(pronto || 'Concluído'); return r; },
            function (e) { manual--; concluir('Não foi concluído', true); throw e; });
  };
})();

</script>

const wq={};
function dbWrite(path,data){
  const q=wq[path]||(wq[path]={busy:false,next:undefined});
  q.next=data;if(q.busy)return;
  (async()=>{q.busy=true;
    while(q.next!==undefined){const d=q.next;q.next=undefined;
      const doIt=()=>d===null?db.doc(path).delete():db.doc(path).set(d);
      try{await doIt()}catch(e){
        if(e&&e.code==='unavailable'){await sleep(600+Math.random()*900);try{await doIt()}catch(e2){erro(e2)}}else erro(e)}}
    q.busy=false})();
}

function gridProds(){
  const b=st.busca.trim().toLowerCase();
  const ps=prodList().filter(p=>(st.cat==='Todas'||p.cat===st.cat)&&(!b||casa(p,b)));
  if(!Object.keys(S.produtos).length)return `<div class="vazio" style="grid-column:1/-1">Nenhum produto cadastrado.<br><br><button class="btn pri" onclick="go('produtos')">🥤 Cadastrar produtos</button></div>`;
  if(!ps.length)return `<div class="vazio" style="grid-column:1/-1">Nada encontrado.</div>`;
  return ps.map(p=>{const d=disponivel(p),esg=d<=0;

const casa=(p,b)=>p.nome.toLowerCase().includes(b)||String(p.codigo||'')===b||(!!p.barras&&p.barras===b);
function proxCodigo(){let m=+((S.config||{}).ultCodigo)||0;for(const p of Object.values(S.produtos))m=Math.max(m,+p.codigo||0);return m+1}
function guardarUltCodigo(c){mutate('config','geral',x=>(+((x||{}).ultCodigo)||0)>=c?ABORT:{...(x||{}),ultCodigo:c})}
function acharProduto(t){t=String(t||'').trim();if(!/^\d+$/.test(t))return null;const ps=Object.values(S.produtos);
  return ps.find(p=>p.barras&&p.barras===t)||ps.find(p=>String(p.codigo||'')===String(+t))||null}
function buscaProds(t){t=String(t||'').trim().toLowerCase();if(!t)return[];
  const ex=acharProduto(t);const l=prodList().filter(p=>casa(p,t));if(ex&&!l.includes(ex))l.unshift(ex);return l.slice(0,8)}
function migrarCodigos(){if(GARCOM)return;let c=proxCodigo();
  const sem=prodList().filter(p=>!p.codigo);sem.forEach(p=>{const cod=c++;mutate('produtos',p.id,cur=>cur&&!cur.codigo?{...cur,codigo:cod}:ABORT)});if(sem.length)guardarUltCodigo(c-1)}

  toast(/^\d+$/.test(t)?`Código ${t} não encontrado. Confira em Produtos.`:(l.length?'Mais de um produto com esse nome: escolha na lista.':'Nenhum produto com esse nome.'));return false}

const soDig=x=>String(x||'').replace(/\D/g,'');
function validaCPF(c){c=soDig(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if(((s*10)%11)%10!=c[t])return false}return true}
function validaCNPJ(c){c=soDig(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;
  const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)==c[12]&&calc(13)==c[13]}
function fmtDoc(x){const d=soDig(x);
  if(d.length<=11)return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return d.slice(0,14).replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')}
const docValido=x=>{const d=soDig(x);return d.length===11?validaCPF(d):d.length===14?validaCNPJ(d):false};
const tipoDoc=x=>soDig(x).length===14?'CNPJ':'CPF';
function fecharVenda(){st.pag=null;st.receb=0;st.cpf='';st.nota=false;modalVenda()}
function msgDoc(d){return d.length===11||d.length===14?(docValido(d)?`✅ ${tipoDoc(d)} válido`:`❌ ${tipoDoc(d)} inválido`):''}
function cpfInput(el){el.value=fmtDoc(el.value);st.cpf=el.value;
  const d=soDig(st.cpf);if(d.length&&!st.nota){st.nota=true;$('#fnota').checked=true}
  const ok=$('#cpfok');ok.textContent=msgDoc(d);ok.className=docValido(d)?'st-ok':'st-esg'}
function blocoCPF(){const d=soDig(st.cpf);return `<div class="card" style="background:#f7f4ee;box-shadow:none;padding:12px;margin-bottom:14px">

/* fecha a comanda: usado pelo caixa e pelo app do garçom */
async function fecharComanda(n,{pag,cpf,nota,por}){
  if(!movAberto()){toast('O movimento do dia está fechado no caixa.');return null}
  const m=clone(mesa(n)),its=m.itens||[];if(!its.length||!pag)return null;
  cpf=soDig(cpf);if(cpf.length&&!docValido(cpf)){toast('❌ CPF/CNPJ inválido. Corrija ou apague o campo.');return null}
  const snap=JSON.stringify(its),rot=rotulo(n);
  const ok=await mutate('mesas',n,cur=>cur&&JSON.stringify(cur.itens||[])===snap?null:ABORT);
  if(!ok){toast('⚠️ Esta comanda acabou de mudar (pedido novo). Confira e feche de novo.');render(true);return null}
  const total=totItens(its),custo=custoItens(its);
  const v={id:uid(),mesa:n,rotulo:rot,itens:its,total,custo,lucro:total-custo,pagamento:pag,abertura:m.aberta||null,data:new Date().toISOString(),movId:S.estado.movId,
    cpf:cpf?fmtDoc(cpf):'',nota:nota?{status:'pendente'}:null,garcom:m.garcom||'',fechadoPor:por||'Caixa',
    cliente:isDel(n)?{nome:m.cliente,fone:m.fone,endereco:m.endereco,tipo:m.tipo}:null,
    ...(pag==='Dinheiro'&&n===curMesa&&st.receb>0?{recebido:st.receb,troco:Math.max(0,Math.round((st.receb-total)*100)/100)}:{})};
  put('vendas',v.id,v);
  const baixa={};its.forEach(i=>baixa[i.pid]=(baixa[i.pid]||0)+i.qtd);
  for(const pid in baixa)if(S.produtos[pid]&&controla(S.produtos[pid]))
    mutate('produtos',pid,p=>{if(!p||!controla(p))return ABORT;const q=baixa[pid];p.hist=histEst(p,'venda',-q,v.rotulo);p.estoque=rq(p,Math.max(0,(+p.estoque||0)-q));return p});
  v._baixa=baixa;return v;
}
async function finalizar(){
  const n=curMesa;if(!st.pag)return;
  if(st.pag==='Dinheiro'&&st.receb>0&&st.receb+0.001<totItens(mesa(n).itens||[]))return toast('O valor recebido é menor que o total. Confira o dinheiro ou apague o campo.');
  const v=await fecharComanda(n,{pag:st.pag,cpf:st.cpf,nota:st.nota});if(!v)return;
  const baixados=Object.keys(v._baixa).map(pid=>{const p=S.produtos[pid];return p&&controla(p)?`${ehKg(p)?kg3(v._baixa[pid])+' kg':v._baixa[pid]+'x'} ${esc(nomeP(p))} → ficou ${ehKg(p)?kg3(p.estoque)+' kg':p.estoque}`:null}).filter(Boolean);
  if(isDel(n))st.aba='delivery';
  go('mesas');
  abrirModal(`<div style="text-align:center"><div style="font-size:3.5rem">✅</div><h2>Venda finalizada!</h2>
  <p>${v.troco?`<span style="font-size:1.6rem">Troco: <b>${brl(v.troco)}</b></span><br>`:''}${esc(v.rotulo)} ${n===BAL?'concluída':isDel(n)?'concluído':'liberada'} · ${esc(v.pagamento)} · <b>${brl(v.total)}</b>${v.cpf?`<br>${tipoDoc(v.cpf)} na nota: <b>${v.cpf}</b>`:''}</p></div>
  ${v.nota?`<div class="aviso" style="margin:0 0 10px">🧾 Nota fiscal <b>a emitir</b> — ficou na lista <b>Notas a emitir</b> (menu Histórico).</div>`:''}
  ${baixados.length?`<div class="calc" style="font-size:.85rem">📦 Baixa automática no estoque:<br>${baixados.join('<br>')}</div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="reimprimirUltimo()">🖨️ Recibo <kbd class="k">F9</kbd></button>

  <button class="btn pri" style="flex:1" onclick="fecharModal()">OK <kbd class="k">Esc</kbd></button></div>`);
  alertaEstoque(Object.keys(v._baixa),'Estoque baixo após a venda!');
}

function bobina(){const v=lsGet('lg-bob','80');if(v==='58')return 58;if(v==='80')return 80;return Math.max(40,Math.min(120,Math.round(num(lsGet('lg-bobmm','80')))||80))}

/* ================= AÇOUGUE (mesmo sistema; vale quando o cliente da Central é do tipo Açougue) ================= */
/* Caixa grande: lança por código, código de barras, etiqueta da balança ou nome; peso em kg ou g;
   altera quantidade, preço e desconto de cada item; exclui item; desconto na venda; cancela a venda; devolução. */
const kg3=x=>(+x||0).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const fmtQ=q=>Number.isInteger(+q)?String(+q):kg3(q);
const ehKg=p=>!!(p&&p.porKg);
const unP=p=>ehKg(p)?'kg':'un';
const rq=(p,x)=>ehKg(p)?Math.round((+x||0)*1000)/1000:Math.round(+x||0);
const r2=x=>Math.round((+x||0)*100)/100;
/* "1,250" = 1,250 kg · "350g" ou "350" = 350 gramas · "1kg" = 1 kg */
function lerPeso(t){t=String(t||'').trim().toLowerCase().replace(/\s/g,'');if(!t)return 0;
  if(/kg$/.test(t))return num(t.replace(/kg$/,''));
  if(/g$/.test(t))return num(t.replace(/g$/,''))/1000;
  const n=num(t);return /[.,]/.test(t)?n:(n>=30?n/1000:n)}
const balCfg=()=>({prefixo:'2',digitos:5,traz:'preco',...((S.config||{}).balanca||{})});
/* etiqueta da balança (EAN-13 começando com o prefixo): 2 + código do produto + valor (preço total ou peso) + dígito verificador */
function lerEtiqueta(t){t=soDig(t);const c=balCfg();if(t.length!==13||!t.startsWith(String(c.prefixo||'2')))return null;
  const nd=Math.min(6,Math.max(4,+c.digitos||5)),cod=t.slice(1,1+nd),val=t.slice(1+nd,12);
  const ps=Object.values(S.produtos);
  const p=ps.find(x=>x.plu&&String(+x.plu)===String(+cod))||ps.find(x=>String(x.codigo||'')===String(+cod));
  if(!p)return {erro:`Etiqueta da balança: produto de código ${+cod} não cadastrado. Confira o código da balança em Produtos.`};
  const v=+val;
  if(c.traz==='peso'){const q=v/1000;return {p,qtd:q,tot:r2(q*p.preco)}}
  const tot=v/100,q=p.preco>0?Math.round(tot/p.preco*1000)/1000:1;return {p,qtd:q,tot}}
const pdvIts=()=>mesa(BAL).itens||[];

function pdvAdd(p,qtd,tot){

  qtd=rq(p,qtd);if(!(qtd>0))return toast(ehKg(p)?'Informe o peso.':'Informe a quantidade.'),false;
  const lin={lid:uid(),pid:p.id,nome:nomeP(p),preco:+p.preco,custo:+p.custo||0,qtd,un:unP(p)};if(tot!=null)lin.tot=r2(tot);
  mutate('mesas',BAL,m=>{m=m||{itens:[]};m.itens=m.itens||[];
    const ig=!ehKg(p)&&tot==null&&m.itens.find(i=>i.pid===p.id&&!i.desc&&i.tot==null&&i.un!=='kg');
    if(ig)ig.qtd+=qtd;else{const d=m.itens.findIndex(i=>i.pid==='desconto');d>=0?m.itens.splice(d,0,lin):m.itens.push(lin)}
    if(!m.aberta)m.aberta=new Date().toISOString();return m});
  st.pdvUlt=lin.lid;bip();alertaEstoque([p.id]);return true}

  let mult=null;const mm=t.match(/^(\d+(?:[.,]\d+)?)\s*[*x]\s*(.+)$/i);if(mm){mult=num(mm[1]);t=mm[2].trim()}
  const et=/^\d{13}$/.test(t)&&!Object.values(S.produtos).some(x=>x.barras===t)?lerEtiqueta(t):null;
  if(et){if(et.erro)return toast(et.erro);if(pdvAdd(et.p,et.qtd,et.tot))pdvLimpar();return}
  const p=acharProduto(t)||(()=>{const l=buscaProds(t);return l.length===1?l[0]:null})();
  if(!p){const l=buscaProds(t);return toast(/^\d+$/.test(t)?`Código ${t} não encontrado. Confira em Produtos.`:(l.length?'Mais de um produto com esse nome: escolha na lista.':'Nenhum produto com esse nome.'))}
  pdvComProduto(p,mult!=null?String(mult):qtdTx)}

  st.edBase={q:i.qtd,p:i.preco,tot:i.tot!=null?r2(i.tot+(i.desc||0)):null};pdvPrevEd();setTimeout(()=>{const x=$('#eq1');x&&x.select()},40)}

  const b={};(v.itens||[]).forEach(i=>{if(S.produtos[i.pid])b[i.pid]=(b[i.pid]||0)+(+i.qtd||0)});
  for(const pid in b)if(controla(S.produtos[pid]))mutate('produtos',pid,x=>{if(!x)return ABORT;x.hist=histEst(x,'venda excluída',b[pid],rotV(v));x.estoque=rq(x,(+x.estoque||0)+b[pid]);return x});
  const mv=S.movimentos[v.movId]||movAtual();if(mv)mutate('movimentos',mv.id,x=>x?{...x,cancelamentos:[...(x.cancelamentos||[]),{rotulo:'Venda excluída ('+rotV(v)+')',itens:v.itens,total:v.total,hora:new Date().toISOString(),motivo:mot}].slice(-200)}:ABORT);
  toast('🗑️ Venda excluída e estoque devolvido')}
/* troco no dinheiro */
function blocoTroco(tot){const r=st.receb||'';return `<div class="troco"><label for="trc">Valor recebido em dinheiro</label><input id="trc" inputmode="decimal" value="${r?String(r).replace('.',','):''}" placeholder="Ex.: 100,00" oninput="st.receb=num(this.value);$('#trv').innerHTML=st.receb>=${tot}?'Troco: <b>'+brl(st.receb-${tot})+'</b>':'Falta: <b>'+brl(${tot}-st.receb)+'</b>'">
  <div class="trv" id="trv">${r?(r>=tot?'Troco: <b>'+brl(r-tot)+'</b>':'Falta: <b>'+brl(tot-r)+'</b>'):'Digite quanto o cliente deu para ver o troco.'}</div></div>`}
/* fornecedor do produto (opcional, no Estoque) */
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function fornecedor(id){const p=S.produtos[id],f=p.forn||{};
  abrirModal(`<h2>🚚 Fornecedor — ${esc(nomeP(p))}</h2><p style="color:var(--mut);margin:0 0 6px">Opcional. Ajuda a saber de quem compra, quando ele vem e quanto paga.</p>
  <div class="grid2"><div><label>Fornecedor</label><input id="fn1" maxlength="60" value="${esc(f.nome||'')}" list="fnl" placeholder="Ex.: Frigorífico Boi Bom"><datalist id="fnl">${[...new Set(Object.values(S.produtos).map(x=>x.forn&&x.forn.nome).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
  <div><label>Telefone / WhatsApp</label><input id="ff1" maxlength="20" inputmode="tel" value="${esc(f.fone||'')}"></div></div>
  <label>Dias em que ele vem</label><div class="chips">${DIAS.map((d,i)=>`<label class="chip ${(f.dias||[]).includes(i)?'act':''}"><input type="checkbox" class="hidden" data-dia="${i}" ${(f.dias||[]).includes(i)?'checked':''} onchange="this.parentNode.classList.toggle('act',this.checked)">${d}</label>`).join('')}</div>
  <div class="grid2"><div><label>Pedido mínimo / como compra</label><input id="fo1" maxlength="80" value="${esc(f.obs||'')}" placeholder="Ex.: caixa com 10 kg"></div>
  <div><label>Quanto paga (custo) R$${ehKg(p)?' por kg':''}</label><input id="fc1" inputmode="decimal" value="${p.custo||''}"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="fecharModal()">Voltar</button><button class="btn ok" style="flex:2" onclick="salvarFornecedor('${id}')">💾 Salvar</button></div>`)}
function salvarFornecedor(id){const f={nome:$('#fn1').value.trim(),fone:$('#ff1').value.trim(),obs:$('#fo1').value.trim(),dias:[...document.querySelectorAll('[data-dia]')].filter(x=>x.checked).map(x=>+x.dataset.dia)},c=num($('#fc1').value);
  mutate('produtos',id,p=>{if(!p)return ABORT;p.forn=f.nome||f.fone||f.dias.length?f:null;if(c>0)p.custo=c;return p});fecharModal();toast('✅ Fornecedor salvo')}
function cartaoFornecedores(){const ps=Object.values(S.produtos).filter(p=>p.forn&&p.forn.nome),hoje=new Date().getDay(),g={};
  ps.forEach(p=>{const n=p.forn.nome;(g[n]=g[n]||{dias:new Set(),fone:p.forn.fone,ps:[]}).ps.push(p);(p.forn.dias||[]).forEach(d=>g[n].dias.add(d));if(!g[n].fone)g[n].fone=p.forn.fone});
  const ns=Object.keys(g).sort((a,b)=>a.localeCompare(b,'pt-BR'));if(!ns.length)return '';
  const vem=ns.filter(n=>g[n].dias.has(hoje));
  return `<div class="card forn"><h3>🚚 Fornecedores ${vem.length?`· <span class="tag" style="background:#fff3c4;color:#7a5200">hoje vem: ${vem.map(esc).join(', ')}</span>`:''}</h3>
  ${ns.map(n=>`<div class="forn-l"><b>${esc(n)}</b><small>${[...g[n].dias].sort().map(d=>DIAS[d]).join(', ')||'dia não informado'}${g[n].fone?' · '+esc(g[n].fone):''}</small><small>${g[n].ps.map(p=>esc(p.nome)+' ('+(controla(p)?fmtQ(+p.estoque)+(ehKg(p)?' kg':''):'—')+')').join(' · ')}</small></div>`).join('')}</div>`}
/* Ajustes › Balança */
function cartaoBalanca(){const c=balCfg();
  return `<div class="card"><h3>⚖️ Balança que imprime etiqueta</h3><p style="color:var(--mut);margin:0 0 8px">Quando a balança imprime a etiqueta com código de barras, o caixa só passa o leitor: o sistema lê o produto e o peso ou o preço. Confira na balança como a etiqueta foi configurada (é o padrão das balanças Toledo, Filizola, Elgin e Urano).</p>
  <div class="grid2"><div><label>A etiqueta começa com</label><input id="bpx" maxlength="1" inputmode="numeric" value="${esc(c.prefixo)}"></div>
  <div><label>Dígitos do código do produto</label><select id="bdg">${[4,5,6].map(n=>`<option ${+c.digitos===n?'selected':''}>${n}</option>`).join('')}</select></div>
  <div style="grid-column:1/-1"><label>A etiqueta traz</label><select id="btz"><option value="preco" ${c.traz!=='peso'?'selected':''}>O preço total (R$)</option><option value="peso" ${c.traz==='peso'?'selected':''}>O peso (kg)</option></select></div></div>
  <button class="btn ok" style="margin-top:10px" onclick="salvarBalanca()">💾 Salvar</button>
  <label style="margin-top:14px">Teste: passe o leitor numa etiqueta aqui</label><input id="btst" inputmode="numeric" placeholder="Ex.: 2000120012504" oninput="testarEtiqueta(this.value)" onkeydown="if(event.key==='Enter')event.preventDefault()"><div class="calc" id="btres">O código do produto na etiqueta é o <b>código do produto</b> aqui no sistema (ou o “código na balança”, se for diferente).</div></div>`}
function salvarBalanca(){const b={prefixo:soDig($('#bpx').value).slice(0,1)||'2',digitos:+$('#bdg').value,traz:$('#btz').value};mutate('config','geral',c=>({...(c||{}),balanca:b}));toast('✅ Balança salva')}
function testarEtiqueta(t){const e=$('#btres');t=soDig(t);if(t.length<13){e.innerHTML='A etiqueta tem 13 números.';return}const r=lerEtiqueta(t);
  e.innerHTML=!r?'Esta etiqueta não começa com o número configurado.':r.erro?esc(r.erro):`✅ <b>${esc(nomeP(r.p))}</b> · ${kg3(r.qtd)} kg · <b>${brl(r.tot)}</b>`}

let scan='',scanT=0;

  if(GARCOM)return;
  const k=e.key,aberto=!$('#modalBg').classList.contains('hidden');
  const F={F1:ajuda,F2:()=>{fecharModal();go('mesas')},F3:()=>{fecharModal();go('produtos')},F4:()=>{fecharModal();go('estoque')},F6:()=>{fecharModal();go('historico')},F7:()=>{fecharModal();go('relatorios')},F8:f8,F9:reimprimirUltimo,

  if(F[k]){e.preventDefault();F[k]();return}
  if(k==='Escape'){if(!$('#alerta').classList.contains('hidden'))$('#alerta').classList.add('hidden');if(aberto)fecharModal();else if(view==='mesa')go('mesas');return}
  if(aberto&&modalTipo==='venda'){if(document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type!=='checkbox'){if(k==='Enter'&&st.pag){e.preventDefault();finalizar()}return}const p=Object.keys(PAGK).find(x=>PAGK[x].toLowerCase()===k.toLowerCase());
    if(p){e.preventDefault();st.pag=p;modalVenda()}else if(k==='Enter'&&st.pag){e.preventDefault();finalizar()}return}
  // leitor de código de barras: números chegando muito rápido + Enter (fora de qualquer campo)
  if(!aberto&&!digitando()&&(view==='mesas'||view==='mesa')){const agora=Date.now();
    if(/^\d$/.test(k)){scan=(agora-scanT<60?scan:'')+k;scanT=agora}
    else if(k==='Enter'&&scan.length>=6&&agora-scanT<120){e.preventDefault();const c=scan;scan='';numBuf='';
      const p=acharProduto(c);if(!p){toast(`Código de barras ${c} não cadastrado. Cadastre em Produtos.`);return}
      if(view==='mesa')lancarEm(curMesa,p.id);else{lancarEm(BAL,p.id);balRedesenhar(false)}return}}
  if(ACG&&view==='pdv'&&!aberto){
    if(k==='F5'){e.preventDefault();pdvDescontoVenda();return}
    if(k==='Delete'&&!(document.activeElement&&document.activeElement.value)){e.preventDefault();pdvExcluirUltimo();return}
    if(!digitando()&&k.length===1){const q=$('#pdq');if(q)q.focus()}}
  if(view==='mesa'&&!aberto&&!digitando()&&/^\d$/.test(k)){const f=$('#view [data-focus]');if(f){f.focus()}}
  if(view==='mesas'&&!aberto&&!digitando()){
    if(/^\d$/.test(k)){numBuf=(numBuf+k).slice(-2);if(scan.length<3)toast(`Mesa ${numBuf} — aperte Enter para abrir`)}
    else if(k==='Enter'&&numBuf){const n=+numBuf;numBuf='';if(n>=1&&n<=NM())abrirMesa(n);else toast('Mesa inválida (1 a '+NM()+')')}
    else if(k==='Backspace'){numBuf=numBuf.slice(0,-1)}}
});

function abrirMov(){if(movAberto())return;const m={id:uid(),abertura:new Date().toISOString(),fechamento:null};
  put('movimentos',m.id,m);mutate('estado','atual',e=>({...(e||{}),movId:m.id,seq:0}));toast('🟢 Movimento do dia aberto. Bom trabalho!');go('mesas');
  alertaEstoque(avisos().map(p=>p.id),'Antes de começar: estoque baixo!')}
function fecharMov(){
  let ocup=[];for(let i=1;i<=NM();i++)if(totMesa(i)>0)ocup.push('Mesa '+i);

/* ---------- RELATÓRIOS ---------- */
function movDoRel(id){const movs=Object.values(S.movimentos).sort((a,b)=>b.abertura.localeCompare(a.abertura));return (id&&S.movimentos[id])||movAtual()||movs[0]||null}
function relEstoqueHtml(id){const m=movDoRel(id);if(!m)return `<div class="cupom"><div class="c">Nenhum movimento ainda.</div></div>`;
  const ini=m.abertura,fim=m.fechamento||new Date().toISOString();
  const vend={},vendApos={};
  Object.values(S.vendas).forEach(v=>{const alvo=v.movId===m.id?vend:(v.data>fim?vendApos:null);if(!alvo)return;(v.itens||[]).forEach(i=>alvo[i.pid]=(alvo[i.pid]||0)+i.qtd)});
  const linhas=[],sem=[];
  prodList().forEach(p=>{const vd=vend[p.id]||0;
    if(!controla(p)){if(vd)sem.push({p,vd});return}
    let ent=0,aj=0,depois=0;(p.hist||[]).forEach(h=>{if(h.t==='venda')return;if(h.d>fim)depois+=+h.q||0;else if(h.d>=ini){if(h.t==='ajuste')aj+=+h.q||0;else ent+=+h.q||0}});
    const restou=(+p.estoque||0)-depois+(vendApos[p.id]||0),inicio=restou-ent-aj+vd;
    linhas.push({p,vd,ent,aj,restou,inicio})});
  linhas.sort((a,b)=>a.p.nome.localeCompare(b.p.nome,'pt-BR'));
  const acab=linhas.filter(l=>l.restou<=0).length,baixo=linhas.filter(l=>l.restou>0&&l.restou<=(+l.p.estoqueMin||0)).length;
  return `<div class="cupom">${cupomCab()}<hr><div class="c">RELATÓRIO DE ESTOQUE DO DIA<br>${dt(ini)}${m.fechamento?' até '+dt(m.fechamento).slice(11):' (movimento aberto)'}</div><hr>
  <table><tr><th>Produto</th><th class="n">Vend.</th><th class="n">Restou</th></tr>
  ${linhas.map(l=>`<tr><td>${esc(nomeP(l.p))}${l.p.codigo?' <small>#'+l.p.codigo+'</small>':''}<br><small>início ${l.inicio}${l.ent?' · entrada +'+l.ent:''}${l.aj?' · ajuste '+(l.aj>0?'+':'')+l.aj:''}</small></td><td class="n">${l.vd}</td><td class="n"><b>${l.restou}</b>${l.restou<=0?'<br><small>ESGOTADO</small>':l.restou<=(+l.p.estoqueMin||0)?'<br><small>ACABANDO</small>':''}</td></tr>`).join('')||'<tr><td colspan="3">Nenhum produto com controle de estoque.</td></tr>'}</table>
  ${sem.length?`<hr><div class="c">SEM CONTROLE DE ESTOQUE (VENDIDOS)</div><table>${sem.map(x=>`<tr><td>${esc(nomeP(x.p))}</td><td class="n">${x.vd}</td></tr>`).join('')}</table>`:''}
  <hr><table><tr><td>Itens vendidos</td><td class="n"><b>${Object.values(vend).reduce((a,b)=>a+b,0)}</b></td></tr><tr><td>Esgotados</td><td class="n">${acab}</td></tr><tr><td>Acabando</td><td class="n">${baixo}</td></tr></table>
  <hr><div class="c">Impresso em ${dt(new Date().toISOString())}</div></div>`}
function imprimirEstoqueDia(id){const m=movDoRel(id);lgCarregando('Gerando o relatório de estoque…',()=>imprimir(relEstoqueHtml(id),'estoque-'+(m?dt(m.abertura).slice(0,10).replace(/\//g,'-'):'dia')),'Relatório pronto')}
function vRelatorios(){

function relHtml(id,tela){

  if(!tela)return `<div class="cupom">${cupomCab()}<div class="c">RELATÓRIO DO MOVIMENTO</div><hr>${cab}<hr>${resumo}<hr><b>Por forma de pagamento</b>${tpag}<hr><b>Produtos vendidos</b>${tpr}${tcan?'<hr><b>'+(ACG?'Cancelamentos':'Mesas canceladas')+'</b>'+tcan:''}</div>`;
  return `<div class="stats"><div class="stat"><small>Total vendido</small><b>${brl(tot)}</b></div><div class="stat"><small>Custo</small><b>${brl(cus)}</b></div>
  <div class="stat"><small>Lucro real</small><b class="${luc>=0?'lucro':'prej'}">${brl(luc)}</b></div><div class="stat"><small>Vendas</small><b>${vnd.length}</b></div></div>
  <div class="caixa"><div class="card"><h3>🗓️ Movimento</h3>${cab}<br>${resumo}<br><h3>💳 Por forma de pagamento</h3>${tpag}</div>
  <div class="card"><h3>🥤 Produtos vendidos</h3>${tpr}${tcan?'<h3 style="margin-top:16px">🗑️ '+(ACG?'Cancelamentos':'Mesas canceladas')+' ('+cns.length+')</h3>'+tcan:''}</div></div>`;
}

    <button class="btn" onclick="cdpFoto('${p.id}')">📷 ${p.img?'Trocar foto':'Pôr foto'}</button>${p.img?`<button class="btn" title="Tirar a foto" onclick="mutate('produtos','${p.id}',x=>x?{...x,img:''}:ABORT)">🗑️</button>`:''}<button class="btn" onclick="formProduto('${p.id}')">✏️</button><label class="sw"><input type="checkbox" ${c.ids.includes(p.id)?'checked':''} onchange="cdpTrocar('${p.id}',this.checked)"><i></i></label></div>`).join('')}`).join(''):'<div class="vazio">Cadastre produtos primeiro em Produtos.</div>'}</div>`}

  <div class="card"><h3>🖨️ Impressão neste computador</h3>
  <label class="chk"><input type="checkbox" ${lsGet('lg-printer','1')==='1'?'checked':''} onchange="lsSet('lg-printer',this.checked?'1':'0')"><span>Este computador é o <b>caixa que imprime</b> as contas e recibos pedidos pelos garçons</span></label>

 <div class="${ACG?'hidden':''}"><label>Quantidade de mesas</label><input id="cm" type="number" min="1" max="60" inputmode="numeric" value="${+(c.mesas)||15}"></div>

function salvarLoja(){const d={razao:$('#cr').value.trim(),cnpj:$('#cc').value.trim(),endereco:$('#ce').value.trim(),fone:$('#cf').value.trim(),mesas:Math.max(1,Math.min(60,parseInt($('#cm').value,10)||15))};
  mutate('config','geral',c=>({...(c||{}),...d}));toast('✅ Dados salvos')}
function addGarcom(){const nome=$('#gn').value.trim(),pin=soDig($('#gp').value);
  if(!nome)return toast('Informe o nome do garçom.');if(pin.length!==4)return toast('O PIN precisa ter 4 números.');
  if((S.config.garcons||[]).some(g=>g.pin===pin))return toast('Esse PIN já é de outro garçom.');
  mutate('config','geral',c=>({...(c||{}),garcons:[...((c&&c.garcons)||[]),{id:uid(),nome,pin}]}));toast('✅ '+nome+' cadastrado')}
function removerGarcom(id){const g=(S.config.garcons||[]).find(x=>x.id===id);confirmar(`Remover o garçom <b>${esc(g.nome)}</b>?`,()=>mutate('config','geral',c=>({...c,garcons:(c.garcons||[]).filter(x=>x.id!==id)})))}
function trocarPin(id){abrirModal(`<h2>🔑 Novo PIN</h2><input id="np" inputmode="numeric" maxlength="4" placeholder="4 números"><div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="fecharModal()">Cancelar</button><button class="btn ok" style="flex:1" onclick="const p=soDig($('#np').value);if(p.length!==4)return toast('4 números');if((S.config.garcons||[]).some(g=>g.pin===p&&g.id!=='${id}'))return toast('PIN já usado');mutate('config','geral',c=>({...c,garcons:(c.garcons||[]).map(g=>g.id==='${id}'?{...g,pin:p}:g)}));fecharModal();toast('PIN alterado')">Salvar</button></div>`)}
async function copiar(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copiado')}catch(e){toast('Não deu para copiar — selecione o texto')}}

/* ---------- avisos do caixa (pedidos dos garçons, conta, impressão) ---------- */
function bip(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.frequency.setValueAtTime(660,a.currentTime+.15);o.stop(a.currentTime+.3)}catch(e){}}
let avisosCaixa=[];
function mostrarAvisosCaixa(){const a=$('#alerta');if(!avisosCaixa.length){a.classList.add('hidden');return}
  a.innerHTML=`<h4 style="color:var(--pri)">🔔 Avisos dos garçons <span style="float:right;cursor:pointer" onclick="event.stopPropagation();avisosCaixa=[];mostrarAvisosCaixa()">✕</span></h4>${avisosCaixa.map((x,i)=>`<div class="row" style="border-top:1px solid var(--line);padding:6px 0"><span style="flex:1">${x.html}</span>${x.print?`<button class="btn pri" onclick="event.stopPropagation();imprimirAviso(${i})">🖨️</button>`:''}${x.abrir?`<button class="btn" onclick="event.stopPropagation();avisosCaixa.splice(${i},1);mostrarAvisosCaixa();abrirMesa('${x.abrir}')">Abrir</button>`:''}</div>`).join('')}`;
  a.classList.remove('hidden');clearTimeout(a._h);a.onclick=null}
function imprimirAviso(i){const x=avisosCaixa[i];avisosCaixa.splice(i,1);mostrarAvisosCaixa();imprimir(x.print,x.nome)}
function novoAvisoCaixa(x){avisosCaixa.unshift(x);avisosCaixa=avisosCaixa.slice(0,6);bip();mostrarAvisosCaixa()}
const filaVista=new Set();
function processaFila(){if(GARCOM||lsGet('lg-printer','1')!=='1')return;
  for(const [id,f] of Object.entries(S.fila)){if(filaVista.has(id))continue;filaVista.add(id);del('fila',id);
    if(!f.html&&f.ped)f.html=ticketPedido(f.ped);if(!f.html)continue;
    const titulo=f.tipo==='conta'?`🧾 <b>${esc(f.por)}</b> pediu a conta — <b>${esc(f.rotulo)}</b>`:f.tipo==='pedido'?`🍳 <b>${esc(f.rotulo)}</b> para imprimir (${esc(f.por)})`:`🧾 Recibo — <b>${esc(f.rotulo)}</b> (fechado por ${esc(f.por)})`;
    if(lsGet('lg-autoprint','0')==='1'&&$('#modalBg').classList.contains('hidden')){bip();imprimir(f.html,'impressao-'+id);doPrint()}
    else novoAvisoCaixa({html:titulo,print:f.html,nome:'impressao-'+id})}}
hooks.push((col,id,old,nw)=>{
  if(col==='*'||col==='fila')processaFila();
  if(!GARCOM&&col==='mesas'&&nw&&!old&&isDel(id)&&nw.origem==='cardapio')novoAvisoCaixa({html:`📲 <b>Novo pedido do cardápio nº ${esc(nw.num)}</b> — ${esc(nw.cliente||'')} · ${nw.tipo==='entrega'?'entrega':nw.tipo==='local'?'comer no local':'retirada'} · ${brl(totItens(nw.itens||[]))}`,abrir:id});
  if(GARCOM||col!=='mesas'||!nw)return;
  const po=(old&&old.pedidos)||[],pn=nw.pedidos||[];
  const novos=pn.filter(p=>!po.some(q=>q.id===p.id)&&p.dev!==DEV);
  novos.forEach(p=>novoAvisoCaixa({html:`🧑‍🍳 <b>${esc(rotulo(id))}</b> — ${esc(p.por)}: ${p.itens.map(i=>i.qtd+'x '+esc(i.nome)).join(', ')}${p.obs?` <i>(${esc(p.obs)})</i>`:''}`,abrir:id}));
  if(nw.conta&&!(old&&old.conta)&&nw.conta.dev!==DEV&&!novos.length&&lsGet('lg-printer','1')!=='1')novoAvisoCaixa({html:`🧾 <b>${esc(rotulo(id))}</b> — ${esc(nw.conta.por)} pediu a conta`,abrir:id});
});

/* =================== APP DO GARÇOM =================== */
const g={tela:'mesas',mesa:null,aba:'pedido',cat:null,pin:'',sel:null,carts:{},obs:'',imprimirCaixa:true};
try{g.carts=JSON.parse(lsGet('lg-carts','{}'))||{}}catch(e){}
const gUser=()=>(S.config.garcons||[]).find(x=>x.id===lsGet('lg-garcom'));
const cart=()=>g.carts[g.mesa]||(g.carts[g.mesa]={});
const saveCarts=()=>lsSet('lg-carts',JSON.stringify(g.carts));
const cartItens=()=>Object.entries(cart()).filter(([pid,q])=>q>0&&S.produtos[pid]).map(([pid,q])=>({p:S.produtos[pid],q}));
function gGo(t,extra){Object.assign(g,{tela:t},extra||{});render(true);window.scrollTo(0,0)}
function gRender(){
  document.body.classList.add('gmode');
  const u=gUser();let h='';
  if(!u)return gLogin();
  h+=`<div class="gtop"><div class="logo" style="width:38px;height:38px">${S.config.logo?`<img src="${S.config.logo}">`:LOGO_SVG}</div><div style="flex:1;line-height:1.1"><b>GR ${ACG?'Açougue':'Restaurante'}</b><br><small>👤 ${esc(u.nome)}${mode==='api'?(online?' · 🟢 online':' · 🔴 sem conexão'):''}</small></div><button class="gbtn" style="white-space:nowrap" onclick="atualizarApp()" title="Atualizar o app">↻ Atualizar${novaVersao?' •':''}</button><button class="gbtn" onclick="confirmar('Sair do app?',()=>{lsSet('lg-garcom',null);render(true)})">Sair</button></div>`;
  if(!movAberto())h+=`<div class="aviso" style="margin:10px">⚠️ O caixa ainda não abriu o movimento do dia. Os pedidos só podem ser enviados depois.</div>`;
  if(g.tela==='mesas')h+=gMesas();
  else if(g.tela==='mesa')h+=gMesa();
  else if(g.tela==='carrinho')h+=gCarrinho();
  else if(g.tela==='fechar')h+=gFechar();
  return h;
}
function gLogin(){const gs=S.config.garcons||[];
  let h=`<div class="glogin"><div class="logo" style="width:84px;height:84px;margin:0 auto">${S.config.logo?`<img src="${S.config.logo}">`:LOGO_SVG.replace('width="34" height="34"','width="56" height="56"')}</div><h2 style="text-align:center;margin:12px 0 2px">GR Restaurante</h2><p style="text-align:center;color:var(--mut);margin:0 0 18px">App do Garçom</p>`;
  if(!gs.length)return h+`<div class="card vazio">Nenhum garçom cadastrado.<br>Peça ao caixa para cadastrar em <b>⚙️ Ajustes → Garçons</b>.</div></div>`;
  if(!g.sel)return h+`<b>Quem é você?</b><div class="gnomes">${gs.map(x=>`<button onclick="g.sel='${x.id}';g.pin='';render(true)">👤<br>${esc(x.nome)}</button>`).join('')}</div></div>`;
  const x=gs.find(y=>y.id===g.sel);
  return h+`<p style="text-align:center"><b>${esc(x?x.nome:'')}</b>, digite seu PIN</p><div class="pindots">${[0,1,2,3].map(i=>`<span class="${g.pin.length>i?'on':''}"></span>`).join('')}</div>
  <div class="pinpad">${[1,2,3,4,5,6,7,8,9,'←',0,'⌫'].map(k=>`<button onclick="gPin('${k}')">${k}</button>`).join('')}</div></div>`}
function gPin(k){if(k==='←'){g.sel=null;g.pin='';return render(true)}if(k==='⌫'){g.pin=g.pin.slice(0,-1);return render(true)}
  g.pin+=k;if(g.pin.length===4){const x=(S.config.garcons||[]).find(y=>y.id===g.sel);
    if(x&&x.pin===g.pin){lsSet('lg-garcom',x.id);g.pin='';g.sel=null;toast('Olá, '+x.nome+'! 👋')}else{g.pin='';toast('❌ PIN errado')}}
  render(true)}
function gMesas(){
  let h=`<div class="gpad"><h2 style="margin:6px 0 10px">Escolha a mesa</h2><div class="gmesas">`;
  for(let i=1;i<=NM();i++){const t=totMesa(i),m=mesa(i),c=Object.values(g.carts[String(i)]||{}).reduce((a,b)=>a+b,0);
    h+=`<button class="${t>0?'ocupada':''} ${m.conta?'conta':''}" onclick="gGo('mesa',{mesa:'${i}',aba:'pedido',cat:null})"><span class="ic">${t>0?MESA_OC:MESA_LIVRE}</span><b>${i}</b><small>${t>0?brl(t):'Livre'}</small>${m.conta?'<em>🧾 conta</em>':c?`<em>🛒 ${c}</em>`:''}</button>`}
  return h+'</div></div>'}
function gMesa(){
  const n=g.mesa,m=mesa(n),its=m.itens||[],tot=totItens(its);
  let h=`<div class="gbar"><button class="gbtn" onclick="gGo('mesas')">← Mesas</button><b style="flex:1;font-size:1.25rem">Mesa ${n}</b><span><small>Total</small><br><b>${brl(tot)}</b></span></div>
  <div class="gtabs"><button class="${g.aba==='pedido'?'act':''}" onclick="g.aba='pedido';render(true)">🍽️ Fazer pedido</button><button class="${g.aba==='conta'?'act':''}" onclick="g.aba='conta';render(true)">🧾 Conta ${tot?brl(tot):''}</button></div>`;
  if(g.aba==='conta')return h+gConta();
  const cats=CATS.filter(c=>prodList().some(p=>p.cat===c));
  if(!g.cat){h+=`<div class="gpad"><div class="gcats">${cats.map(c=>`<button onclick="g.cat='${c}';render(true)"><i>${CATIC[c]}</i>${c}<small>${prodList().filter(p=>p.cat===c).length} itens</small></button>`).join('')}</div>${!cats.length?'<div class="card vazio">Nenhum produto cadastrado no caixa.</div>':''}</div>`}
  else{h+=`<div class="gchips"><button onclick="g.cat=null;render(true)">☰ Menus</button>${cats.map(c=>`<button class="${g.cat===c?'act':''}" onclick="g.cat='${c}';render(true);window.scrollTo(0,0)">${CATIC[c]} ${c}</button>`).join('')}</div><div class="gpad">`;
    prodList().filter(p=>p.cat===g.cat).forEach(p=>{const q=cart()[p.id]||0,d=disponivel(p)-q;
      h+=`<div class="gprod ${disponivel(p)<=0?'esg':''}"><div class="thumb">${p.img?`<img src="${p.img}">`:(CATIC[p.cat]||'🍽️')}</div><div class="nm"><b>${esc(p.nome)}</b><small>${p.codigo?'cód. '+p.codigo+(p.unidade?' · ':''):''}${esc(p.unidade||'')}</small><span class="pr">${brl(p.preco)}</span>${disponivel(p)<=0?'<small class="st-esg">⛔ Esgotado</small>':d!==Infinity&&d<=estMin(p)?`<small class="low">⚠️ restam ${Math.max(0,d)}</small>`:''}</div>
      <div class="gqty">${q?`<button onclick="gAdd('${p.id}',-1)">−</button><span>${q}</span>`:''}<button class="mais" onclick="gAdd('${p.id}',1)">+</button></div></div>`});
    h+='</div>'}
  const ci=cartItens();
  if(ci.length)h+=`<div class="gcart" onclick="gGo('carrinho')"><span>🛒 <b>${ci.reduce((a,x)=>a+x.q,0)} itens</b> · ${brl(ci.reduce((a,x)=>a+x.q*x.p.preco,0))}</span><b>Ver e enviar ▸</b></div>`;
  return h}
function gAdd(pid,d){const c=cart(),p=S.produtos[pid];if(!p)return;
  if(d>0&&disponivel(p)-(c[pid]||0)<=0)return toast(`${p.nome} sem estoque`);
  c[pid]=Math.max(0,(c[pid]||0)+d);if(!c[pid])delete c[pid];saveCarts();render(true)}
function gCarrinho(){const ci=cartItens(),t=ci.reduce((a,x)=>a+x.q*x.p.preco,0);
  let h=`<div class="gbar"><button class="gbtn" onclick="gGo('mesa')">← Continuar</button><b style="flex:1;font-size:1.15rem">Pedido — Mesa ${g.mesa}</b></div><div class="gpad">`;
  if(!ci.length)return h+`<div class="card vazio">Nenhum item escolhido.</div></div>`;
  ci.forEach(({p,q})=>{h+=`<div class="gprod"><div class="thumb">${p.img?`<img src="${p.img}">`:(CATIC[p.cat]||'🍽️')}</div><div class="nm"><b>${esc(p.nome)}</b><small>${brl(p.preco)} cada</small><span class="pr">${brl(p.preco*q)}</span></div><div class="gqty"><button onclick="gAdd('${p.id}',-1)">−</button><span>${q}</span><button class="mais" onclick="gAdd('${p.id}',1)">+</button></div></div>`});
  h+=`<div class="total"><span>Total do pedido</span><span>${brl(t)}</span></div>
  <label>📝 Observação para a cozinha</label><input id="gobs" value="${esc(g.obs)}" oninput="g.obs=this.value" placeholder="Ex.: sem cebola, bem passado">
  <button class="btn ok big" style="margin-top:14px" onclick="gEnviar()">📤 Enviar pedido para o caixa</button>
  <button class="btn big" style="margin-top:8px" onclick="g.carts[g.mesa]={};saveCarts();gGo('mesa')">🗑️ Limpar pedido</button></div>`;
  return h}
async function gEnviar(){
  if(!movAberto())return toast('O caixa ainda não abriu o movimento.');
  const u=gUser(),n=g.mesa,ci=cartItens();if(!ci.length)return;
  for(const {p,q} of ci)if(disponivel(p)<q)return toast(`⛔ ${p.nome}: só tem ${Math.max(0,disponivel(p))} no estoque`);
  const ped={id:uid(),por:u.nome,dev:DEV,hora:new Date().toISOString(),itens:ci.map(({p,q})=>({nome:nomeP(p),qtd:q})),obs:g.obs.trim()};
  const ok=await mutate('mesas',n,m=>{for(const {p,q} of ci)m=addNaComanda(m,p.id,q,u.nome);m.pedidos=[...(m.pedidos||[]),ped].slice(-40);return m});
  if(!ok)return toast('Não foi possível enviar. Tente de novo.');
  g.carts[n]={};g.obs='';saveCarts();toast('✅ Pedido enviado para o caixa!');alertaEstoque(ci.map(x=>x.p.id));gGo('mesa',{aba:'conta',cat:null});
  gPerguntarImpressao(n,ped,u)}
let gUltPed=null;
function gPerguntarImpressao(n,ped,u){gUltPed={n,ped,u};
  abrirModal(`<div style="text-align:center"><div class="hic" style="width:64px;height:64px;border-radius:18px;margin:0 auto 12px;display:grid"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg></div>
  <h2 style="justify-content:center">Imprimir este pedido?</h2><p style="color:var(--mut)">O pedido já está lançado na Mesa ${n}. Imprimir manda o papel para a cozinha (na impressora do caixa).</p>
  <div class="row" style="margin-top:14px"><button class="btn big" style="flex:1" onclick="fecharModal()">Não</button><button class="btn ok big" style="flex:1.4" onclick="gImprimirPedido()">🖨️ Sim, imprimir</button></div></div>`)}
async function gImprimirPedido(){const x=gUltPed;fecharModal();if(!x)return;
  await mutate('estado','atual',e=>({...(e||{}),seq:((e&&e.seq)||0)+1}));
  const num=(S.estado&&S.estado.seq)||'';
  await put('fila',uid(),{tipo:'pedido',rotulo:'Pedido nº '+num+' — Mesa '+x.n,por:x.u.nome,html:ticketPedido({num,mesa:x.n,itens:x.ped.itens,obs:x.ped.obs,por:x.u.nome,hora:x.ped.hora}),ts:Date.now()});
  toast('🖨️ Pedido nº '+num+' enviado para imprimir')}
function gConta(){const n=g.mesa,m=mesa(n),its=m.itens||[],tot=totItens(its);
  let h=`<div class="gpad">`;
  if(!its.length)return h+`<div class="card vazio">Mesa sem consumo ainda.</div></div>`;
  h+=`<div class="card">${its.map(i=>`<div class="it"><div class="nm"><b>${i.qtd}x ${esc(i.nome)}</b><small>${brl(i.preco)} cada</small></div><div class="sub">${brl(vIt(i))}</div></div>`).join('')}
  <div class="total"><span>Total</span><span>${brl(tot)}</span></div></div>
  ${m.conta?`<div class="aviso" style="margin-top:10px">🧾 Conta pedida por ${esc(m.conta.por)} às ${hr(m.conta.hora)}.</div>`:''}
  <button class="btn pri big" style="margin-top:12px" onclick="gPedirConta()">🖨️ Pedir conta — imprime no caixa</button>
  <button class="btn acc big" style="margin-top:8px" onclick="st.pag=null;st.cpf='';st.nota=false;gGo('fechar')">💳 Fechar pelo app (maquininha)</button>
  ${(m.pedidos||[]).length?`<h3 style="margin-top:18px">Pedidos enviados</h3>${m.pedidos.slice().reverse().map(p=>`<div class="pedlog"><b>${hr(p.hora)} · ${esc(p.por)}</b> — ${p.itens.map(i=>i.qtd+'x '+esc(i.nome)).join(', ')}${p.obs?`<br><i>📝 ${esc(p.obs)}</i>`:''}</div>`).join('')}`:''}</div>`;
  return h}
function resumoHtml(n){const its=mesa(n).itens||[];return `<div class="cupom">${cupomCab()}<hr><div class="c">RESUMO — CONFERÊNCIA<br>${esc(rotulo(n))} · ${dt(new Date().toISOString())}${mesa(n).garcom?'<br>Garçom: '+esc(mesa(n).garcom):''}</div><hr>${tabelaItens(its)}<hr>
  <table><tr><td>Itens</td><td class="n">${its.reduce((s,i)=>s+i.qtd,0)}</td></tr><tr><td><b>TOTAL</b></td><td class="n"><b>${brl(totItens(its))}</b></td></tr></table><hr><div class="c">NÃO É DOCUMENTO FISCAL<br>Confira antes de pagar</div></div>`}
async function gPedirConta(){const u=gUser(),n=g.mesa;
  await mutate('mesas',n,m=>m?{...m,conta:{por:u.nome,dev:DEV,hora:new Date().toISOString()}}:ABORT);
  await put('fila',uid(),{tipo:'conta',rotulo:rotulo(n),por:u.nome,html:resumoHtml(n),ts:Date.now()});
  toast('🖨️ Conta enviada para imprimir no caixa');render(true)}
function gFechar(){const n=g.mesa,its=mesa(n).itens||[],tot=totItens(its);
  return `<div class="gbar"><button class="gbtn" onclick="gGo('mesa',{aba:'conta'})">← Voltar</button><b style="flex:1;font-size:1.15rem">Fechar Mesa ${n}</b></div><div class="gpad">
  <div class="totalBig">${brl(tot)}</div><b>Forma de pagamento</b>
  <div class="pags">${PAGS.map(([p,i])=>`<button class="${st.pag===p?'act':''}" onclick="st.pag='${p}';render(true)"><i>${i}</i>${p}</button>`).join('')}</div>
  ${blocoCPF()}
  <label class="chk"><input type="checkbox" ${g.imprimirCaixa?'checked':''} onchange="g.imprimirCaixa=this.checked"><span>Imprimir o recibo no caixa</span></label>
  <button class="btn ok big" style="margin-top:12px" ${st.pag?'':'disabled'} onclick="gFinalizar()">✅ Pagamento aprovado — Finalizar</button></div>`}
async function gFinalizar(){const u=gUser(),n=g.mesa;
  const v=await fecharComanda(n,{pag:st.pag,cpf:st.cpf,nota:st.nota,por:u.nome});if(!v)return;
  if(g.imprimirCaixa)put('fila',uid(),{tipo:'recibo',rotulo:v.rotulo,por:u.nome,html:cupomVenda(v),ts:Date.now()});
  g.carts[n]={};saveCarts();gGo('mesas');
  abrirModal(`<div style="text-align:center"><div style="font-size:3.5rem">✅</div><h2>Mesa ${n} fechada!</h2><p>${esc(v.pagamento)} · <b>${brl(v.total)}</b>${v.cpf?'<br>CPF na nota: '+v.cpf:''}</p>${g.imprimirCaixa?'<p>🖨️ O recibo vai sair na impressora do caixa.</p>':''}<button class="btn pri big" onclick="fecharModal()">OK</button></div>`)}

/* ---------- modal ---------- */
let modalTipo=null;
function abrirModal(h,tipo){modalTipo=tipo||null;$('#modal').innerHTML=h;lgEnfeitar($('#modal'));$('#modalBg').classList.remove('hidden')}
function fecharModal(){modalTipo=null;$('#modalBg').classList.add('hidden');$('#modal').innerHTML=''}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')fecharModal()});
let _cb=null;
function confirmar(msg,cb){_cb=cb;abrirModal(`<p style="font-size:1.1rem">${msg}</p><div class="row"><button class="btn" style="flex:1" onclick="fecharModal()">Cancelar</button><button class="btn pri" style="flex:1" onclick="const f=_cb;fecharModal();f&&f()">Confirmar</button></div>`)}

iniciar();
</script>
