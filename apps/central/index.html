<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<title>LegislaGov Central</title>
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<script>(function(){var b=location.pathname.replace(/[^/]*$/,'');var l=document.createElement('link');l.rel='manifest';l.href='/api/central/manifest.json?b='+encodeURIComponent(b);document.head.appendChild(l)})();</script>
<script src="qr.js" defer></script>
<script>(function(){var t='';try{t=localStorage.getItem('lgc_tema')||''}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro';document.documentElement.dataset.tema=t})();</script>
<style>
:root{--fundo:#f4f6f9;--papel:#ffffff;--papel2:#f8fafc;--tinta:#111827;--sub:#5b6676;--linha:#e2e7ee;--forte:#0b1220;--acento:#1683c4;--acento-ink:#fff;--ok:#17703f;--ok-bg:#e2f5ea;--erro:#b42318;--sombra:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);--topo:#ffffffcc;--chip:#eef2f6;--demo:#fff6dc;--demo-ink:#6b4f00;--demo-borda:#ecd38a}
:root[data-tema=escuro]{--fundo:#06080d;--papel:#0f141c;--papel2:#131a24;--tinta:#e8edf4;--sub:#93a0b3;--linha:#1e2733;--forte:#ffffff;--acento:#2bb6ea;--acento-ink:#04121b;--ok:#4fd18b;--ok-bg:#0f2a1d;--erro:#ff7a70;--sombra:none;--topo:#06080dcc;--chip:#18202b;--demo:#2a2210;--demo-ink:#f5d27a;--demo-borda:#5c4a1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.topo{position:sticky;top:0;z-index:20;background:var(--topo);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;color:var(--forte);text-decoration:none}
.marca img{height:30px;width:auto}
.marca span b{color:var(--acento);font-weight:700}
.marca small{display:block;font-weight:500;font-size:11.5px;color:var(--sub);letter-spacing:0}
.esp{flex:1}
.quem{font-size:13.5px;color:var(--sub);white-space:nowrap}
.tbtn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);cursor:pointer;font-size:13.5px;font-weight:600}
.tbtn:hover{border-color:var(--sub)}
.tema{display:inline-flex;border:1px solid var(--linha);border-radius:999px;padding:3px;background:var(--papel)}
.tema button{border:0;background:transparent;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer}
.tema button[aria-pressed=true]{background:var(--forte);color:var(--fundo)}
main{max-width:1120px;margin:0 auto;padding:34px 24px 70px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.025em;color:var(--forte)}
h2{font-size:13px;margin:40px 0 12px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.sub{color:var(--sub);margin:0;max-width:62ch}
.sist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sombra);transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--cor) 55%,var(--linha))}
.cab{display:flex;gap:14px;align-items:flex-start}
.selo{width:52px;height:52px;flex:0 0 52px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--cor) 12%,var(--papel));border:1px solid color-mix(in srgb,var(--cor) 25%,var(--linha))}
.selo img{height:34px;width:auto}
.card h3{margin:2px 0 3px;font-size:16.5px;color:var(--forte);letter-spacing:-.01em}
.card p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.45}
.abrir{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 16px;border-radius:11px;background:var(--forte);color:var(--fundo);font-weight:650;text-decoration:none;font-size:14.5px;margin-top:auto}
.abrir:hover{filter:brightness(1.15)}
.abrir svg{width:16px;height:16px;flex:0 0 16px}
.outros{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.outros a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--linha)}
.outros a:hover{color:var(--tinta);border-color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--forte);border-color:var(--forte);color:var(--fundo)}
.btn.pri:hover{filter:brightness(1.15)}
.btn.demo{background:var(--demo);border-color:var(--demo-borda);color:var(--demo-ink)}
.btn.perigo{color:var(--erro)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.abrir:focus-visible,.tema button:focus-visible,.tbtn:focus-visible{outline:3px solid color-mix(in srgb,var(--acento) 55%,transparent);outline-offset:2px}
.demos{display:flex;flex-direction:column;border:1px solid var(--linha);border-radius:14px;background:var(--papel);overflow:hidden}
.demo-l{padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:3px 16px;align-items:center;border-top:1px solid var(--linha)}
.demo-l:first-child{border-top:0}
.demo-l b{font-size:15px;color:var(--forte)}.demo-l small{color:var(--sub);display:block;font-size:13px}
.demo-l .acoes{grid-row:1/4;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:2px}
.st.on{background:var(--ok-bg);color:var(--ok)}.st.off{background:var(--chip);color:var(--sub)}
.vazio{border:1px dashed var(--linha);border-radius:14px;padding:24px;text-align:center;color:var(--sub);background:var(--papel)}
.entrar{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.entrar form{background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:30px;width:100%;max-width:390px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--sombra)}
.entrar h1{font-size:22px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input,select{height:46px;border:1px solid var(--linha);border-radius:10px;padding:0 12px;font-size:16px;background:var(--papel2);color:var(--tinta)}
.msg{color:var(--erro);font-weight:600;min-height:1.2em;margin:0}
.dica{color:var(--sub);font-size:13px;margin:0}
.fundo{position:fixed;inset:0;background:rgba(3,6,12,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--papel);border:1px solid var(--linha);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:19px;color:var(--forte);letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--linha);background:var(--papel);font-weight:600;cursor:pointer;color:var(--tinta)}
.chip[aria-pressed=true]{background:var(--forte);border-color:var(--forte);color:var(--fundo)}
.rod{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.link{display:flex;gap:6px}.link input{flex:1;font-size:14px}
.qr{align-self:center;padding:10px;background:#fff;border:1px solid var(--linha);border-radius:12px}
.qr svg{display:block;width:200px;height:200px}
.fim{color:var(--sub);font-size:12.5px;text-align:center;margin-top:48px}
@media(max-width:960px){.sist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.topo-in{padding:10px 14px;gap:8px}.quem,.marca small{display:none}main{padding:22px 14px 50px}h1{font-size:23px}.sist{grid-template-columns:1fr}.demo-l{grid-template-columns:1fr}.demo-l .acoes{grid-row:auto;grid-column:auto;justify-content:flex-start}.rod .btn{flex:1}.tbtn{padding:0 9px}}
</style>
</head>
<body>
<div id="app"><p style="padding:30px;text-align:center;color:#5d6b7b">Carregando…</p></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN='';try{TOKEN=localStorage.getItem('lgc_token')||''}catch(e){}
let P=null, MSG='';
async function api(acao,{metodo='GET',corpo=null}={}){
  const r=await fetch('/api/central/'+acao,{method:metodo,cache:'no-store',headers:Object.assign({'Content-Type':'application/json','X-LG':'1'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:corpo?JSON.stringify(corpo):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&acao!=='entrar'){TOKEN='';try{localStorage.removeItem('lgc_token')}catch(e){}P=null;MSG='Sua sessão terminou. Entre de novo.';tela();throw new Error('sessao')}
  if(!r.ok){const e=new Error(d.erro||('Erro '+r.status));e.status=r.status;throw e}
  return d;
}
const quando=t=>{const d=new Date(t*1000);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
function linkDemo(d){
  const base=location.hostname==='central.legislagov.com.br'?'https://rural.legislagov.com.br/':location.origin+'/rural/';
  return base+'?demo='+d.codigo;
}
function nomeSist(id){return (P&&P.sistemas.find(s=>s.id===id)||{nome:id}).nome}

async function tela(){
  if(!TOKEN){telaEntrar();return}
  try{P=await api('eu')}catch(e){if(e.message!=='sessao'){$('#app').innerHTML=`<div class="entrar"><div class="vazio">Sem conexão com o servidor. <button class="btn" onclick="tela()">Tentar de novo</button></div></div>`}return}
  const s=P.sessao, nome=(s.nome||'').split(' ')[0];
  const ativas=P.demos.filter(d=>d.ativa), velhas=P.demos.filter(d=>!d.ativa).slice(0,15);
  const seta='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  $('#app').innerHTML=`<header class="topo"><div class="topo-in"><span class="marca"><img src="em-camara.png" alt=""><span>Legisla<b>Gov</b> Central<small>Área restrita</small></span></span><div class="esp"></div>
    <span class="quem">${esc(s.nome)}</span>${seletorTema()}<button class="tbtn" id="senhaBt">Senha</button><button class="tbtn" id="sairBt">Sair</button></div></header>
  <main>
    <h1>Olá, ${esc(nome)}.</h1>
    <p class="sub">Escolha o sistema. Cada um abre em outra aba. Para mostrar a um cliente, use “Criar demonstração”: tem prazo e para de funcionar sozinha.</p>
    <div class="sist">${P.sistemas.map(x=>`<section class="card" style="--cor:${esc(x.cor)}" aria-labelledby="t-${esc(x.id)}">
      <div class="cab"><div class="selo"><img src="${esc(x.icone)}" alt=""></div><div><h3 id="t-${esc(x.id)}">${esc(x.nome)}</h3><p>${esc(x.desc)}</p></div></div>
      ${x.demo?`<button class="btn demo" data-demo="${esc(x.id)}">Criar demonstração</button>`:''}
      <a class="abrir" href="${esc(x.abrir[1])}" target="_blank" rel="noopener"><span>${esc(x.abrir[0])}</span>${seta}</a>
      ${(x.outros||[]).length?`<div class="outros">${x.outros.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div>`:''}
    </section>`).join('')}</div>
    <h2>Demonstrações ativas</h2>
    <div class="${ativas.length?'demos':''}">${ativas.length?ativas.map(linhaDemo).join(''):'<div class="vazio">Nenhuma demonstração ativa. Use “Criar demonstração” no sistema que quer mostrar.</div>'}</div>
    ${velhas.length?`<h2>Encerradas</h2><div class="demos">${velhas.map(linhaDemo).join('')}</div>`:''}
    <p class="fim">LegislaGov · este site não é governamental.</p>
  </main>`;
  ligarTema();
  $('#sairBt').onclick=sair;$('#senhaBt').onclick=trocarSenha;
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>novaDemo(b.dataset.demo));
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>mostrarDemo(P.demos.find(d=>d.id===b.dataset.ver)));
  document.querySelectorAll('[data-fim]').forEach(b=>b.onclick=()=>encerrar(b.dataset.fim));
}
function linhaDemo(d){
  const fim=d.encerrada?'encerrada em '+quando(d.encerrada):d.ativa?(d.ateSair?'até você sair (no máximo '+quando(d.expira)+')':'termina '+quando(d.expira)):'terminou '+quando(d.expira);
  return `<div class="demo-l"><div><b>${esc(d.cliente||'Sem nome')}</b><span class="st ${d.ativa?'on':'off'}">${d.ativa?'Ativa':'Encerrada'}</span><small>${esc(nomeSist(d.sistema))} · ${fim}</small><small>${d.acessos?d.acessos+' acesso(s), último em '+quando(d.ultimo):'Ainda não foi aberta'} · criada por ${esc(d.criadoPor)}</small></div>
    <div class="acoes">${d.ativa?`<button class="btn" data-ver="${esc(d.id)}">Link e QR code</button><button class="btn perigo" data-fim="${esc(d.id)}">Encerrar agora</button>`:''}</div></div>`;
}
function modal(html,montar){fechar();const f=document.createElement('div');f.className='fundo';f.id='modal';f.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;f.addEventListener('click',e=>{if(e.target===f)fechar()});document.body.appendChild(f);montar&&montar(f);setTimeout(()=>f.querySelector('input,button')?.focus(),30)}
function fechar(){$('#modal')?.remove()}
addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

function novaDemo(sistema){
  let horas=24, ateSair=false;
  modal(`<h2>Demonstração · ${esc(nomeSist(sistema))}</h2>
    <p class="dica">O cliente abre pelo link ou QR code, com todas as funções e dados de exemplo. No fim do prazo a tela fica "Demonstração encerrada" e os dados saem do aparelho dele.</p>
    <label>Para quem é (opcional)<input id="dc" maxlength="60" placeholder="Ex.: Horta do Sr. Antônio"></label>
    <div><b style="font-size:14px">Por quanto tempo</b><div class="chips" role="group" aria-label="Prazo" style="margin-top:6px">${P.prazos.map(p=>`<button type="button" class="chip" data-h="${p.horas}" aria-pressed="${p.horas===24}">${esc(p.nome)}</button>`).join('')}<button type="button" class="chip" data-h="sair" aria-pressed="false">Até eu sair da minha conta</button></div></div>
    <p class="msg" id="dm"></p>
    <div class="rod"><button class="btn" id="cn">Cancelar</button><button class="btn pri" id="ok">Criar demonstração</button></div>`,f=>{
    f.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{f.querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');ateSair=b.dataset.h==='sair';horas=ateSair?24:+b.dataset.h});
    $('#cn',f).onclick=fechar;
    $('#ok',f).onclick=async()=>{const bt=$('#ok',f);bt.disabled=true;bt.textContent='Criando…';
      try{const r=await api('demos',{metodo:'POST',corpo:{sistema,cliente:$('#dc',f).value.trim(),horas,ateSair}});await tela();mostrarDemo(r.demo)}
      catch(e){if(e.message!=='sessao'){$('#dm',f).textContent=e.message;bt.disabled=false;bt.textContent='Criar demonstração'}}};
  });
}
function mostrarDemo(d){
  if(!d)return;const l=linkDemo(d);
  const txt=`Olá${d.cliente?' '+d.cliente:''}! Esta é a demonstração do ${nomeSist(d.sistema)}. Abra no celular: ${l} (vale até ${quando(d.expira)}).`;
  modal(`<h2>Demonstração pronta</h2>
    <p class="dica">${esc(d.cliente||'Sem nome')} · ${d.ateSair?'vale até você sair da sua conta (no máximo '+quando(d.expira)+')':'vale até '+quando(d.expira)}</p>
    <div class="qr" id="qr" aria-label="QR code da demonstração"></div>
    <p class="dica" style="text-align:center">Peça para o cliente apontar a câmera do celular para o QR code.</p>
    <div class="link"><input id="lk" readonly value="${esc(l)}" aria-label="Link da demonstração"><button class="btn" id="cp">Copiar</button></div>
    <div class="rod"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>${navigator.share?'<button class="btn" id="sh">Compartilhar</button>':''}<a class="btn" href="${esc(l)}" target="_blank" rel="noopener">Abrir aqui</a><button class="btn pri" id="fx">Pronto</button></div>`,f=>{
    $('#fx',f).onclick=fechar;
    $('#cp',f).onclick=async()=>{try{await navigator.clipboard.writeText(l)}catch(e){$('#lk',f).select();document.execCommand('copy')}$('#cp',f).textContent='Copiado'};
    const sh=$('#sh',f);if(sh)sh.onclick=()=>navigator.share({title:'Demonstração LegislaGov',text:txt}).catch(()=>{});
    const desenhar=()=>{if(window.LGQR){$('#qr',f).innerHTML=LGQR.svg(l,200)}else setTimeout(desenhar,150)};desenhar();
  });
}
function encerrar(id){
  modal(`<h2>Encerrar a demonstração?</h2><p class="dica">Quem estiver usando vê "Demonstração encerrada" na hora e os dados saem do aparelho.</p><div class="rod"><button class="btn" id="cn">Voltar</button><button class="btn pri" id="ok">Encerrar agora</button></div>`,f=>{
    $('#cn',f).onclick=fechar;$('#ok',f).onclick=async()=>{try{await api('demos/encerrar',{metodo:'POST',corpo:{id}});fechar();tela()}catch(e){}}});
}
async function sair(){
  const ativas=P?P.demos.filter(d=>d.ativa&&d.ateSair&&d.criadoPor===P.sessao.usuario).length:0;
  const fim=async()=>{try{await api('sair',{metodo:'POST'})}catch(e){}TOKEN='';try{localStorage.removeItem('lgc_token')}catch(e){}P=null;MSG='';fechar();tela()};
  if(!ativas){fim();return}
  modal(`<h2>Sair da Central?</h2><p class="dica">${ativas} demonstração(ões) "até eu sair" vão ser encerradas agora.</p><div class="rod"><button class="btn" id="cn">Ficar</button><button class="btn pri" id="ok">Sair e encerrar</button></div>`,f=>{$('#cn',f).onclick=fechar;$('#ok',f).onclick=fim});
}
function trocarSenha(){
  modal(`<h2>Trocar minha senha</h2><label>Senha atual<input type="password" id="sa" autocomplete="current-password"></label><label>Nova senha (mínimo 8)<input type="password" id="sn" autocomplete="new-password"></label><label>Repita a nova senha<input type="password" id="sn2" autocomplete="new-password"></label><p class="msg" id="sm"></p><div class="rod"><button class="btn" id="cn">Cancelar</button><button class="btn pri" id="ok">Trocar</button></div>`,f=>{
    $('#cn',f).onclick=fechar;
    $('#ok',f).onclick=async()=>{if($('#sn',f).value!==$('#sn2',f).value){$('#sm',f).textContent='As duas senhas novas não são iguais.';return}
      try{await api('minha-senha',{metodo:'POST',corpo:{atual:$('#sa',f).value,nova:$('#sn',f).value}});fechar();alertar('Senha trocada.')}catch(e){if(e.message!=='sessao')$('#sm',f).textContent=e.message}};
  });
}
function alertar(t){modal(`<h2>${esc(t)}</h2><div class="rod"><button class="btn pri" id="ok">Ok</button></div>`,f=>$('#ok',f).onclick=fechar)}
function seletorTema(){const t=document.documentElement.dataset.tema;return `<div class="tema" role="group" aria-label="Aparência"><button type="button" data-tema="claro" aria-pressed="${t==='claro'}">Claro</button><button type="button" data-tema="escuro" aria-pressed="${t==='escuro'}">Escuro</button></div>`}
function ligarTema(){document.querySelectorAll('[data-tema]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.tema=b.dataset.tema;try{localStorage.setItem('lgc_tema',b.dataset.tema)}catch(e){}document.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tema===b.dataset.tema));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=b.dataset.tema==='escuro'?'#06080d':'#f4f6f9'})}
function telaEntrar(){
  $('#app').innerHTML=`<div class="entrar">${seletorTema()}<form id="fe" autocomplete="on"><span class="marca"><img src="em-camara.png" alt=""><span>Legisla<b>Gov</b> Central</span></span>
    <h1>Área restrita</h1><p class="dica">No primeiro acesso, use o mesmo usuário e senha do painel da Câmara.</p>
    <label>Usuário<input id="eu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<input id="es" type="password" autocomplete="current-password" required></label>
    <p class="msg" id="em" role="alert">${esc(MSG)}</p>
    <button class="btn pri" id="eb" type="submit">Entrar</button>
    <p class="dica" style="text-align:center">Este site não é governamental.</p></form></div>`;
  ligarTema();
  $('#fe').onsubmit=async e=>{e.preventDefault();const bt=$('#eb');bt.disabled=true;
    try{const r=await api('entrar',{metodo:'POST',corpo:{usuario:$('#eu').value.trim(),senha:$('#es').value}});TOKEN=r.token;try{localStorage.setItem('lgc_token',TOKEN)}catch(x){}MSG='';tela()}
    catch(x){$('#em').textContent=x.message;bt.disabled=false}};
}
tela();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
