<style>

a{color:inherit}

a.marca{border-radius:10px;padding:2px 6px 2px 2px;margin-left:-2px}a.marca:hover{background:var(--chip)}a.marca:focus-visible{outline:3px solid color-mix(in srgb,var(--acento) 55%,transparent);outline-offset:2px}

.link{display:flex;gap:6px}.link input{flex:1;font-size:14px}

.rcab{display:flex;gap:16px;align-items:flex-start}.rcab .selo{background:color-mix(in srgb,#3fae4f 12%,var(--papel));border-color:color-mix(in srgb,#3fae4f 25%,var(--linha))}

.st.susp{background:color-mix(in srgb,var(--erro) 14%,var(--papel));color:var(--erro)}
.usus[hidden]{display:none}.bloq-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bloq-form input{flex:1 1 180px}main>h2+.horta,main>h2+.vazio{margin-top:0}.usus{margin-top:14px;padding-top:14px;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.abas{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 6px;border-bottom:1px solid var(--linha)}

.tile small{display:block;color:var(--sub);font-size:12.5px}.tile b{display:block;font-size:21px;color:var(--forte);letter-spacing:-.02em;margin-top:2px}.tile span{font-size:12.5px;color:var(--sub)}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0;background:var(--ok)}
.pt.aviso{background:#d9a400}.pt.critico{background:var(--erro)}.pt.info{background:var(--acento)}
.st.aviso{background:color-mix(in srgb,#d9a400 18%,var(--papel));color:var(--demo-ink)}.st.critico{background:color-mix(in srgb,var(--erro) 14%,var(--papel));color:var(--erro)}.st.info{background:color-mix(in srgb,var(--acento) 14%,var(--papel));color:var(--acento)}
.av{display:flex;flex-direction:column;gap:10px}.av .horta{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}.av .horta p{margin:2px 0 0;color:var(--sub);font-size:13.5px;grid-column:1}
.msg-c{border-left:4px solid var(--acento)}.msg-c.aviso{border-left-color:#d9a400}.msg-c.critico{border-left-color:var(--erro)}.msg-c.novo{box-shadow:0 0 0 2px color-mix(in srgb,var(--acento) 35%,transparent)}

.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sisblk{margin-top:26px}.sisblk>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}.sisblk>header img{height:30px}.sisblk>header h3{margin:0;font-size:17px;color:var(--forte)}.sisblk>header small{color:var(--sub);font-size:13px}
.cli{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sombra)}

.cli-c{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}.cli-c b{font-size:16px;color:var(--forte)}.cli-c small{display:block;color:var(--sub);font-size:13px}

.sw[aria-checked=false]{color:var(--erro)}.sw[aria-checked=false] i{background:#d92d20}.sw[aria-checked=false] i::after{left:3px}
.sw.p{min-height:34px;font-size:12.5px;padding:4px 10px 4px 4px}.sw.p i{width:38px;height:22px}.sw.p i::after{width:16px;height:16px;left:19px}.sw.p[aria-checked=false] i::after{left:3px}

<body>
<div id="app"><p style="padding:30px;text-align:center;color:#5d6b7b">Carregando…</p></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN='';try{TOKEN=localStorage.getItem('lgc_token')||''}catch(e){}
let P=null, MSG='';
async function api(acao,{metodo='GET',corpo=null}={}){
  const r=await fetch('/api/central/'+acao,{method:metodo,cache:'no-store',headers:Object.assign({'Content-Type':'application/json','X-LG':'1'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:corpo?JSON.stringify(corpo):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&acao!=='entrar'){TOKEN='';try{localStorage.removeItem('lgc_token')}catch(e){}P=null;MSG='Sua sessão terminou. Entre de novo.';tela();throw new Error('sessao')}
  if(!r.ok){const e=new Error(d.erro||('Erro '+r.status));e.status=r.status;throw e}
  return d;
}
const quando=t=>{const d=new Date(t*1000);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
function linkDemo(d){
  const base=location.hostname==='central.legislagov.com.br'?'https://rural.legislagov.com.br/':location.origin+'/rural/';
  return base+'?demo='+d.codigo;
}
function nomeSist(id){return (P&&P.sistemas.find(s=>s.id===id)||{nome:id}).nome}

async function tela(){
  if(!TOKEN){telaEntrar();return}
  try{P=await api('eu')}catch(e){if(e.message!=='sessao'){$('#app').innerHTML=`<div class="entrar"><div class="vazio">Sem conexão com o servidor. <button class="btn" onclick="tela()">Tentar de novo</button></div></div>`}return}
  const s=P.sessao, nome=(s.nome||'').split(' ')[0];
  const ativas=P.demos.filter(d=>d.ativa), velhas=P.demos.filter(d=>!d.ativa).slice(0,15);
  const seta='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  $('#app').innerHTML=`<header class="topo"><div class="topo-in"><a class="marca" href="./" id="inicioBt" title="Voltar para a Central"><img src="em-camara.png" alt=""><span>Legisla<b>Gov</b> Central<small>Área restrita</small></span></a><div class="esp"></div>
    <span class="quem">${esc(s.nome)}</span>${seletorTema()}<button class="tbtn" id="senhaBt">Senha</button><button class="tbtn" id="sairBt">Sair</button></div></header>
  <main>
    <h1>Olá, ${esc(nome)}.</h1>
    <p class="sub">Escolha o sistema. Cada um abre em outra aba. Para mostrar a um cliente, use “Criar demonstração”: tem prazo e para de funcionar sozinha.</p>
    ${faixaAdmin()}
    <div class="sist">${P.sistemas.map(x=>`<section class="card" style="--cor:${esc(x.cor)}" aria-labelledby="t-${esc(x.id)}">
      <div class="cab"><div class="selo"><img src="${esc(x.icone)}" alt=""></div><div><h3 id="t-${esc(x.id)}">${esc(x.nome)}</h3><p>${esc(x.desc)}</p></div></div>
      ${x.id==='rural'?`<button class="btn" data-clientes="rural">Clientes, senhas e acesso</button>`:''}
      ${x.demo?`<button class="btn demo" data-demo="${esc(x.id)}">Criar demonstração</button>`:''}
      ${x.qr?`<button class="btn" data-qr="${esc(x.qr[1])}" data-qrnome="${esc(x.qr[0])}" data-qrsis="${esc(x.nome)}">QR code do ${esc(x.qr[0].replace(/^App do /,'app do '))}</button>`:''}
      <a class="abrir" href="${esc(x.abrir[1])}" target="_blank" rel="noopener"><span>${esc(x.abrir[0])}</span>${seta}</a>

      const sn=u.querySelector('[data-sn]');if(sn)sn.onclick=()=>senhaRest(us);const ex=u.querySelector('[data-ex]');if(ex)ex.onclick=()=>excluirRest(us)});
    const nu=el.querySelector('[data-nu]');if(nu)nu.onclick=()=>novoRest(x);const ed=el.querySelector('[data-ed]');if(ed)ed.onclick=()=>editarCliRest(x)});
}
function cartaoCliente(k,x){
  const on=!x.bloqueado,us=x.usuarios||[];
  const sub=k==='restaurante'?`Responsável: ${esc(x.responsavel||'—')} · ${us.length} usuário(s)`:`${us.length} usuário(s)`;
  return `<div class="cli ${on?'':'off'}" data-cli="${k}|${esc(x.id)}"><div class="cli-c"><div><b>${esc(x.nome)}</b><small>${sub}${x.bloqueado&&x.desde?' · cortado em '+quando(x.desde):''}${x.motivo?' · '+esc(x.motivo):''}</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${k==='restaurante'?'<button class="btn" data-ed>Editar</button><button class="btn" data-nu>+ Usuário</button>':''}${chave(on,on?'Cliente ativo':'Cliente bloqueado')}</div></div>
    ${us.length?`<div class="usgrid">${us.map(u=>{const uon=!u.bloqueado;return `<div class="usr ${uon&&on?'':'off'}" data-u="${esc(u.id)}"><div><b>${esc(u.nome)}</b><small>${esc(u.cargo||'')}${u.usuario?' · '+esc(u.usuario):''}</small>${u.ativo===false?'<small style="color:var(--erro)">desativado pelo administrador da Câmara</small>':''}${u.bloqueado&&u.motivo?`<small>${esc(u.motivo)}</small>`:''}</div>
      <div class="ln">${chave(uon,null,'p')}${k==='restaurante'?'<span><button class="lkbtn" data-sn>Senha nova</button><button class="lkbtn" data-ex style="color:var(--erro)">Excluir</button></span>':''}</div></div>`}).join('')}</div>`:k==='restaurante'?'<p class="dica" style="margin-top:10px">Nenhum usuário. Toque em “+ Usuário” para criar o acesso da dona do restaurante.</p>':''}</div>`;
}
function trocarAcesso(k,x,u){
  const alvo=u||x,ligar=!!alvo.bloqueado;
  const enviar=async motivo=>{try{
      if(k==='rural'&&!u)await api('rural/suspender',{metodo:'POST',corpo:{e:x.id,suspender:!ligar,motivo}});
      else await api('admin/acesso',{metodo:'POST',corpo:{sistema:k,cliente:x.id,usuario:u?u.id:'',nome:u?u.nome:'',bloquear:!ligar,motivo}});
      fechar();carregarSistemas()}catch(e){if(e.message!=='sessao')alertar(e.message)}};
  if(ligar){enviar('');return}
  modal(`<h2>Cortar o acesso de ${esc(alvo.nome)}?</h2><p class="dica">${u?'Só esta pessoa':'Todos os usuários de '+esc(x.nome)} perde${u?'':'m'} o acesso na hora e passa${u?'':'m'} a ver “Acesso suspenso”. Os dados ficam guardados; para voltar, é só ligar de novo.</p>
    <label>Motivo (só vocês veem)<input id="mt" maxlength="200" placeholder="Ex.: mensalidade de dezembro em aberto"></label>
    <div class="rod"><button class="btn" id="cn">Voltar</button><button class="btn pri" id="ok" style="background:var(--erro);border-color:var(--erro);color:#fff">Cortar o acesso</button></div>`,f=>{
    $('#cn',f).onclick=fechar;$('#ok',f).onclick=()=>enviar($('#mt',f).value)});
}
function novoRest(x){
  const s=gerar();
  modal(`<h2>Novo usuário · ${esc(x.nome)}</h2><p class="dica">É o acesso de quem comprou o sistema. Ela entra no caixa com este usuário e senha, uma vez em cada aparelho (no celular do garçom também; depois o garçom escolhe o nome e o PIN).</p>
    <label>Nome<input id="nn" maxlength="60" placeholder="Ex.: Marina"></label><label>Usuário<input id="nu" autocapitalize="none" spellcheck="false" placeholder="Ex.: marina"></label>
    <label>Senha<input id="ns" value="${s}" style="font-family:ui-monospace,monospace"></label><p class="msg" id="nm"></p>
    <div class="rod"><button class="btn" id="cn">Cancelar</button><button class="btn pri" id="ok">Criar usuário</button></div>`,f=>{
    $('#cn',f).onclick=fechar;
    $('#ok',f).onclick=async()=>{const corpo={cliente:x.id,nome:$('#nn',f).value.trim(),usuario:$('#nu',f).value.trim(),senha:$('#ns',f).value.trim()};
      try{await api('admin/rest/usuario',{metodo:'POST',corpo});mostrarAcessoRest(corpo.nome,corpo.usuario,corpo.senha);carregarSistemas()}catch(e){if(e.message!=='sessao')$('#nm',f).textContent=e.message}};
  });
}
function mostrarAcessoRest(nome,login,senha){
  const link='https://d1xi1g7etepsye.cloudfront.net/';
  modal(`<h2>Acesso criado</h2><p class="dica">Passe para ${esc(nome)}:</p><label>Endereço<input value="${link}" readonly></label><label>Usuário<input value="${esc(login)}" readonly></label><label>Senha<input value="${esc(senha)}" readonly style="font-family:ui-monospace,monospace"></label>
    <div class="rod"><button class="btn" id="cp">Copiar tudo</button><button class="btn pri" id="fx">Pronto</button></div>`,g=>{$('#fx',g).onclick=fechar;$('#cp',g).onclick=async()=>{try{await navigator.clipboard.writeText(`LegislaGov Restaurante\n${link}\nUsuário: ${login}\nSenha: ${senha}`);$('#cp',g).textContent='Copiado'}catch(e){}}});
}
function senhaRest(u){
  const s=gerar();
  modal(`<h2>Senha nova · ${esc(u.nome)}</h2><p class="dica">A pessoa sai de todos os aparelhos e entra de novo com a senha nova.</p><label>Senha nova<input id="sn" value="${s}" style="font-family:ui-monospace,monospace"></label><p class="msg" id="sm"></p>
    <div class="rod"><button class="btn" id="cn">Cancelar</button><button class="btn pri" id="ok">Salvar senha nova</button></div>`,f=>{$('#cn',f).onclick=fechar;
    $('#ok',f).onclick=async()=>{const nova=$('#sn',f).value.trim();try{await api('admin/rest/senha',{metodo:'POST',corpo:{id:u.id,senha:nova}});mostrarAcessoRest(u.nome,u.usuario,nova);carregarSistemas()}catch(e){if(e.message!=='sessao')$('#sm',f).textContent=e.message}}});
}
function excluirRest(u){
  modal(`<h2>Excluir o usuário ${esc(u.nome)}?</h2><p class="dica">A pessoa sai de todos os aparelhos e o usuário deixa de existir. Os dados do restaurante continuam guardados. Para só pausar, prefira o botão verde/vermelho.</p><div class="rod"><button class="btn" id="cn">Voltar</button><button class="btn pri" id="ok" style="background:var(--erro);border-color:var(--erro);color:#fff">Excluir</button></div>`,f=>{
    $('#cn',f).onclick=fechar;$('#ok',f).onclick=async()=>{try{await api('admin/rest/excluir',{metodo:'POST',corpo:{id:u.id}});fechar();carregarSistemas()}catch(e){}}});
}
function editarCliRest(x){
  modal(`<h2>Cliente do restaurante</h2><label>Nome do restaurante<input id="cn1" maxlength="80" value="${esc(x.nome)}"></label><label>Responsável (quem comprou)<input id="cr1" maxlength="80" value="${esc(x.responsavel)}"></label><label>Observação<input id="co1" maxlength="200" value="${esc(x.obs)}"></label><p class="msg" id="ce1"></p>
    <div class="rod"><button class="btn" id="cn">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,f=>{$('#cn',f).onclick=fechar;
    $('#ok',f).onclick=async()=>{try{await api('admin/cliente',{metodo:'POST',corpo:{sistema:'restaurante',id:x.id,nome:$('#cn1',f).value,responsavel:$('#cr1',f).value,obs:$('#co1',f).value}});fechar();carregarSistemas()}catch(e){if(e.message!=='sessao')$('#ce1',f).textContent=e.message}}});
}
/* ===================== Segurança: endereços bloqueados ===================== */
async function telaSeguranca(){
  let r;try{r=await api('seguranca/ips')}catch(e){return}
  const voltar='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
  const ativos=r.ips.filter(x=>x.ativo),antigos=r.ips.filter(x=>!x.ativo).slice(0,30);
  const linha=x=>`<tr><td><code>${esc(x.ip)}</code></td><td>${esc(x.motivo)}${x.vezes>1?` <small class="dica">(${x.vezes}ª vez)</small>`:''}</td><td>${x.sempre?'<b>para sempre</b>':x.ativo?'até '+quando(x.ate):'terminou '+quando(x.ate)}</td><td>${x.por==='sistema'?'automático':esc(x.por)}</td>
    <td class="dir">${x.ativo?`<button class="btn" data-des="${esc(x.ip)}">Desbloquear</button>`:''}${x.sempre?'':`<button class="btn perigo" data-sem="${esc(x.ip)}">Para sempre</button>`}</td></tr>`;
  $('main').innerHTML=`<button class="tbtn" id="volta" style="display:inline-flex;align-items:center;gap:4px;margin-bottom:18px">${voltar}Sistemas</button>
    <h1>Endereços bloqueados</h1><p class="sub">Vale para todos os sistemas (Câmara, Rural, E-mails, sites). A Central nunca é bloqueada, para vocês sempre conseguirem desbloquear. Você está usando agora: <b>${esc(r.voce)}</b>.</p>
    <section class="horta" style="margin-top:20px"><b>Bloquear um endereço</b><div class="bloq-form"><input id="ipn" placeholder="Ex.: 200.100.50.25" inputmode="decimal"><input id="ipm" placeholder="Motivo (opcional)"><button class="btn" id="b24">Bloquear 24 horas</button><button class="btn perigo" id="bsp">Bloquear para sempre</button></div><p class="msg" id="ipe"></p></section>
    <h2>Bloqueados agora (${ativos.length})</h2>
    ${ativos.length?`<div class="horta"><table class="tab"><thead><tr><th>Endereço</th><th>Motivo</th><th>Situação</th><th>Por</th><th></th></tr></thead><tbody>${ativos.map(linha).join('')}</tbody></table></div>`:'<div class="vazio">Nenhum endereço bloqueado agora.</div>'}
    ${antigos.length?`<h2>Bloqueios que já terminaram</h2><div class="horta"><table class="tab"><thead><tr><th>Endereço</th><th>Motivo</th><th>Situação</th><th>Por</th><th></th></tr></thead><tbody>${antigos.map(linha).join('')}</tbody></table></div>`:''}`;
  $('#volta').onclick=()=>tela();
  const acao=async(ip,a)=>{try{await api('seguranca/ip',{metodo:'POST',corpo:{ip,acao:a,motivo:$('#ipm')?.value||'',horas:24}});telaSeguranca()}catch(e){if(e.message!=='sessao')$('#ipe').textContent=e.message}};
  document.querySelectorAll('[data-des]').forEach(b=>b.onclick=()=>acao(b.dataset.des,'desbloquear'));
  document.querySelectorAll('[data-sem]').forEach(b=>b.onclick=()=>acao(b.dataset.sem,'sempre'));
  $('#b24').onclick=()=>acao($('#ipn').value.trim(),'bloquear');$('#bsp').onclick=()=>acao($('#ipn').value.trim(),'sempre');
  scrollTo(0,0);
}
function seletorTema(){const t=document.documentElement.dataset.tema;return `<div class="tema" role="group" aria-label="Aparência"><button type="button" data-tema="claro" aria-pressed="${t==='claro'}">Claro</button><button type="button" data-tema="escuro" aria-pressed="${t==='escuro'}">Escuro</button></div>`}
function ligarTema(){document.querySelectorAll('[data-tema]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.tema=b.dataset.tema;try{localStorage.setItem('lgc_tema',b.dataset.tema)}catch(e){}document.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tema===b.dataset.tema));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=b.dataset.tema==='escuro'?'#06080d':'#f4f6f9'})}
function telaEntrar(){
  $('#app').innerHTML=`<div class="entrar">${seletorTema()}<form id="fe" autocomplete="on"><span class="marca"><img src="em-camara.png" alt=""><span>Legisla<b>Gov</b> Central</span></span>
    <h1>Área restrita</h1><p class="dica">No primeiro acesso, use o mesmo usuário e senha do painel da Câmara.</p>
    <label>Usuário<input id="eu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<input id="es" type="password" autocomplete="current-password" required></label>
    <p class="msg" id="em" role="alert">${esc(MSG)}</p>
    <button class="btn pri" id="eb" type="submit">Entrar</button>
    <p class="dica" style="text-align:center">Este site não é governamental.</p></form></div>`;
  ligarTema();
  $('#fe').onsubmit=async e=>{e.preventDefault();const bt=$('#eb');bt.disabled=true;
    try{const r=await api('entrar',{metodo:'POST',corpo:{usuario:$('#eu').value.trim(),senha:$('#es').value}});TOKEN=r.token;try{localStorage.setItem('lgc_token',TOKEN)}catch(x){}MSG='';tela()}
    catch(x){$('#em').textContent=x.message;bt.disabled=false}};
}
tela();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
