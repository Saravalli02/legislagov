<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="carregando.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de e-mails · LegislaGov</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LG E-mail">
<script>(function(){var b=location.pathname.replace(/[^/]*$/,'');var l=document.createElement('link');l.rel='manifest';l.href='/api/email/manifest.json?b='+encodeURIComponent(b);document.head.appendChild(l)})();</script>
<style>
:root{--azul:#1f4e79;--azul-esc:#173b5c;--azul-cl:#e8eff6;--fundo:#f4f6f8;--card:#fff;--txt:#1f2933;--sub:#5b6670;--borda:#dde2e7;--linha:#eef1f4;
--verde:#2f8a4b;--verde-cl:#e8f5ec;--verm:#c53030;--verm-cl:#fdecec;--amar:#975a16;--amar-cl:#fff7e6;--raio:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
.cx{max-width:1180px;margin:0 auto;padding:0 16px}
header.topo{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:20}
header.topo .cx{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:env(safe-area-inset-top)}
.marca{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;white-space:nowrap}
.marca img{width:34px;height:34px;border-radius:9px}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.topo .esp{flex:1}
.topo select{max-width:260px;padding:8px 10px;border:1px solid var(--borda);border-radius:10px;background:#fff}
.menu-bt{border:1px solid var(--borda);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.menu{position:absolute;right:16px;top:58px;background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:0 12px 30px rgba(31,41,51,.12);min-width:230px;padding:6px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--linha)}
.menu .quem{padding:8px 12px 10px;border-bottom:1px solid var(--linha);margin-bottom:4px;font-size:14px;color:var(--sub)}
.menu .quem b{display:block;color:var(--txt)}
main{padding:22px 0 calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
.dom{color:var(--sub);margin:0 0 16px}
.faixa{display:flex;gap:10px;align-items:flex-start;border-radius:var(--raio);padding:12px 14px;margin:0 0 16px;font-size:14.5px}
.faixa.prep{background:var(--amar-cl);border:1px solid #ecd9a4;color:#5c3d0a}
.faixa.ok{background:var(--verde-cl);border:1px solid #bfe2c9;color:#1f5d33}
.ferr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;max-width:560px;margin:0 auto 10px}
.ferr input,.ferr select{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:#fff}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;max-width:640px;margin:0 auto 18px;padding:8px 10px;border:1px solid var(--borda);border-radius:10px;background:#fff;font-size:14.5px}
.links button,.links a{border:0;background:none;color:var(--sub);cursor:pointer;padding:2px 0;text-decoration:none}
.links button:hover,.links a:hover{color:var(--azul);text-decoration:underline}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.barra .tot{flex:1;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer;text-decoration:none;min-height:42px}
.btn.pri{background:var(--azul);color:#fff}.btn.pri:hover{background:var(--azul-esc)}
.btn.sec{background:#fff;border-color:var(--borda);color:var(--txt)}.btn.sec:hover{background:var(--linha)}
.btn.perigo{background:var(--verm);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,.acao:focus-visible,.menu button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9cc0e3;outline-offset:2px}
.tabela{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden}
.tabela table{width:100%;border-collapse:collapse}
.tabela th{background:#e9edf1;text-align:left;font-size:13px;letter-spacing:.02em;color:#3e4a55;padding:12px 14px;font-weight:700}
.tabela td{padding:12px 14px;border-top:1px solid var(--linha);vertical-align:middle}
.tabela tr:nth-child(even) td{background:#fafbfc}
.em b{display:block;font-weight:500;word-break:break-all}.em small{color:var(--sub)}
.uso{display:flex;align-items:center;gap:12px;min-width:220px}
.medidor{flex:0 0 120px;height:10px;border:1px solid #9aa5af;border-radius:6px;overflow:hidden;background:#fff}
.medidor i{display:block;height:100%;background:var(--verde)}
.medidor i.alto{background:#d69e2e}.medidor i.cheio{background:var(--verm)}
.uso span{color:var(--sub);font-size:14.5px;white-space:nowrap}
.acoes{display:flex;gap:6px}
.acao{width:38px;height:38px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.acao svg{width:18px;height:18px}
.acao.ed{background:#2f9e44}.acao.av{background:#2563a8}.acao.ex{background:#c92a2a}
.acao:hover{filter:brightness(.92)}
.vazio{text-align:center;color:var(--sub);padding:40px 16px}
/* celular: linhas viram cartões */
@media (max-width:760px){
  .topo .orgsel{display:none}
  .tabela{background:none;border:0}
  .tabela thead{display:none}
  .tabela table,.tabela tbody,.tabela tr,.tabela td{display:block;width:100%}
  .tabela tr{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:10px;padding:4px 0}
  .tabela tr:nth-child(even) td{background:none}
  .tabela td{border:0;padding:8px 14px}
  .uso{min-width:0}.medidor{flex:1 1 auto}
  .acao{width:44px;height:44px}
  .ferr{grid-template-columns:1fr}
  .barra .tot{flex-basis:100%}.barra .btn{flex:1}
  h1{font-size:21px}
}
/* janelas */
#fundoModal{position:fixed;inset:0;background:rgba(17,24,32,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){#fundoModal{align-items:center;padding:20px}.modal{border-radius:18px}}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .alvo{color:var(--sub);margin:0 0 14px;word-break:break-all}
.modal label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:11px 12px;border:1px solid #cdd3da;border-radius:10px;background:#fff}
.modal textarea{min-height:120px;resize:vertical}
.modal .rodape{display:flex;gap:10px;margin-top:18px}
.modal .rodape .btn{flex:1}
.opcoes{display:flex;flex-direction:column;gap:8px}
.opcao{text-decoration:none;color:inherit;display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--borda);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer}
.opcao:hover{border-color:var(--azul);background:#f8fbfe}
.opcao .ic{font-size:22px;width:28px;text-align:center}.opcao b{display:block}.opcao small{color:var(--sub)}
.dica{font-size:13.5px;color:var(--sub);margin-top:6px}
.erro{color:var(--verm);font-size:14px;margin-top:8px;min-height:1px}
.ok-msg{background:var(--verde-cl);color:#1f5d33;border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}
.prep-msg{background:var(--amar-cl);color:#5c3d0a;border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}
.sufixo{display:flex;align-items:center;border:1px solid #cdd3da;border-radius:10px;overflow:hidden;background:#fff}
.sufixo input{border:0!important;border-radius:0!important;min-width:0}
.sufixo span{padding:0 12px;color:var(--sub);white-space:nowrap;background:var(--linha);align-self:stretch;display:flex;align-items:center}
.linkbox{display:flex;gap:8px}.linkbox input{font-size:13px}
.hist{list-style:none;margin:0;padding:0}.hist li{padding:10px 0;border-top:1px solid var(--linha);font-size:14.5px}.hist li:first-child{border-top:0}
.hist time{display:block;color:var(--sub);font-size:12.5px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--linha);color:var(--sub)}
.tag.ok{background:var(--verde-cl);color:#1f5d33}.tag.prep{background:var(--amar-cl);color:var(--amar)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2933;color:#fff;padding:11px 16px;border-radius:10px;font-size:14.5px;z-index:60;max-width:92vw;display:none}
/* entrada */
.entrada{max-width:420px;margin:0 auto;padding:36px 0}
.entrada .logo{text-align:center;margin-bottom:18px}.entrada .logo img{width:64px;height:64px;border-radius:16px}
.entrada h1{text-align:center}.entrada p.sub{text-align:center;color:var(--sub);margin:4px 0 18px}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:18px}
.cartao label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}.cartao label:first-child{margin-top:0}
.cartao input{width:100%;padding:12px;border:1px solid #cdd3da;border-radius:10px;font-size:17px}
.cartao .btn{width:100%;margin-top:16px}
.baixar{display:flex;gap:12px;align-items:center;margin-top:14px}
.baixar img{width:44px;height:44px;border-radius:11px}.baixar div{flex:1}.baixar small{display:block;color:var(--sub);font-size:13px}
.rod{text-align:center;color:var(--sub);font-size:13px;margin-top:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===================== base ===================== */
const API='/api/email/', BASE=location.origin+location.pathname.replace(/[^/]*$/,'');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN='';try{TOKEN=localStorage.getItem('lge_token')||''}catch(e){}
const E={sess:null,orgs:[],org:'',caixas:[],busca:'',ordem:'email',menu:false,entrada:null,provedores:[]};
try{E.org=localStorage.getItem('lge_org')||''}catch(e){}
function toast(t,ms){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',ms||3200)}
async function api(acao,{metodo='GET',corpo=null,q=''}={}){
  const r=await fetch(API+acao+(q?'?'+q:''),{method:metodo,cache:'no-store',headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:corpo?JSON.stringify(corpo):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&TOKEN&&!['entrar','primeiro'].includes(acao)){sairLocal();toast('Sua sessão terminou. Entre de novo.');throw new Error('sessao')}
  if(!r.ok){const e=new Error(d.erro||('Erro '+r.status));e.status=r.status;throw e}
  return d;
}
const fmtTam=mb=>mb>=1024?(mb/1024).toFixed(2).replace('.',',')+' GB':mb>=1?mb.toFixed(2).replace('.',',')+' MB':(mb*1024).toFixed(2).replace('.',',')+' KB';
const dataHora=t=>new Date(t*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function gerarSenha(){const a='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',b='!@#$%&*';const r=crypto.getRandomValues(new Uint32Array(14));let s='';for(let i=0;i<12;i++)s+=a[r[i]%a.length];return s+b[r[12]%b.length]+(r[13]%10)}
const ICO={ed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  av:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>',
  ex:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'};

/* ===================== janelas ===================== */
function modal(html,ligar){fechar();const f=document.createElement('div');f.id='fundoModal';f.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  f.addEventListener('click',e=>{if(e.target===f)fechar()});document.body.appendChild(f);document.body.style.overflow='hidden';
  const m=f.querySelector('.modal');ligar&&ligar(m);const p=m.querySelector('input,textarea,select');if(p&&innerWidth>640)setTimeout(()=>p.focus(),40);return m}
function fechar(){const f=$('#fundoModal');if(f)f.remove();document.body.style.overflow=''}
addEventListener('keydown',e=>{if(e.key==='Escape'){fechar();if(E.menu){E.menu=false;render()}}});
function resultado(m,r){const box=document.createElement('div');box.className=r.aplicado===false||r.enviado===false?'prep-msg':'ok-msg';box.textContent=r.mensagem;m.querySelector('.rodape').before(box)}

/* ===================== entrada ===================== */
let PEDIDO=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();PEDIDO=e;if(!E.sess)render()});
const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ehIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function blocoBaixar(){if(instalado())return '';return `<div class="cartao baixar"><img src="icone-192.png" alt=""><div><b>Baixe o app no celular</b><small>Abre direto pela tela inicial, como os outros apps.</small></div><button class="btn sec" id="baixar" type="button">📲 Baixar</button></div>`}
async function baixar(){
  if(PEDIDO){const p=PEDIDO;PEDIDO=null;p.prompt();try{await p.userChoice}catch(e){}render();return}
  const comp='<svg viewBox="0 0 24 24" width="17" height="17" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ios=`<b>iPhone</b><ol><li>Abra este endereço no <b>Safari</b>.</li><li>Toque em ${comp} <b>Compartilhar</b>.</li><li>Toque em <b>Adicionar à Tela de Início</b> e depois em <b>Adicionar</b>.</li></ol>`;
  const and=`<b>Android</b><ol><li>Abra este endereço no <b>Chrome</b>.</li><li>Toque nos três pontinhos <b>⋮</b>.</li><li>Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</li></ol>`;
  modal(`<h2>📲 Baixar o app</h2>${ehIOS()?ios:/Android/i.test(navigator.userAgent)?and:and+ios}
    <a class="btn sec" style="width:100%" href="https://wa.me/?text=${encodeURIComponent('Painel de e-mails LegislaGov: '+BASE)}" target="_blank" rel="noopener">💬 Mandar o endereço pelo WhatsApp</a>
    <div class="rodape"><button class="btn pri" id="fx">Fechar</button></div>`,m=>m.querySelector('#fx').onclick=fechar);
}
function telaEntrada(){
  if(!E.entrada){api('entrada').then(r=>{E.entrada=r;render()}).catch(()=>{E.entrada={erro:true};render()});return '<div class="vazio">Carregando…</div>'}
  const pa=E.entrada.primeiroAcesso;
  return `<div class="cx entrada"><div class="logo"><img src="icone-192.png" alt=""></div>
  <h1>${pa?'Primeiro acesso':'Painel de e-mails'}</h1><p class="sub">${pa?'Crie o usuário LegislaGov, que cadastra os órgãos e os administradores de e-mail.':'Entre com o seu usuário e senha.'}</p>
  ${E.entrada.erro?'<p class="faixa prep">Sem conexão com o servidor. Confira a internet e tente de novo.</p>':''}
  <form class="cartao" id="fEnt" onsubmit="return false">
    ${pa?'<label for="eNome">Nome</label><input id="eNome" autocomplete="name">':''}
    <label for="eUsu">Usuário</label><input id="eUsu" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="eSen">Senha${pa?' (mínimo 8 caracteres)':''}</label><input id="eSen" type="password" autocomplete="${pa?'new-password':'current-password'}">
    ${pa?'<label for="eSen2">Repita a senha</label><input id="eSen2" type="password" autocomplete="new-password">':''}
    <button class="btn pri" id="eBt" type="submit">${pa?'Criar e entrar':'Entrar'}</button><div class="erro" id="eMsg"></div>
  </form>${blocoBaixar()}<p class="rod">LegislaGov · legislagov.com.br</p></div>`;
}
function ligarEntrada(){
  const b=$('#baixar');if(b)b.onclick=baixar;
  const f=$('#fEnt');if(!f)return;
  f.onsubmit=async ev=>{ev.preventDefault();const msg=$('#eMsg');msg.textContent='';
    const usuario=$('#eUsu').value.trim(),senha=$('#eSen').value;
    try{let r;
      if(E.entrada.primeiroAcesso){const nome=$('#eNome').value.trim();if(!nome||!usuario){msg.textContent='Preencha o nome e o usuário.';return}
        if(senha.length<8){msg.textContent='A senha precisa ter pelo menos 8 caracteres.';return}if(senha!==$('#eSen2').value){msg.textContent='As senhas não são iguais.';return}
        r=await api('primeiro',{metodo:'POST',corpo:{nome,usuario,senha}})}
      else{if(!usuario||!senha){msg.textContent='Digite o usuário e a senha.';return}r=await api('entrar',{metodo:'POST',corpo:{usuario,senha}})}
      TOKEN=r.token;try{localStorage.setItem('lge_token',TOKEN)}catch(e){}carregar();
    }catch(e){msg.textContent=e.status?e.message:'Sem conexão. Tente de novo.';$('#eSen').value=''}};
}
function sairLocal(){TOKEN='';E.sess=null;E.caixas=[];E.entrada=null;try{localStorage.removeItem('lge_token')}catch(e){}render()}

/* ===================== nova senha pelo link ===================== */
const NOVA=new URLSearchParams(location.search).get('nova');
let LINK=null;
function telaLink(){
  if(!LINK){api('link',{q:'t='+encodeURIComponent(NOVA)}).then(r=>{LINK=r;render()}).catch(e=>{LINK={erro:e.message};render()});return '<div class="vazio">Carregando…</div>'}
  return `<div class="cx entrada"><div class="logo"><img src="icone-192.png" alt=""></div><h1>Nova senha do e-mail</h1>
  ${LINK.erro?`<p class="faixa prep">${esc(LINK.erro)}</p>`:LINK.feito?`<p class="faixa ${LINK.feito.aplicado?'ok':'prep'}">${esc(LINK.feito.mensagem)}</p>`:`
  <p class="sub">Para a caixa <b>${esc(LINK.email)}</b></p>
  <form class="cartao" id="fLink" onsubmit="return false"><input type="email" value="${esc(LINK.email)}" autocomplete="username" hidden>
    <label for="n1">Senha nova (mínimo 8 caracteres)</label><input id="n1" type="password" autocomplete="new-password">
    <label for="n2">Repita a senha nova</label><input id="n2" type="password" autocomplete="new-password">
    <div class="dica">Use letras, números e um símbolo. Não use a mesma senha de outros sites.</div>
    <button class="btn pri" type="submit">Salvar senha nova</button><div class="erro" id="nMsg"></div></form>`}
  <p class="rod">Administração de e-mail · LegislaGov</p></div>`;
}
function ligarLink(){const f=$('#fLink');if(!f)return;f.onsubmit=async ev=>{ev.preventDefault();const a=$('#n1').value,b=$('#n2').value,m=$('#nMsg');
  if(a.length<8){m.textContent='A senha precisa ter pelo menos 8 caracteres.';return}if(a!==b){m.textContent='As senhas não são iguais.';return}
  try{LINK.feito=await api('link',{metodo:'POST',corpo:{t:NOVA,senha:a}});render()}catch(e){m.textContent=e.message}}}

/* ===================== painel ===================== */
const orgAtual=()=>E.orgs.find(o=>o.id===E.org)||E.orgs[0];
async function carregar(){
  try{const r=await api('eu');E.sess=r.sessao;E.orgs=r.orgs;E.provedores=r.provedores;
    if(!E.orgs.some(o=>o.id===E.org))E.org=E.orgs[0]?.id||'';render();if(E.org)await carregarCaixas()}
  catch(e){if(e.message!=='sessao'){render();toast('Sem conexão com o servidor.')}}
}
async function carregarCaixas(){if(!E.org)return;try{E.caixas=(await api('caixas',{q:'org='+E.org})).caixas;try{localStorage.setItem('lge_org',E.org)}catch(e){}render()}catch(e){if(e.message!=='sessao')toast(e.message)}}
function lista(){
  const t=E.busca.trim().toLowerCase();
  let l=E.caixas.filter(c=>c.status==='ativa'&&(!t||c.email.includes(t)||(c.nome||'').toLowerCase().includes(t)));
  const pct=c=>c.cota_mb?c.uso_mb/c.cota_mb:0;
  const ord={email:(a,b)=>a.email.localeCompare(b.email),emaild:(a,b)=>b.email.localeCompare(a.email),uso:(a,b)=>b.uso_mb-a.uso_mb,pct:(a,b)=>pct(b)-pct(a),novas:(a,b)=>(b.criado||0)-(a.criado||0)}[E.ordem];
  return l.sort(ord);
}
function telaPainel(){
  const o=orgAtual(), s=E.sess, sup=s.perfil==='super';
  const topo=`<header class="topo"><div class="cx"><div class="marca"><img src="icone-192.png" alt=""><div>Painel de e-mails<small>LegislaGov</small></div></div><div class="esp"></div>
    ${sup&&E.orgs.length>1?`<select class="orgsel" id="orgSel" aria-label="Órgão">${E.orgs.map(x=>`<option value="${x.id}" ${x.id===E.org?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>`:''}
    <button class="menu-bt" id="menuBt" aria-expanded="${E.menu}">☰ ${esc(s.nome.split(' ')[0])}</button></div>
    ${E.menu?`<div class="menu" role="menu"><div class="quem"><b>${esc(s.nome)}</b>${sup?'LegislaGov (todos os órgãos)':'Administrador de e-mail'}</div>
      ${sup&&E.orgs.length>1?`<button data-m="trocaOrg">🏛️ Trocar de órgão</button>`:''}
      ${o?`<button data-m="org">⚙️ Dados do órgão${sup?' e provedor':''}</button>`:''}
      ${sup?`<button data-m="novaOrg">➕ Cadastrar órgão</button>`:''}
      <button data-m="usuarios">👥 Usuários do painel</button>
      <button data-m="senha">🔐 Minha senha</button>
      <button data-m="sair">🚪 Sair</button></div>`:''}</header>`;
  if(!o)return topo+`<main class="cx"><div class="vazio"><h1>Nenhum órgão cadastrado</h1><p>${sup?'Cadastre o primeiro órgão (por exemplo: Prefeitura, domínio nevespaulista.sp.gov.br).':'Peça à LegislaGov para ligar o seu usuário a um órgão.'}</p>${sup?'<button class="btn pri" id="novaOrgBt">➕ Cadastrar órgão</button>':''}</div></main>`;
  const l=lista();
  return topo+`<main class="cx">
  <h1>${esc(o.nome)}</h1><p class="dom">@${esc(o.dominio)} · ${o.caixas} caixa(s) ativa(s)</p>
  ${o.conectado?`<div class="faixa ok">✓ Ligado ao provedor <b>${esc(o.provedorNome)}</b>: as ações valem nas caixas de verdade.</div>`
    :`<div class="faixa prep"><span>⚙️</span><div><b>Modo de preparação.</b> O provedor de e-mail deste órgão ainda não foi ligado. Tudo funciona e fica registrado no histórico, mas nada muda nas caixas de verdade e nenhuma senha é guardada. Quando o provedor for contratado, as mesmas ações passam a valer.</div></div>`}
  <div class="ferr"><input id="busca" type="search" placeholder="Buscar e-mail ou nome" value="${esc(E.busca)}" aria-label="Buscar e-mail">
    <select id="ordem" aria-label="Ordenar">${[['email','Ordenar por e-mail crescente'],['emaild','Ordenar por e-mail decrescente'],['uso','Mais espaço usado'],['pct','Mais perto do limite'],['novas','Criadas por último']].map(([v,t])=>`<option value="${v}" ${E.ordem===v?'selected':''}>${t}</option>`).join('')}</select></div>
  <nav class="links" aria-label="Atalhos">${o.webmail?`<a href="${esc(o.webmail)}" target="_blank" rel="noopener">✉️ Webmail</a>`:''}<button id="histBt">📄 Histórico de ações</button><button id="excBt">🗑️ Caixas excluídas</button><button id="impBt">⬆️ Importar lista</button></nav>
  <div class="barra"><div class="tot">Total de e-mails encontrados: <b>${l.length}</b></div>
    <button class="btn sec" id="csvBt">⬇️ Exportar e-mails para CSV</button><button class="btn pri" id="novaBt">➕ Nova caixa</button></div>
  ${l.length?`<div class="tabela"><table><thead><tr><th>E-MAIL</th><th>USO / COTA / %</th><th>AÇÕES</th></tr></thead><tbody>
    ${l.map(c=>{const p=c.cota_mb?Math.min(100,c.uso_mb/c.cota_mb*100):0;return `<tr>
      <td class="em"><b>${esc(c.email)}</b>${c.nome?`<small>${esc(c.nome)}</small>`:''}</td>
      <td><div class="uso"><div class="medidor" role="img" aria-label="${p.toFixed(0)}% usado"><i class="${p>=90?'cheio':p>=70?'alto':''}" style="width:${Math.max(p,c.uso_mb>0?1:0).toFixed(1)}%"></i></div><span>${fmtTam(c.uso_mb)} / ${fmtTam(c.cota_mb)} · ${p.toFixed(0)}%</span></div></td>
      <td><div class="acoes"><button class="acao ed" data-ed="${c.id}" title="Alterar" aria-label="Alterar ${esc(c.email)}">${ICO.ed}</button>
        <button class="acao av" data-av="${c.id}" title="Enviar aviso" aria-label="Enviar aviso para ${esc(c.email)}">${ICO.av}</button>
        <button class="acao ex" data-ex="${c.id}" title="Excluir" aria-label="Excluir ${esc(c.email)}">${ICO.ex}</button></div></td></tr>`}).join('')}
  </tbody></table></div>`:`<div class="vazio">${E.busca?'Nenhum e-mail com essa busca.':'Nenhuma caixa cadastrada ainda. Use <b>Nova caixa</b> ou <b>Importar lista</b> (o CSV exportado do provedor atual).'}</div>`}
  </main>`;
}
function ligarPainel(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(e=>e.onclick=ev=>fn(e,ev));
  on('#menuBt',()=>{E.menu=!E.menu;render()});
  on('[data-m]',e=>{E.menu=false;render();({trocaOrg:modalTrocaOrg,org:()=>modalOrg(orgAtual()),novaOrg:()=>modalOrg(null),usuarios:modalUsuarios,senha:modalMinhaSenha,sair:()=>{api('sair',{metodo:'POST'}).catch(()=>{});sairLocal()}})[e.dataset.m]()});
  on('#novaOrgBt',()=>modalOrg(null));
  const os=$('#orgSel');if(os)os.onchange=()=>{E.org=os.value;E.caixas=[];render();carregarCaixas()};
  const b=$('#busca');if(b)b.oninput=()=>{E.busca=b.value;const p=b.selectionStart;render();const n=$('#busca');n.focus();n.setSelectionRange(p,p)};
  const od=$('#ordem');if(od)od.onchange=()=>{E.ordem=od.value;render()};
  on('#histBt',modalHistorico);on('#excBt',modalExcluidas);on('#impBt',modalImportar);on('#csvBt',exportar);on('#novaBt',modalNova);
  on('[data-ed]',e=>modalAcoes(cx(e.dataset.ed)));on('[data-av]',e=>modalAviso(cx(e.dataset.av)));on('[data-ex]',e=>modalExcluir(cx(e.dataset.ex)));
}
const cx=id=>E.caixas.find(c=>c.id===id);
document.addEventListener('click',e=>{if(E.menu&&!e.target.closest('.menu')&&!e.target.closest('#menuBt')){E.menu=false;render()}});

/* ===================== ações da caixa ===================== */
function modalAcoes(c){
  modal(`<h2>Alterar</h2><p class="alvo">${esc(c.email)}</p><div class="opcoes">
    <button class="opcao" data-o="senha"><span class="ic">🔑</span><span><b>Alterar senha</b><small>Você define a senha nova da caixa.</small></span></button>
    <button class="opcao" data-o="link"><span class="ic">🔗</span><span><b>Enviar link de nova senha</b><small>O dono da caixa cria a senha dele (link de uso único, vale 24 h).</small></span></button>
    <button class="opcao" data-o="nome"><span class="ic">✏️</span><span><b>Corrigir o nome do e-mail</b><small>Para erro de digitação no endereço.</small></span></button>
    <button class="opcao" data-o="dados"><span class="ic">📇</span><span><b>Responsável, contato e cota</b><small>Nome, e-mail e celular para recuperar a senha, espaço da caixa.</small></span></button>
    <button class="opcao" data-o="avisos"><span class="ic">💬</span><span><b>Avisos enviados</b><small>O que já foi mandado para esta caixa.</small></span></button>
  </div><div class="rodape"><button class="btn sec" id="fx">Fechar</button></div>`,m=>{
    m.querySelector('#fx').onclick=fechar;
    m.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>({senha:modalSenha,link:modalLink,nome:modalNome,dados:modalDados,avisos:modalAvisos})[b.dataset.o](c));
  });
}
async function acao(op,dados){return api('caixa',{metodo:'POST',corpo:Object.assign({op},dados)})}
function campoSenha(id,rot){return `<label for="${id}">${rot}</label><div class="linkbox"><input id="${id}" type="text" autocomplete="new-password" spellcheck="false"><button class="btn sec" type="button" data-gera="${id}">Gerar</button></div>`}
function ligarGera(m){m.querySelectorAll('[data-gera]').forEach(b=>b.onclick=()=>{m.querySelector('#'+b.dataset.gera).value=gerarSenha()})}
function modalSenha(c){
  modal(`<h2>🔑 Alterar senha</h2><p class="alvo">${esc(c.email)}</p>${campoSenha('sN','Senha nova (mínimo 8 caracteres)')}
    <div class="dica">"Gerar" cria uma senha forte. Passe a senha ao dono da caixa por um meio seguro.</div><div class="erro" id="sM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Alterar senha</button></div>`,m=>{
    ligarGera(m);m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const v=m.querySelector('#sN').value;if(v.length<8){m.querySelector('#sM').textContent='A senha precisa ter pelo menos 8 caracteres.';return}
      try{const r=await acao('senha',{id:c.id,senha:v});resultado(m,r);m.querySelector('#ok').remove();m.querySelector('#cn').textContent='Fechar';carregarCaixas()}catch(e){m.querySelector('#sM').textContent=e.message}};
  });
}
async function modalLink(c){
  let r;try{r=await acao('link',{id:c.id,base:BASE})}catch(e){toast(e.message);return}
  const msg=`Olá! Para criar a nova senha do e-mail ${r.email}, abra este link (vale ${r.horas} horas e só pode ser usado uma vez):\n${r.link}`;
  const tel=(r.celular||'').replace(/\D/g,''), zap=tel?'https://wa.me/'+(tel.startsWith('55')?tel:'55'+tel)+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg);
  modal(`<h2>🔗 Link de nova senha</h2><p class="alvo">${esc(r.email)}</p>
    <div class="linkbox"><input id="lk" readonly value="${esc(r.link)}" aria-label="Link"><button class="btn sec" id="cp">Copiar</button></div>
    <div class="dica">Vale ${r.horas} horas e funciona uma vez só. Um link novo cancela o anterior.</div>
    <div class="opcoes" style="margin-top:14px">
      <a class="opcao" href="${zap}" target="_blank" rel="noopener"><span class="ic">💬</span><span><b>Mandar pelo WhatsApp</b><small>${tel?'Para o celular cadastrado: '+esc(r.celular):'Escolha o contato no WhatsApp'}</small></span></a>
      ${r.contato?`<a class="opcao" href="mailto:${esc(r.contato)}?subject=${encodeURIComponent('Nova senha do e-mail '+r.email)}&body=${encodeURIComponent(msg)}"><span class="ic">✉️</span><span><b>Mandar para o e-mail de contato</b><small>${esc(r.contato)}</small></span></a>`:''}
    </div>
    ${orgAtual().conectado?'':'<div class="prep-msg">Modo de preparação: o dono da caixa consegue abrir o link e criar a senha, mas ela só passa a valer quando o provedor for ligado.</div>'}
    <div class="rodape"><button class="btn pri" id="fx">Fechar</button></div>`,m=>{
    m.querySelector('#fx').onclick=fechar;
    m.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(r.link);toast('Link copiado')}catch(e){m.querySelector('#lk').select();document.execCommand('copy');toast('Link copiado')}};
  });
}
function modalNome(c){
  const [local,dom]=c.email.split('@');
  modal(`<h2>✏️ Corrigir o nome do e-mail</h2><p class="alvo">Hoje: ${esc(c.email)}</p>
    <label for="nl">Nome certo</label><div class="sufixo"><input id="nl" value="${esc(local)}" autocapitalize="none" spellcheck="false"><span>@${esc(dom)}</span></div>
    <div class="dica" id="nPrev"></div>
    <div class="dica">Depois da mudança, o endereço antigo deixa de receber mensagens. Avise o dono da caixa.</div><div class="erro" id="nM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Salvar novo nome</button></div>`,m=>{
    const i=m.querySelector('#nl'),pv=()=>{const v=i.value.trim().toLowerCase();m.querySelector('#nPrev').innerHTML=v&&v!==local?`Vai ficar: <b>${esc(v)}@${esc(dom)}</b>`:''};i.oninput=pv;
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const v=i.value.trim().toLowerCase();if(!v||v===local){m.querySelector('#nM').textContent='Digite o nome certo do e-mail.';return}
      try{const r=await acao('editar',{id:c.id,email:v});resultado(m,r);m.querySelector('#ok').remove();m.querySelector('#cn').textContent='Fechar';carregarCaixas()}catch(e){m.querySelector('#nM').textContent=e.message}};
  });
}
function modalDados(c){
  modal(`<h2>📇 Responsável, contato e cota</h2><p class="alvo">${esc(c.email)}</p>
    <label for="dn">Nome do responsável</label><input id="dn" value="${esc(c.nome)}">
    <label for="dc">E-mail de contato (outro e-mail, para recuperar a senha)</label><input id="dc" type="email" value="${esc(c.contato)}">

    <label for="dq">Cota (espaço da caixa), em MB</label><input id="dq" inputmode="decimal" value="${Math.round(c.cota_mb)}">
    <div class="dica">1 GB = 1024 MB. ${c.senha_em?'Senha alterada pela última vez em '+dataHora(c.senha_em)+'.':''}</div><div class="erro" id="dM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,m=>{
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{try{const r=await acao('editar',{id:c.id,nome:m.querySelector('#dn').value.trim(),contato:m.querySelector('#dc').value.trim(),celular:m.querySelector('#dt').value.trim(),cota_mb:m.querySelector('#dq').value.replace(',','.')});
      fechar();toast(r.mensagem);carregarCaixas()}catch(e){m.querySelector('#dM').textContent=e.message}};
  });
}
function modalAviso(c){
  modal(`<h2>💬 Enviar aviso</h2><p class="alvo">Para ${esc(c.email)}</p>
    <label for="aa">Assunto</label><input id="aa" placeholder="Ex.: Sua caixa está quase cheia">
    <label for="at">Mensagem</label><textarea id="at" placeholder="Escreva o aviso para o dono da caixa"></textarea>
    <div class="dica">Modelos: <button type="button" class="tag" data-mod="cheia">caixa quase cheia</button> <button type="button" class="tag" data-mod="senha">trocar a senha</button> <button type="button" class="tag" data-mod="manut">manutenção</button></div>
    <div class="erro" id="aM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Enviar aviso</button></div>`,m=>{
    const MOD={cheia:['Sua caixa de e-mail está quase cheia',`A caixa ${c.email} está usando ${fmtTam(c.uso_mb)} de ${fmtTam(c.cota_mb)}. Apague mensagens antigas e esvazie a lixeira para continuar recebendo e-mails.`],
      senha:['Troque a senha do seu e-mail',`Por segurança, troque a senha da caixa ${c.email} nos próximos dias. Se precisar de ajuda, fale com a administração de e-mail.`],
      manut:['Manutenção no e-mail','O e-mail pode ficar indisponível por alguns minutos durante a manutenção programada. Nenhuma mensagem será perdida.']};
    m.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{const [a,t]=MOD[b.dataset.mod];m.querySelector('#aa').value=a;m.querySelector('#at').value=t});
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const a=m.querySelector('#aa').value.trim(),t=m.querySelector('#at').value.trim();if(!a||!t){m.querySelector('#aM').textContent='Escreva o assunto e a mensagem.';return}
      try{const r=await acao('aviso',{id:c.id,assunto:a,texto:t});resultado(m,r);m.querySelector('#ok').remove();m.querySelector('#cn').textContent='Fechar'}catch(e){m.querySelector('#aM').textContent=e.message}};
  });
}
async function modalAvisos(c){
  let it=[];try{it=(await api('avisos',{q:'id='+c.id})).itens}catch(e){toast(e.message);return}
  modal(`<h2>💬 Avisos enviados</h2><p class="alvo">${esc(c.email)}</p>${it.length?`<ul class="hist">${it.map(a=>`<li><time>${dataHora(a.quando)} · ${esc(a.por)}</time><b>${esc(a.assunto)}</b><div>${esc(a.texto)}</div><span class="tag ${a.situacao==='enviado'?'ok':'prep'}">${esc(a.situacao)}</span></li>`).join('')}</ul>`:'<p class="dica">Nenhum aviso ainda.</p>'}
    <div class="rodape"><button class="btn sec" id="fx">Fechar</button><button class="btn pri" id="nv">Novo aviso</button></div>`,m=>{m.querySelector('#fx').onclick=fechar;m.querySelector('#nv').onclick=()=>modalAviso(c)});
}
function modalExcluir(c){
  modal(`<h2>Excluir caixa de e-mail</h2><p class="alvo">${esc(c.email)}</p>
    <p>A caixa deixa de receber mensagens.${orgAtual().conectado?' No provedor, as mensagens dela podem ser apagadas.':''} Ela fica em <b>Caixas excluídas</b> e pode ser restaurada.</p>
    <label for="xc">Para confirmar, digite o e-mail completo</label><input id="xc" autocapitalize="none" spellcheck="false" placeholder="${esc(c.email)}">
    <div class="erro" id="xM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn perigo" id="ok" disabled>Excluir</button></div>`,m=>{
    const i=m.querySelector('#xc'),ok=m.querySelector('#ok');i.oninput=()=>ok.disabled=i.value.trim().toLowerCase()!==c.email;
    m.querySelector('#cn').onclick=fechar;
    ok.onclick=async()=>{try{const r=await acao('excluir',{id:c.id,confirma:i.value});fechar();toast(r.aplicado?'Caixa excluída':'Caixa excluída da lista (modo de preparação)');carregarCaixas()}catch(e){m.querySelector('#xM').textContent=e.message}};
  });

function modalNova(){
  const o=orgAtual();
  modal(`<h2>➕ Nova caixa de e-mail</h2><p class="alvo">${esc(o.nome)}</p>
    <label for="ne">E-mail</label><div class="sufixo"><input id="ne" autocapitalize="none" spellcheck="false" placeholder="ex.: compras"><span>@${esc(o.dominio)}</span></div>
    <label for="nn">Nome do responsável</label><input id="nn">
    ${campoSenha('ns','Senha (mínimo 8 caracteres)')}
    <label for="nq">Cota, em MB</label><input id="nq" inputmode="decimal" value="${Math.round(o.cota_padrao)}">
    <label for="nc">E-mail de contato (opcional)</label><input id="nc" type="email">
    <label for="nt">Celular com DDD (opcional)</label><input id="nt" inputmode="tel">
    <div class="erro" id="nM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Criar caixa</button></div>`,m=>{
    ligarGera(m);m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const v=k=>m.querySelector(k).value.trim();
      if(!v('#ne')){m.querySelector('#nM').textContent='Digite o nome do e-mail.';return}
      if(m.querySelector('#ns').value.length<8){m.querySelector('#nM').textContent='A senha precisa ter pelo menos 8 caracteres.';return}
      try{const r=await acao('criar',{org:o.id,email:v('#ne'),nome:v('#nn'),senha:m.querySelector('#ns').value,cota_mb:v('#nq').replace(',','.'),contato:v('#nc'),celular:v('#nt')});
        resultado(m,r);m.querySelector('#ok').remove();m.querySelector('#cn').textContent='Fechar';carregarCaixas();carregar()}catch(e){m.querySelector('#nM').textContent=e.message}};
  });
}
function exportar(){
  const l=lista(), linhas=[['E-mail','Responsável','Uso (MB)','Cota (MB)','%','Contato','Celular']].concat(l.map(c=>[c.email,c.nome,c.uso_mb.toFixed(2),c.cota_mb.toFixed(0),(c.cota_mb?c.uso_mb/c.cota_mb*100:0).toFixed(1),c.contato,c.celular]));
  const csv='﻿'+linhas.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='emails-'+orgAtual().dominio+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function modalImportar(){
  modal(`<h2>⬆️ Importar lista de e-mails</h2><p class="alvo">${esc(orgAtual().nome)} · @${esc(orgAtual().dominio)}</p>
    <p>Use o arquivo CSV exportado no painel do provedor atual (na Locaweb: <b>Exportar e-mails para csv</b>). O painel acha sozinho as colunas de e-mail, uso e cota. Caixas que já existem só têm o uso atualizado.</p>
    <label for="if">Arquivo CSV</label><input id="if" type="file" accept=".csv,text/csv,.txt">
    <label for="it">Ou cole a lista (um e-mail por linha)</label><textarea id="it" placeholder="nome@${esc(orgAtual().dominio)}"></textarea>
    <div class="erro" id="iM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Importar</button></div>`,m=>{
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{let texto=m.querySelector('#it').value;const f=m.querySelector('#if').files[0];
      if(f){if(f.size>4e6){m.querySelector('#iM').textContent='Arquivo grande demais.';return}const buf=await f.arrayBuffer();try{texto=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){texto=new TextDecoder('windows-1252').decode(buf)}}
      if(!texto.trim()){m.querySelector('#iM').textContent='Escolha o arquivo ou cole a lista.';return}
      try{const r=await acao('importar',{org:E.org,texto});r.mensagem=`${r.novos} caixa(s) nova(s), ${r.atualizados} atualizada(s)${r.outroDominio?`, ${r.outroDominio} de outro domínio ignorada(s)`:''}.`;resultado(m,r);m.querySelector('#ok').remove();m.querySelector('#cn').textContent='Fechar';carregarCaixas();carregar()}
      catch(e){m.querySelector('#iM').textContent=e.message}};
  });
}
async function modalHistorico(){
  let it=[];try{it=(await api('historico',{q:'org='+E.org})).itens}catch(e){toast(e.message);return}
  modal(`<h2>📄 Histórico de ações</h2><p class="alvo">${esc(orgAtual().nome)} · últimas ${it.length}</p>
    ${it.length?`<ul class="hist">${it.map(x=>`<li><time>${dataHora(x.quando)} · ${esc(x.por||'')}</time><b>${esc(x.acao)}</b>${x.alvo?' · '+esc(x.alvo):''}${x.detalhe?`<div class="dica">${esc(x.detalhe)}</div>`:''}</li>`).join('')}</ul>`:'<p class="dica">Nada registrado ainda.</p>'}
    <div class="rodape"><button class="btn pri" id="fx">Fechar</button></div>`,m=>m.querySelector('#fx').onclick=fechar);
}
function modalExcluidas(){
  const l=E.caixas.filter(c=>c.status==='excluida');
  modal(`<h2>🗑️ Caixas excluídas</h2>${l.length?`<ul class="hist">${l.map(c=>`<li><b>${esc(c.email)}</b><time>excluída em ${dataHora(c.alterado)}</time><button class="btn sec" data-rest="${c.id}" style="margin-top:6px">Restaurar</button></li>`).join('')}</ul>`:'<p class="dica">Nenhuma caixa excluída.</p>'}
    <div class="rodape"><button class="btn pri" id="fx">Fechar</button></div>`,m=>{m.querySelector('#fx').onclick=fechar;
    m.querySelectorAll('[data-rest]').forEach(b=>b.onclick=async()=>{try{const r=await acao('restaurar',{id:b.dataset.rest});toast(r.aplicado?'Caixa restaurada':'Caixa restaurada na lista');fechar();carregarCaixas()}catch(e){toast(e.message)}})});
}

/* ===================== órgão, usuários, senha ===================== */
function modalTrocaOrg(){modal(`<h2>🏛️ Trocar de órgão</h2><div class="opcoes">${E.orgs.map(o=>`<button class="opcao" data-org="${o.id}"><span class="ic">🏛️</span><span><b>${esc(o.nome)}</b><small>@${esc(o.dominio)} · ${o.caixas} caixa(s)</small></span></button>`).join('')}</div><div class="rodape"><button class="btn sec" id="fx">Fechar</button></div>`,
  m=>{m.querySelector('#fx').onclick=fechar;m.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{E.org=b.dataset.org;E.caixas=[];fechar();render();carregarCaixas()})})}
function modalOrg(o){
  const sup=E.sess.perfil==='super';
  modal(`<h2>${o?'⚙️ Dados do órgão':'➕ Cadastrar órgão'}</h2>
    <label for="on">Nome do órgão</label><input id="on" value="${esc(o?.nome||'')}" placeholder="Ex.: Prefeitura de Neves Paulista">
    <label for="od">Domínio dos e-mails</label><input id="od" value="${esc(o?.dominio||'')}" placeholder="nevespaulista.sp.gov.br" autocapitalize="none" ${o&&o.caixas?'disabled':''}>
    <label for="ow">Endereço do webmail (opcional)</label><input id="ow" value="${esc(o?.webmail||'')}" placeholder="https://webmail…">
    <label for="oq">Cota padrão das caixas novas, em MB</label><input id="oq" inputmode="decimal" value="${Math.round(o?.cota_padrao||1024)}">
    ${sup?`<label for="op">Provedor das caixas</label><select id="op">${E.provedores.map(p=>`<option value="${p.id}" ${(o?.provedor||'nenhum')===p.id?'selected':''}>${esc(p.nome)}${p.pronto||p.id==='nenhum'?'':' — integração a ligar'}</option>`).join('')}</select>
      <div class="dica">Enquanto a integração do provedor não estiver ligada no servidor, o painel continua em modo de preparação.</div>`:''}
    <div class="erro" id="oM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,m=>{
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const v=k=>m.querySelector(k)?m.querySelector(k).value.trim():undefined;
      try{const r=await api('orgs',{metodo:'POST',corpo:{id:o?.id,nome:v('#on'),dominio:o&&o.caixas?o.dominio:v('#od'),webmail:v('#ow'),cota_padrao:(v('#oq')||'').replace(',','.'),provedor:v('#op')}});
        fechar();if(!o)E.org=r.id;toast('Órgão salvo');carregar()}catch(e){m.querySelector('#oM').textContent=e.message}};
  });
}
async function modalUsuarios(){
  let us=[];try{us=(await api('usuarios')).usuarios}catch(e){toast(e.message);return}
  const nomeOrg=id=>(E.orgs.find(o=>o.id===id)||{}).nome||'';
  modal(`<h2>👥 Usuários do painel</h2><p class="dica" style="margin-top:0">Quem pode entrar neste painel. O administrador de e-mail vê só as caixas do órgão dele.</p>
    <div class="opcoes" style="margin-top:12px">${us.map(u=>`<button class="opcao" data-u="${u.id}"><span class="ic">${u.perfil==='super'?'⭐':'👤'}</span><span><b>${esc(u.nome)}${u.id===E.sess.id?' <span class="tag">você</span>':''}</b><small>usuário: ${esc(u.usuario)} · ${u.perfil==='super'?'LegislaGov (todos os órgãos)':'Administrador de e-mail · '+esc(nomeOrg(u.org))}</small></span></button>`).join('')}</div>
    <div class="rodape"><button class="btn sec" id="fx">Fechar</button><button class="btn pri" id="nv">➕ Novo usuário</button></div>`,m=>{
    m.querySelector('#fx').onclick=fechar;m.querySelector('#nv').onclick=()=>modalUsuario(null);
    m.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>modalUsuario(us.find(u=>u.id===b.dataset.u)));
  });
}
function modalUsuario(u){
  const sup=E.sess.perfil==='super';
  modal(`<h2>${u?'Editar usuário':'Novo usuário do painel'}</h2>
    <label for="un">Nome</label><input id="un" value="${esc(u?.nome||'')}">
    <label for="uu">Usuário (para entrar)</label><input id="uu" value="${esc(u?.usuario||'')}" autocapitalize="none" spellcheck="false" autocomplete="off">
    ${campoSenha('us',u?'Senha nova (deixe em branco para manter)':'Senha (mínimo 8 caracteres)')}
    ${sup?`<label for="up">Perfil</label><select id="up"><option value="adm" ${u?.perfil!=='super'?'selected':''}>Administrador de e-mail de um órgão</option><option value="super" ${u?.perfil==='super'?'selected':''}>LegislaGov (todos os órgãos)</option></select>
      <div id="uoB"><label for="uo">Órgão</label><select id="uo">${E.orgs.map(o=>`<option value="${o.id}" ${(u?.org||E.org)===o.id?'selected':''}>${esc(o.nome)}</option>`).join('')}</select></div>`:''}
    <div class="erro" id="uM"></div>
    <div class="rodape">${u&&u.id!==E.sess.id?'<button class="btn perigo" id="rm">Remover</button>':'<button class="btn sec" id="cn">Cancelar</button>'}<button class="btn pri" id="ok">Salvar</button></div>`,m=>{
    ligarGera(m);
    const up=m.querySelector('#up');if(up){const p=()=>m.querySelector('#uoB').style.display=up.value==='super'?'none':'';up.onchange=p;p()}
    const cn=m.querySelector('#cn');if(cn)cn.onclick=modalUsuarios;
    const rm=m.querySelector('#rm');if(rm)rm.onclick=async()=>{if(!confirm('Remover o acesso de '+u.nome+'?'))return;try{await api('usuarios',{metodo:'POST',corpo:{acao:'remover',id:u.id}});toast('Usuário removido');modalUsuarios()}catch(e){m.querySelector('#uM').textContent=e.message}};
    m.querySelector('#ok').onclick=async()=>{const v=k=>m.querySelector(k)?m.querySelector(k).value.trim():undefined;const senha=m.querySelector('#us').value;
      if(!u&&senha.length<8){m.querySelector('#uM').textContent='A senha precisa ter pelo menos 8 caracteres.';return}
      try{await api('usuarios',{metodo:'POST',corpo:{id:u?.id,nome:v('#un'),usuario:v('#uu'),senha:senha||undefined,perfil:v('#up')||'adm',org:v('#uo')||E.sess.org}});toast('Usuário salvo');modalUsuarios()}
      catch(e){m.querySelector('#uM').textContent=e.message}};
  });
}
function modalMinhaSenha(){
  modal(`<h2>🔐 Minha senha</h2><label for="m0">Senha atual</label><input id="m0" type="password" autocomplete="current-password">
    <label for="m1">Senha nova (mínimo 8 caracteres)</label><input id="m1" type="password" autocomplete="new-password">
    <label for="m2">Repita a senha nova</label><input id="m2" type="password" autocomplete="new-password"><div class="erro" id="mM"></div>
    <div class="rodape"><button class="btn sec" id="cn">Cancelar</button><button class="btn pri" id="ok">Trocar</button></div>`,m=>{
    m.querySelector('#cn').onclick=fechar;
    m.querySelector('#ok').onclick=async()=>{const a=m.querySelector('#m0').value,n=m.querySelector('#m1').value;
      if(n.length<8){m.querySelector('#mM').textContent='A senha nova precisa ter pelo menos 8 caracteres.';return}if(n!==m.querySelector('#m2').value){m.querySelector('#mM').textContent='As senhas novas não são iguais.';return}
      try{await api('minha-senha',{metodo:'POST',corpo:{atual:a,nova:n}});fechar();toast('Senha trocada')}catch(e){m.querySelector('#mM').textContent=e.message}};
  });
}

/* ===================== desenhar ===================== */
function render(){
  const app=$('#app');
  if(NOVA){app.innerHTML=telaLink();ligarLink();return}
  if(!TOKEN||!E.sess){app.innerHTML=TOKEN&&!E.sess?'<div class="vazio">Carregando…</div>':telaEntrada();ligarEntrada();return}
  app.innerHTML=telaPainel();ligarPainel();
}
render();
if(TOKEN&&!NOVA)carregar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
