<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videoaulas · GR Software</title>
<meta name="description" content="Área de videoaulas dos sistemas GR Software, para quem comprou.">
<meta name="robots" content="noindex">
<link rel="icon" href="../gr-emblema.webp">
<style>
:root{--bg:#000;--txt:#ededed;--sub:#9a9aa3;--lin:#ffffff17;--ciano:#19e3d0}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;caret-color:transparent;min-height:100%}
input{caret-color:auto}
a{color:inherit;text-decoration:none}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(16px,3vw,32px);border-bottom:1px solid var(--lin);background:#000000c4;backdrop-filter:blur(14px)}
.topo .marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.topo .marca img{height:28px}
.topo .marca small{font-weight:500;color:var(--sub);border-left:1px solid #ffffff2a;padding-left:10px;margin-left:2px}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.pl{font-size:14px;color:#c9c9d1;padding:8px 14px;border:1px solid #ffffff22;border-radius:999px;background:none;font-family:inherit;cursor:pointer}.pl:hover{background:#ffffff12;color:#fff}
.quem{font-size:13.5px;color:var(--sub);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,3vw,32px) 80px}
.ent{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(700px 380px at 50% 0,#2f6bff2a,transparent 70%)}
.cx{width:min(460px,100%);border-radius:24px;border:1px solid #19e3d040;background:#0a0b0e;padding:28px 26px 24px;box-shadow:0 30px 80px #000c}
.cx .lg{display:flex;justify-content:center}.cx .lg img{height:52px}
.cx h1{font-size:25px;letter-spacing:-.02em;text-align:center;margin-top:12px}
.cx .sb{color:var(--sub);text-align:center;margin-top:8px;line-height:1.5;font-size:15px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#ffffff0d;margin:20px 0 16px}
.abas button{height:40px;border-radius:10px;border:0;background:none;color:#c9c9d1;font:inherit;font-weight:600;cursor:pointer}
.abas button.on{background:#fff;color:#000}
label{display:block;font-size:13.5px;color:#c9c9d1;margin:12px 0 6px}
.cx input{width:100%;height:48px;border-radius:12px;border:1px solid #ffffff2a;background:#000;color:#fff;font:inherit;font-size:16px;padding:0 14px}
.cx input:focus{outline:2px solid var(--ciano);outline-offset:1px}
.cod{letter-spacing:.1em;text-transform:uppercase}
.bt{width:100%;height:50px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:#fff;color:#000;margin-top:18px}
.bt:disabled{opacity:.55}
.msg{font-size:14px;margin-top:10px;min-height:18px;text-align:center}.msg.err{color:#ff8a80}.msg.ok{color:#7ee2a8}
.lk{display:block;width:100%;background:none;border:0;color:var(--sub);font:inherit;font-size:14px;cursor:pointer;margin-top:12px;text-decoration:underline;text-align:center}
.dica{font-size:13px;color:var(--sub);line-height:1.5;margin-top:4px;padding:10px 12px;border-radius:10px;background:#ffffff08}
.comprar{display:block;text-align:center;margin-top:16px;font-size:14px;color:var(--sub)}.comprar a{color:var(--ciano);font-weight:600}
.cab h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em}.cab p{color:var(--sub);margin-top:8px}
.sis{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.sis button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--lin);background:#0a0b0e;border-radius:16px;padding:10px 16px 10px 10px;display:flex;gap:10px;align-items:center}
.sis button img{width:40px;height:40px;border-radius:11px}.sis button b{font-size:15px}
.sis button.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset;background:color-mix(in srgb,var(--c) 10%,#0a0b0e)}
.palco{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.palco{grid-template-columns:1fr}}
.tela{border:1px solid var(--lin);border-radius:20px;overflow:hidden;background:#0a0b0e}
.tela video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tela .inf{padding:16px 18px}.tela .inf h2{font-size:20px;letter-spacing:-.02em}.tela .inf p{color:var(--sub);margin-top:6px;line-height:1.5}
.vazio{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px}
.lista{border:1px solid var(--lin);border-radius:20px;background:#0a0b0e;padding:12px;display:flex;flex-direction:column;gap:4px;align-self:start}
.lista h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ciano);padding:10px 8px 4px}
.au{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid transparent;cursor:pointer;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.au:hover{background:#ffffff0a}.au.on{background:#19e3d014;border-color:#19e3d055}
.au .n{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#ffffff12;font-weight:700;font-size:13.5px}
.au.on .n{background:var(--ciano);color:#04201d}
.au b{display:block;font-size:14.5px;line-height:1.3}.au small{color:var(--sub);font-size:12.5px}
.mais{margin-top:30px;border:1px dashed #ffffff26;border-radius:18px;padding:16px 20px;color:var(--sub);font-size:14.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mais b{color:#fff}.mais input{height:42px;border-radius:10px;border:1px solid #ffffff2a;background:#000;color:#fff;font:inherit;padding:0 12px;width:170px}
.mais button{height:42px;border-radius:10px;border:0;padding:0 16px;font:inherit;font-weight:700;cursor:pointer;background:#fff;color:#000}
</style>
</head>
<body>
<header class="topo"><a class="marca" href="../"><img src="../gr-emblema.webp" alt="">GR Software <small>Videoaulas</small></a><div class="dir" id="topd"></div></header>
<div id="app"></div>
<script>
const SIS={restaurante:['GR Restaurante','../icone-restaurante-192.png','#e53935'],acougue:['GR Açougue','../icone-acougue-192.png','#f0b000'],mercado:['GR Mercado','../icone-mercado-192.png','#1e88e5']};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let P=null,cur=new URLSearchParams(location.search).get('s'),atual=null,modo='entrar';
async function api(a,corpo){const t=ls.get('gr-aulas-sess');const r=await fetch('/api/central/aulas/'+a,{method:corpo?'POST':'GET',cache:'no-store',headers:Object.assign({'Content-Type':'application/json','X-LG':'1'},t?{Authorization:'Bearer '+t}:{}),body:corpo?JSON.stringify(corpo):undefined});
  let d={};try{d=await r.json()}catch(e){}if(!r.ok){const e=new Error(d.erro||'Não foi possível agora. Tente de novo.');e.status=r.status;throw e}return d}

/* entrada: e-mail + senha; no primeiro acesso, e-mail + código de licença + senha nova */
function entrada(m,aviso){modo=m||modo;$('#topd').innerHTML='<a class="pl" href="../">← Voltar ao site</a>';
  const pri=modo==='primeiro';
  $('#app').innerHTML=`<div class="ent"><div class="cx"><div class="lg"><img src="../gr-emblema.webp" alt=""></div>
  <h1>Bem-vindo às Videoaulas</h1><p class="sb">Área exclusiva para quem comprou um sistema GR.</p>
  <div class="abas" role="tablist"><button type="button" role="tab" class="${pri?'':'on'}" aria-selected="${!pri}" data-m="entrar">Entrar</button><button type="button" role="tab" class="${pri?'on':''}" aria-selected="${pri}" data-m="primeiro">Primeiro acesso</button></div>
  <form id="fe">${pri?`<p class="dica">Use o <b style="color:#fff">e-mail da compra</b> e o <b style="color:#fff">código de licença</b> que chegou nele, e crie a sua senha. Nas próximas vezes você entra só com e-mail e senha.</p>
    <label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required>
    <label for="cd">Código de licença</label><input id="cd" class="cod" autocomplete="off" spellcheck="false" maxlength="14" placeholder="GR-XXXX-XXXX" required>
    <label for="s1">Crie uma senha</label><input id="s1" type="password" autocomplete="new-password" minlength="6" placeholder="Pelo menos 6 caracteres" required>
    <label for="s2">Repita a senha</label><input id="s2" type="password" autocomplete="new-password" minlength="6" required>
    <button class="bt" id="bo">Criar senha e entrar</button>`
   :`<label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required>
    <label for="s1">Senha</label><input id="s1" type="password" autocomplete="current-password" required>
    <button class="bt" id="bo">Entrar</button>`}
  <div class="msg" id="mg" role="status">${aviso?esc(aviso):''}</div></form>
  ${pri?'':'<button type="button" class="lk" id="esq">Esqueci a minha senha</button>'}
  <p class="comprar">Ainda não comprou? <a href="../#produtos">Conheça os sistemas</a></p></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>entrada(b.dataset.m));
  const es=$('#esq');if(es)es.onclick=()=>entrada('primeiro','Para criar uma senha nova, use o mesmo código de licença da compra.');
  const em=$('#em');em.value=ls.get('gr-aulas-email')||'';(em.value?($('#cd')||$('#s1')):em).focus();
  $('#fe').onsubmit=async e=>{e.preventDefault();const m=$('#mg'),b=$('#bo');m.className='msg';
    if(pri&&$('#s1').value!==$('#s2').value){m.className='msg err';m.textContent='As duas senhas não são iguais.';return}
    m.textContent='Conferindo…';b.disabled=true;
    try{const d=await api(pri?'ativar':'login',pri?{email:em.value,codigo:$('#cd').value,senha:$('#s1').value}:{email:em.value,senha:$('#s1').value});
      ls.set('gr-aulas-sess',d.token);ls.set('gr-aulas-email',d.email);await abrir()}
    catch(er){m.className='msg err';m.textContent=er.message}finally{b.disabled=false}}}

/* painel de quem entrou: só os cursos dos códigos ligados ao e-mail */
async function abrir(){try{P=await api('painel')}catch(e){ls.set('gr-aulas-sess',null);return entrada('entrar')}
  $('#topd').innerHTML=`<span class="quem">${esc(P.email)}</span><button class="pl" type="button" id="sai">Sair</button>`;
  $('#sai').onclick=async()=>{try{await api('sair',{})}catch(e){}ls.set('gr-aulas-sess',null);P=null;entrada('entrar')};
  if(!P.cursos.find(c=>c.sistema===cur))cur=(P.cursos[0]||{}).sistema;atual=null;painel()}
function painel(){const cs=P.cursos,c=cs.find(x=>x.sistema===cur);
  let h=`<main><div class="cab"><h1>Minhas videoaulas</h1><p>${cs.length?'Escolha o curso e a aula. Você continua conectado neste aparelho por 30 dias.':'Nenhum curso ligado a este e-mail ainda.'}</p></div>`;
  if(cs.length)h+=`<div class="sis" role="tablist">${cs.map(x=>{const s=SIS[x.sistema]||[x.nome,'../icone-gr-192.png','#19e3d0'];return `<button type="button" role="tab" aria-selected="${x.sistema===cur}" class="${x.sistema===cur?'on':''}" style="--c:${s[2]}" data-s="${x.sistema}"><img src="${s[1]}" alt=""><b>${esc(s[0])}</b></button>`}).join('')}</div>`;
  if(c){const aulas=c.aulas||[],a=aulas.find(x=>x.id===atual)||aulas[0];if(a)atual=a.id;
    const grupos={};aulas.forEach(x=>{(grupos[x.modulo||'Aulas']=grupos[x.modulo||'Aulas']||[]).push(x)});let n=0;
    h+=`<div class="palco"><section class="tela">${a?`<video controls playsinline preload="metadata" src="${esc(a.url)}"></video><div class="inf"><h2>${esc(a.titulo)}</h2><p>${esc(a.descr||'')}</p></div>`:'<div class="vazio">As aulas deste curso estão sendo gravadas e chegam em breve.</div>'}</section>
    <aside class="lista" aria-label="Aulas">${Object.entries(grupos).map(([g,l])=>`<h3>${esc(g)}</h3>`+l.map(x=>`<button type="button" class="au ${x.id===atual?'on':''}" data-id="${esc(x.id)}"><span class="n">${++n}</span><span><b>${esc(x.titulo)}</b>${x.descr?`<small>${esc(x.descr)}</small>`:''}</span></button>`).join('')).join('')||'<p style="color:var(--sub);padding:10px">Aulas em breve.</p>'}
    <p style="color:var(--sub);font-size:12.5px;padding:8px">Novas aulas aparecem aqui sozinhas.</p></aside></div>`}
  h+=`<form class="mais" id="fm"><span>Comprou outro sistema? <b>Adicione o curso</b> com o novo código:</span><input id="mc" class="cod" placeholder="GR-XXXX-XXXX" maxlength="14" autocomplete="off" aria-label="Novo código"><input id="ms" type="password" placeholder="Sua senha" autocomplete="current-password" aria-label="Sua senha"><button>Adicionar</button><span class="msg" id="mm" role="status" style="margin:0"></span></form></main>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cur=b.dataset.s;atual=null;history.replaceState(null,'','?s='+cur);painel()});
  document.querySelectorAll('.au[data-id]').forEach(b=>b.onclick=()=>{atual=b.dataset.id;painel();scrollTo({top:0,behavior:'smooth'})});
  $('#fm').onsubmit=async e=>{e.preventDefault();const m=$('#mm');m.className='msg';m.textContent='Conferindo…';
    try{const d=await api('ativar',{email:P.email,codigo:$('#mc').value,senha:$('#ms').value});ls.set('gr-aulas-sess',d.token);await abrir()}catch(er){m.className='msg err';m.textContent=er.message}}}
(ls.get('gr-aulas-sess')?abrir():entrada(new URLSearchParams(location.search).has('primeiro')?'primeiro':'entrar'));
</script>
</body>
</html>
